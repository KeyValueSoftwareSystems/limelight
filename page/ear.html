<title>Verify</title>
<style>
:root{--bg:#0a0d13;--pan:#0f141d;--line:#1b2230;--line2:#263047;--ink:#e6e9f0;
  --dim:#9aa3b8;--faint:#5c6478;--amb:#e8a33d;--ok:#5bb98c;--bad:#e0655f;--blu:#6fa8dc}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:13px/1.55 ui-sans-serif,system-ui,sans-serif;margin:0}
.wrap{max-width:none;margin:0;padding:14px 20px 80px}
button,select{background:#182031;color:var(--ink);border:1px solid var(--line2);
  border-radius:6px;padding:6px 12px;font:inherit;cursor:pointer}
button:hover{border-color:#41506e}
button.on{background:var(--amb);color:#171003;font-weight:600}
button.yes{border-color:#2f5f4a} button.yes.on{background:var(--ok);color:#05140d;border-color:var(--ok)}
button.no{border-color:#6b3330} button.no.on{background:var(--bad);color:#2a0e0c;border-color:var(--bad)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.mono{font:12px ui-monospace,monospace;font-variant-numeric:tabular-nums}
#seek{flex:1;min-width:200px;accent-color:var(--ok);cursor:pointer}
#map{position:relative;height:150px;border:1px solid var(--line);border-radius:6px;
  background:#05070b;overflow:hidden}
.part{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;
  cursor:pointer;overflow:hidden;box-shadow:inset -1px 0 0 rgba(5,7,11,.9)}
.part .fill{position:absolute;left:0;right:0;bottom:0;opacity:.30}
.part .tag{position:relative;padding:6px 5px 0;font:600 10px ui-monospace,monospace;
  text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part .sung{position:relative;padding:1px 5px 5px;font:9px ui-monospace,monospace;
  color:#8fbf9f;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.part .sung.quiet{color:#4a5260}
.part .sung{cursor:pointer}
.part .sung:hover{filter:brightness(1.5);text-decoration:underline}
.part.here{outline:2px solid var(--ok);outline-offset:-2px}
.part{border-left:1px solid #39445c}
.part:first-of-type{border-left:none}
.beat{position:absolute;top:4px;width:2px;height:30px;z-index:4;border-radius:1px;cursor:pointer}
.beat:hover{filter:brightness(1.6)}
.beatname{position:absolute;left:2px;top:32px;font:8px ui-monospace,monospace;white-space:nowrap;
          color:inherit;opacity:.9;text-shadow:0 1px 2px #000}
#key{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 0;font:9px ui-monospace,monospace;color:#5c6478}
#key b{font-weight:400}
#key i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;
       vertical-align:-1px;font-style:normal}
#marks{width:100%;height:112px;display:block;margin-top:6px}
#head{position:absolute;top:0;bottom:0;width:2px;background:var(--ok);pointer-events:none;z-index:3}
#zoom{width:100%;height:86px;cursor:pointer;margin:0 0 6px;border:1px solid var(--line);border-radius:6px;
  background:#05070b;display:block}
#tune{width:100%;height:86px;cursor:pointer;margin-top:6px;border:1px solid var(--line);border-radius:6px;
  background:#05070b;display:block}
#lanes{width:100%;height:104px;margin-top:6px;border:1px solid var(--line);border-radius:6px;
  background:#05070b;display:block}
#now{font:600 15px ui-monospace,monospace;margin:12px 0 4px}
#now small{font:400 12px ui-monospace,monospace;color:var(--faint);margin-left:10px}
h2{font:600 13px system-ui;margin:22px 0 8px;color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #141a26;flex-wrap:wrap}
.row .when{font:12px ui-monospace,monospace;color:var(--amb);min-width:58px;
  font-variant-numeric:tabular-nums}
.row .what{flex:1;min-width:200px;color:var(--dim)}
.row .what b{color:var(--ink)}
.row button{padding:4px 9px;font-size:12px}
.row .said{font:12px ui-monospace,monospace;color:var(--ok);min-width:16px}
.dim{color:var(--faint)}
#subs{position:relative;height:26px;margin-top:3px;border:1px solid var(--edge);border-radius:4px;overflow:hidden;background:#14181f}
.sub{position:absolute;top:0;bottom:0;border-left:1px solid #2c3340;font:9px ui-monospace,monospace;
     color:#9fb0c9;padding:3px 0 0 4px;overflow:hidden;white-space:nowrap}
.sub b{font-weight:600}
.subchip{font:10px ui-monospace,monospace;border:1px solid #3a4152;border-radius:3px;padding:1px 5px;color:#9fb0c9;cursor:pointer}
.subchip:hover{background:#1c212b}
.sub{cursor:pointer}
.sub:hover{filter:brightness(1.5)}
.inside{flex-basis:100%;margin:5px 0 2px 0;display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
.chip{font:10px ui-monospace,monospace;border:1px solid;border-radius:3px;padding:1px 5px;opacity:.85}
.tag{font:9px ui-monospace,monospace;color:#5c6478;text-transform:uppercase;letter-spacing:.08em;
     min-width:64px;display:inline-block;padding-top:2px;flex:0 0 auto}
.chip b{opacity:.6;font-weight:400}
.row{flex-wrap:wrap}
</style>

<div class="wrap">
<div class="bar">
  <select id="song"></select>
  <button id="play" disabled>play</button>
  <input id="seek" type="range" min="0" max="10000" value="0">
  <span class="mono" id="clock" style="min-width:92px;text-align:right">0:00</span>
  <button id="clicker">click: off</button>
  <button id="only">beats only</button>
  <span class="mono dim">downbeat</span>
  <span id="phase"></span>
  <span class="mono dim" id="facts"></span>
</div>

<canvas id="zoom"></canvas>

<div id="map"><div id="head"></div></div>
<div id="key"></div>
<div id="subs"></div>
<canvas id="tune"></canvas>
<canvas id="lanes"></canvas>
<canvas id="marks"></canvas>

<div id="now">—</div>

<h2>Sections, their subsections, and the moments inside</h2>
<div id="sections"></div>

</div>

<script src="/protocol/session.js"></script>
<script>
const $ = i => document.getElementById(i);
const aud = new Audio(); aud.preload = "auto";
let SCORE = null, slug = null, stopAt = null, BAR = 1, FIRSTBAR = 1, dragging = false;
let SHIFT = 0, BASE = 0;
const WHEEL = ["#6fa8dc","#e8a33d","#5bb98c","#b98cd6","#d68c8c","#8cd6cf","#d6c98c","#a0a8bb"];
const STEM = { drums:"#e0655f", bass:"#b98cd6", vocals:"#5bb98c", other:"#6fa8dc" };
const LANES = ["drums","bass","vocals","other"];
let HUE = {};

const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const beatLen = () => 60 / SCORE.grid.bpm;
const firstBeat = () => SCORE.grid.first_beat_s + (SHIFT - BASE) * beatLen();
const barTime = b => b <= 0 ? 0 : firstBeat() + (b - 1) * BAR;
const evTime = e => barTime(e.bar) + (e.beat - 1) * (60 / SCORE.grid.bpm);

async function library() {
  const list = await (await fetch("/library.json")).json();
  $("song").innerHTML = list.map(x =>
    `<option value="${x.slug}" data-a="${x.audio}">${x.slug}</option>`).join("");
  const want = new URLSearchParams(location.search).get("song");
  const pick = list.find(x => x.slug === want) || list[0];
  if (pick) { $("song").value = pick.slug; load(pick.slug, pick.audio); }
}

async function load(s, url) {
  slug = s;
  SCORE = await (await fetch(`/scores/${s}.score`)).json();
  BAR = (60 / SCORE.grid.bpm) * SCORE.grid.beats_per_bar;
  FIRSTBAR = SCORE.grid.first_beat_s > 0.2 ? 0 : 1;
  aud.src = url; aud.load();
  $("play").disabled = false;
  const g = SCORE.grid;
  $("facts").textContent = `${g.bpm} bpm · ${g.bars} bars`
    + (g.holds_from_s != null ? ` · grid holds from ${mmss(g.holds_from_s)}` : "");
  BASE = 0;
  try {
    const saved = await (await fetch(`/downbeat/${s}`)).json();
    BASE = saved.downbeat_shift_beats || 0;
  } catch (e) { BASE = 0; }
  SHIFT = BASE;
  phaseButtons();
  draw();
}

function play(from, until) {
  stopAt = until ?? null;
  aud.currentTime = Math.max(0, from);
  aud.play();
}

function draw() {
  HUE = {};
  let n = 0;
  for (const p of SCORE.parts || [])
    if (!(p.repeats_as in HUE)) HUE[p.repeats_as] = WHEEL[n++ % WHEEL.length];

  const map = $("map");
  [...map.querySelectorAll(".part,.unmetered,.beat")].forEach(x => x.remove());
  const total = SCORE.song.length_s;
  for (const p of SCORE.parts || []) {
    const t0 = barTime(p.from_bar), t1 = Math.min(total, barTime(p.to_bar + 1));
    const el = document.createElement("div");
    el.className = "part";
    el.style.left = `${(t0/total)*100}%`;
    el.style.width = `${((t1-t0)/total)*100}%`;
    const c = HUE[p.repeats_as];
    el.innerHTML = `<div class="fill" style="background:${c};height:${Math.round((p.fullness??.5)*100)}%"></div>
      <div class="tag" style="color:${c}">${p.role ? p.role.toUpperCase() : p.repeats_as}</div>
      <div class="sung${p.sung ? "" : " quiet"}"
        title="${tuneWords(p.sung)} \u00b7 click to hear the tune itself"
        >\u266a ${tuneWords(p.sung, true)}</div>`;
    el.onclick = ev => {
      const r = map.getBoundingClientRect();
      play(((ev.clientX - r.left) / r.width) * total);
    };
    el.querySelector(".sung").onclick = ev => {
      ev.stopPropagation();
      hearTune(p.from_bar, p.to_bar);
    };
    map.appendChild(el);
  }
  const shelf = [];
  for (const m of SCORE.moments || []) {
    const t = momentTime(m);
    if (t < 0 || t > total) continue;
    const el = document.createElement("div");
    el.className = "beat";
    const left = (t/total)*100;
    el.style.left = `${left}%`;
    const len = momentSpan(m);
    if (len > 0) el.style.width = `${Math.max(0.15, (len/total)*100)}%`;
    el.style.background = KIND[m.is] || "#8b93a6";
    el.style.opacity = 0.45 + 0.55 * (m.weight ?? 0);
    const words = momentWords(m);
    el.title = `bar ${m.bar}.${m.beat} · ${words} · weight ${m.weight}`;
    const wide = (words.length * 5.4 / (map.clientWidth || 1200)) * 100;
    let lane = 0;
    while (shelf[lane] != null && shelf[lane] > left) lane++;
    shelf[lane] = left + wide + 0.6;
    el.innerHTML = `<span class="beatname" style="top:${32 + (lane % 5)*11}px">${words}</span>`;
    el.onclick = ev => { ev.stopPropagation(); hearMoment(m); };
    map.appendChild(el);
  }

  const from = SCORE.grid.holds_from_s, upto = SCORE.grid.holds_to_s;
  const hatch = (l, w, side) => {
    if (w <= 0) return;
    const sh = document.createElement("div");
    sh.className = "unmetered";
    sh.title = "the tempo we fitted does not hold here — these bar positions are "
             + "extrapolated, not measured";
    sh.style.cssText = `position:absolute;top:0;bottom:0;z-index:2;pointer-events:none;
      left:${(l/total)*100}%;width:${(w/total)*100}%;
      background:repeating-linear-gradient(135deg,
      rgba(224,101,95,.13) 0 7px,transparent 7px 14px);border-${side}:1px dashed rgba(224,101,95,.6)`;
    map.appendChild(sh);
  };
  if (from != null && from > 0) hatch(0, from, "right");
  if (upto != null && upto < total) hatch(upto, total - upto, "left");
  if (from != null || upto != null) {
    const off = ((from || 0) + Math.max(0, total - (upto ?? total))) / total;
    const note = document.createElement("div");
    note.className = "unmetered";
    note.style.cssText = `position:absolute;right:6px;top:4px;z-index:5;pointer-events:none;
      font:9px ui-monospace,monospace;color:#e0655f;opacity:.85`;
    note.textContent = `striped: bars extrapolated, tempo not steady (${Math.round(off*100)}% of song)`;
    map.appendChild(note);
  }

  $("key").innerHTML =
    `<span>click any moment to hear it:</span>` +
    Object.entries(KIND).map(([k, c]) =>
      `<b><i style="background:${c}"></i>${k}</b>`).join("");
  lanes(); tune(); marks(); subs(); sections();
}

const KIND = {entrance:"#5bb98c", exit:"#e0655f", fill:"#e8a33d", accent:"#f2c14e",
  pause:"#8b93a6", rise:"#6fa8dc", release:"#d16bd1", change:"#7ad4c8",
  hook:"#f28c8c", highlight:"#c8a2ff", transition:"#9fb0c9"};

function momentTime(m) {
  return barTime(m.bar) + (m.beat - 1) * (60 / SCORE.grid.bpm);
}

function momentSpan(m) {
  const beat = 60 / SCORE.grid.bpm;
  return (m.for_beats ? m.for_beats * beat : 0);
}

function hearTune(from_bar, to_bar) {
  const beat = 60 / SCORE.grid.bpm;
  const hook = (SCORE.moments || []).find(m =>
    m.is === "hook" && m.bar >= from_bar && m.bar <= to_bar);
  if (hook) { hearMoment(hook); return; }
  const mine = (SCORE.melody || []).filter(n =>
    n.bar >= from_bar && n.bar <= to_bar);
  if (!mine.length) { play(barTime(from_bar), barTime(from_bar) + 8); return; }
  let seat = 0, most = 0;
  for (let i = 0; i < mine.length; i++) {
    const upto = barTime(mine[i].bar) + 10;
    let k = i;
    while (k < mine.length && barTime(mine[k].bar) < upto) k++;
    if (k - i > most) { most = k - i; seat = i; }
  }
  const t = barTime(mine[seat].bar) + (mine[seat].beat - 1)*beat;
  play(Math.max(0, t - 0.3), t + 10);
}

function tuneWords(s, short) {
  if (!s || !s.notes) return short ? "\u2014" : "nothing sung here";
  if (s.on_one_note) return short ? "one note" : "sung on one repeated note";
  const how = s.moves < 1.2 ? ["small moves", "moves only a step at a time"]
            : s.moves < 2.5 ? ["steps", "moves in small steps"]
            : ["leaps", "leaps between notes"];
  const span = s.high - s.low;
  const wide = span < 5 ? "in a narrow band"
             : span < 12 ? "inside one octave"
             : span < 20 ? "over an octave and a half"
             : "over two octaves";
  return short ? how[0] : `${how[1]}, ${wide}`;
}

function momentWords(m) {
  const pay = m.back_at != null ? ` → back at ${m.back_at}`
            : m.into_bar != null ? ` → into ${m.into_bar}` : "";
  return `${m.is} ${m.what}${pay}`;
}

function hearMoment(m) {
  const t = momentTime(m);
  play(Math.max(0, t - 0.4), t + Math.max(momentSpan(m), 1.6) + 0.6);
}

const ZHIT = [];
const THIT = [];

const DOING = {intensifying:"#e0655f", easing:"#6fa8dc", expanding:"#5bb98c",
  thinning:"#c98fd1", peaking:"#f2c14e", sustaining:"#7f8b9e",
  suspending:"#c8a2ff", resolving:"#7ad4c8", establishing:"#9fd18b",
  developing:"#e8a33d", transitioning:"#f28c8c", closing:"#8b93a6"};

function subs() {
  const box = $("subs"); box.innerHTML = "";
  if (!SCORE || !SCORE.phrases) return;
  const total = SCORE.song.length_s;
  for (const q of SCORE.phrases) {
    const t0 = barTime(q.from_bar), t1 = Math.min(total, barTime(q.to_bar + 1));
    const el = document.createElement("div");
    el.className = "sub";
    el.style.left = (100 * t0 / total) + "%";
    el.style.width = (100 * (t1 - t0) / total) + "%";
    const word = q.doing || "";
    el.style.background = (DOING[q.doing] || "#39414f") + (word ? "22" : "11");
    el.style.color = DOING[q.doing] || "#59616f";
    el.title = `bars ${q.from_bar}-${q.to_bar} · ${word || "nothing it can name"}` +
      (q.also && q.also.length ? " (" + q.also.join(", ") + ")" : "") + ` · ${q.says}`;
    el.innerHTML = word ? `<b>${word}</b>` : "";
    el.onclick = () => play(t0, t1);
    box.appendChild(el);
  }
}

function marks() {
  const c = $("marks"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (c.width !== Math.round(r.width*dpr)) {
    c.width = Math.round(r.width*dpr); c.height = Math.round(112*dpr);
  }
  const g = c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,r.width,112);
  const all = (SCORE && (SCORE.signals || SCORE.moments)) || null;
  if (!all) return;
  const total = (SCORE.song && SCORE.song.length_s) || aud.duration || 1;
  const rows = Object.keys(KIND);
  const lane = 9;
  g.font = "8px ui-monospace,monospace";
  rows.forEach((k, i) => {
    const y = 8 + i*lane;
    g.fillStyle = "#232833"; g.fillRect(64, y, r.width-70, lane-2);
    g.fillStyle = KIND[k]; g.globalAlpha = .8;
    g.fillText(k, 6, y + lane - 3); g.globalAlpha = 1;
  });
  for (const m of all) {
    const i = rows.indexOf(m.is);
    if (i < 0) continue;
    const x = 64 + (momentTime(m)/total)*(r.width-70);
    const w = Math.max(2, (momentSpan(m)/total)*(r.width-70));
    g.globalAlpha = .3 + .7*(m.sure || 0);
    g.fillStyle = KIND[m.is];
    g.fillRect(x, 8 + i*lane, w, lane-2);
  }
  g.globalAlpha = 1;
}

const WINDOW = 8.0;

function zoom() {
  const c = $("zoom"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  if (c.width !== Math.round(r.width*dpr)) {
    c.width = Math.round(r.width*dpr); c.height = Math.round(86*dpr);
  }
  const g = c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,r.width,86);
  if (!SCORE) return;
  const t = aud.currentTime, a = t - WINDOW/2, b = t + WINDOW/2;
  const X = s => ((s - a)/WINDOW)*r.width;

  for (const p of SCORE.parts || []) {
    const t0 = barTime(p.from_bar);
    if (t0 < a || t0 > b) continue;
    g.fillStyle = "rgba(91,185,140,.14)";
    g.fillRect(X(t0), 0, r.width, 86);
    g.strokeStyle = "#5bb98c"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(X(t0), 0); g.lineTo(X(t0), 86); g.stroke();
    g.fillStyle = "#5bb98c"; g.font = "600 10px ui-monospace,monospace";
    g.fillText((p.role ?? p.repeats_as).toUpperCase(), X(t0)+5, 12);
  }

  const per = SCORE.grid.beats_per_bar;
  SCORE.beats.forEach((bt, i) => {
    if (bt.t < a || bt.t > b) return;
    const x = X(bt.t);
    const down = ((i - (SHIFT - BASE)) % per + per) % per === firstIndex();
    g.strokeStyle = down ? "#ffffff" : "#e8a33d";
    g.lineWidth = down ? 2 : 1;
    g.globalAlpha = down ? 1 : .55;
    g.beginPath(); g.moveTo(x, down ? 22 : 40); g.lineTo(x, 60); g.stroke();
    g.globalAlpha = 1;
    if (down) {
      const n = Math.round((bt.t - firstBeat())/BAR) + 1;
      g.fillStyle = "#8b93a6"; g.font = "10px ui-monospace,monospace";
      g.fillText(n, x+3, 82);
    }
  });

  for (const q of SCORE.phrases || []) {
    const q0 = barTime(q.from_bar), q1 = barTime(q.to_bar + 1);
    if (q1 < a || q0 > b) continue;
    const hue = DOING[q.doing] || "#39414f";
    const x0 = Math.max(0, X(q0)), x1 = Math.min(r.width, X(q1));
    g.fillStyle = hue + (q.doing ? "18" : "0c");
    g.fillRect(x0, 62, x1 - x0, 10);
    g.strokeStyle = hue; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0, 62); g.lineTo(x0, 72); g.stroke();
    g.fillStyle = hue; g.font = "8px ui-monospace,monospace";
    if (q.doing && x1 - x0 > 46) g.fillText(q.doing, x0 + 3, 70);
  }

  ZHIT.length = 0;
  const shelf = [];
  g.font = "9px ui-monospace,monospace";
  for (const m of SCORE.moments || []) {
    const mt = momentTime(m), len = momentSpan(m);
    if (mt + len < a || mt > b) continue;
    const x = X(mt);
    const hue = KIND[m.is] || "#8b93a6";
    g.fillStyle = hue;
    g.globalAlpha = .45 + .55*(m.weight ?? m.sure ?? 0);
    let x1 = x;
    if (len > 0) {
      x1 = X(mt + len);
      g.fillRect(x, 27, Math.max(3, x1 - x), 6);
      g.globalAlpha = 1;
      g.fillRect(x, 24, 2, 12);
    } else {
      g.beginPath(); g.arc(x, 30, 3.5, 0, 6.284); g.fill();
    }
    g.globalAlpha = 1;
    const words = momentWords(m);
    const tw = g.measureText(words).width;
    let lane = 0;
    while (shelf[lane] != null && shelf[lane] > x) lane++;
    shelf[lane] = x + tw + 12;
    const ly = 46 + lane*10;
    g.fillStyle = "rgba(5,7,11,.82)";
    g.fillRect(x + 1, ly - 8, tw + 6, 10);
    g.fillStyle = hue;
    g.fillText(words, x + 4, ly);
    ZHIT.push({x0: Math.min(x, x1) - 5, x1: Math.max(x1, x + tw + 8),
               y0: 22, y1: ly + 3, m});
  }

  g.strokeStyle = "#e0655f"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(r.width/2, 0); g.lineTo(r.width/2, 86); g.stroke();
  g.fillStyle = "#5c6478"; g.font = "600 9px ui-monospace,monospace";
  g.fillText("BEATS · white = downbeat · green = section starts · band = subsection · red = now", 7, 96-86+9);
}

let ctx = null, clicking = false, sent = -1;
function click(when, down) {
  const o = ctx.createOscillator(), amp = ctx.createGain();
  o.frequency.value = down ? 900 : 1800;
  amp.gain.setValueAtTime(down ? .5 : .25, when);
  amp.gain.exponentialRampToValueAtTime(.0001, when + .05);
  o.connect(amp).connect(ctx.destination);
  o.start(when); o.stop(when + .06);
}

function tune() {
  const c = $("tune"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = Math.round(r.width*dpr); c.height = Math.round(86*dpr);
  const g = c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,r.width,86);
  g.fillStyle = "#5c6478"; g.font = "600 9px ui-monospace,monospace";
  g.fillText("MELODY", 6, 12);
  const notes = SCORE.melody || [];
  if (!notes.length) {
    g.font = "8px ui-monospace,monospace";
    g.fillText("no vocal pitch", 6, 24);
    return;
  }
  const v = SCORE.voice || {}, total = SCORE.song.length_s;
  const lo = Math.floor((v.low ?? 48) - 1), hi = Math.ceil((v.high ?? 74) + 1);
  const span = Math.max(8, hi - lo), beat = 60 / SCORE.grid.bpm;
  const top = 20, foot = 74, tall = foot - top;
  const Y = p => foot - ((p - lo)/span)*tall;
  for (let p = Math.ceil(lo/12)*12; p <= hi; p += 12) {
    g.strokeStyle = "#1a212e"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(88, Y(p)); g.lineTo(r.width-4, Y(p)); g.stroke();
  }
  g.fillStyle = "#2c3340"; g.font = "7px ui-monospace,monospace";
  g.fillText("higher", 92, top + 6);
  g.fillText("lower", 92, foot + 4);
  THIT.length = 0;
  const hooked = new Set();
  for (const m of SCORE.moments || []) {
    if (m.is !== "hook" || !m.for_beats) continue;
    const upto = m.bar + m.for_beats/SCORE.grid.beats_per_bar;
    for (let b = m.bar; b <= upto; b++) hooked.add(b);
    const a = barTime(m.bar) + (m.beat - 1)*beat;
    THIT.push({x0: 88 + (a/total)*(r.width-93),
               x1: 88 + ((a + m.for_beats*beat)/total)*(r.width-93), m});
  }
  for (const n of notes) {
    const t = barTime(n.bar) + (n.beat - 1)*beat;
    const x = 88 + (t/total)*(r.width-93);
    const w = Math.max(1.5, ((n.held_beats*beat)/total)*(r.width-93));
    const hot = hooked.has(n.bar);
    g.fillStyle = hot ? "#c8a2ff" : (STEM.vocals || "#5bb98c");
    g.globalAlpha = hot ? 1 : 0.7;
    g.fillRect(x, Y(n.pitch) - 1.6, w, 3.2);
  }
  g.globalAlpha = 1;
  g.fillStyle = "#5c6478"; g.font = "8px ui-monospace,monospace";
  g.fillText("one mark =", 6, 26);
  g.fillText("one sung note", 6, 37);
  g.fillStyle = "#c8a2ff";
  g.fillText("purple = the", 6, 52);
  g.fillText("tune repeats", 6, 63);
  g.fillStyle = "#39414f";
  g.fillText(`${notes.length} notes`, 6, 74);
  if (v.sure != null && v.sure < 0.5) {
    g.fillStyle = "#e0655f";
    g.fillText("pitch reading unreliable here", 96, 12);
  }
}

function lanes() {
  const c = $("lanes"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  c.width = Math.round(r.width*dpr); c.height = Math.round(104*dpr);
  const g = c.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,r.width,104);
  const b = SCORE.bars || {};
  const names = LANES.filter(n => Array.isArray(b[n]));
  if (!names.length) return;
  const total = SCORE.song.length_s, h = 104 / names.length;
  names.forEach((n, row) => {
    const y = row*h, v = b[n];
    g.fillStyle = STEM[n];
    for (let i = 0; i < v.length; i++) {
      if (v[i] == null) continue;
      const x = (barTime(i+FIRSTBAR)/total)*r.width;
      const w = Math.max(1, (BAR/total)*r.width - 0.4);
      const bh = Math.max(0.5, v[i]*(h-8));
      g.globalAlpha = 0.30 + 0.6*v[i];
      g.fillRect(x, y+h-3-bh, w, bh);
    }
    g.globalAlpha = .8; g.font = "600 9px ui-monospace,monospace";
    g.fillText(n.toUpperCase(), 6, y+11); g.globalAlpha = 1;
  });
}

function firstIndex() {
  let best = 0, gap = 1e9;
  SCORE.beats.forEach((bt, i) => {
    const d = Math.abs(bt.t - SCORE.grid.first_beat_s);
    if (d < gap) { gap = d; best = i; }
  });
  return ((best % SCORE.grid.beats_per_bar) + SCORE.grid.beats_per_bar) % SCORE.grid.beats_per_bar;
}

function phaseButtons() {
  const box = $("phase");
  box.innerHTML = [-2,-1,0,1,2,3].map(k =>
    `<button data-k="${k}" class="${k===SHIFT?'on':''}" style="padding:4px 8px">${k>0?"+":""}${k}</button>`).join(" ")
    + ` <button id="savephase" style="padding:4px 9px">save</button>`;
  box.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    SHIFT = +b.dataset.k; phaseButtons(); draw();
  });
  $("savephase").onclick = async () => {
    await fetch("/downbeat", { method:"POST", body: JSON.stringify({ slug, shift: SHIFT }) });
    $("savephase").textContent = "saved";
    setTimeout(() => $("savephase").textContent = "save", 1200);
  };
}

function verdict(body) {
  return fetch("/verdict", { method:"POST", body: JSON.stringify({ slug, ...body }) });
}

function judged(row, kind, payload) {
  row.querySelectorAll("[data-v]").forEach(b => {
    b.onclick = async () => {
      row.querySelectorAll("[data-v]").forEach(o => o.classList.remove("on"));
      b.classList.add("on");
      await verdict({ asked: kind, says: b.dataset.v, ...payload });
      row.querySelector(".said").textContent = b.dataset.v === "yes" ? "✓" : "✗";
    };
  });
}

function sections() {
  const box = $("sections"); box.innerHTML = "";
  const total = SCORE.song.length_s;
  for (const p of SCORE.parts || []) {
    const t0 = barTime(p.from_bar), t1 = Math.min(total, barTime(p.to_bar+1));
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span class="when">${mmss(t0)}</span>
      <span class="what"><b style="color:${HUE[p.repeats_as]}">${p.role ?? p.repeats_as}</b>
        &nbsp;${p.feels}
        <span class="dim">· bars ${p.from_bar}–${p.to_bar} · ${(p.playing||[]).join(" ") || "nothing"}
        · <span style="color:#8fbf9f">${tuneWords(p.sung)}</span></span></span>
      <button data-from="${t0}" data-to="${t1}">hear it</button>
      <button class="yes" data-v="yes">right</button>
      <button class="no" data-v="no">wrong</button>
      <span class="said"></span>`;
    const mine = (SCORE.phrases || [])
      .filter(q => q.from_bar >= p.from_bar && q.to_bar <= p.to_bar);
    if (mine.length) {
      const band = document.createElement("div");
      band.className = "inside";
      band.innerHTML = `<span class="tag">does</span>` + mine.map(q =>
        `<span class="subchip" data-b0="${q.from_bar}" data-b1="${q.to_bar}"
           style="border-color:${DOING[q.doing]||'#2b313c'};color:${DOING[q.doing]||'#59616f'}"
           title="click to hear bars ${q.from_bar}-${q.to_bar}"><b>${q.from_bar}-${q.to_bar}</b> ${q.doing || ""}${
             q.also && q.also.length ? " · " + q.also.join(" ") : ""} — ${q.says}</span>`).join("");
      band.querySelectorAll(".subchip").forEach(el => {
        el.onclick = () => play(barTime(+el.dataset.b0),
                                barTime(+el.dataset.b1 + 1));
      });
      row.appendChild(band);
    }
    const inside = (SCORE.moments || [])
      .filter(m => m.bar >= p.from_bar && m.bar <= p.to_bar)
      .sort((a,b) => a.bar - b.bar || a.beat - b.beat);
    if (inside.length) {
      const strip = document.createElement("div");
      strip.className = "inside";
      strip.innerHTML = `<span class="tag">moments</span>` + inside.map(m =>
        `<span class="chip" style="border-color:${KIND[m.is]||'#3a4152'};color:${KIND[m.is]||'#8b93a6'}"
           title="bar ${m.bar} beat ${m.beat} · confidence ${m.sure} · weight ${m.weight ?? "-"}">
           <b>${m.bar}.${m.beat}</b> ${momentWords(m)}${
             m.for_beats ? ` <i style="opacity:.6;font-style:normal">${m.for_beats}b</i>` : ""}</span>`).join("");
      strip.querySelectorAll(".chip").forEach((el, i) => {
        el.style.cursor = "pointer";
        el.onclick = () => hearMoment(inside[i]);
      });
      row.appendChild(strip);
    }
    box.appendChild(row);
    row.querySelector("[data-from]").onclick = e =>
      play(+e.target.dataset.from, Math.min(+e.target.dataset.to, +e.target.dataset.from + 12));
    judged(row, "section", { bar: p.from_bar, role: p.role, feels: p.feels });
  }
}

function tick() {
  if (SCORE) {
    const t = aud.currentTime, total = SCORE.song.length_s;
    $("clock").textContent = `${mmss(t)} / ${mmss(total)}`;
    if (!dragging) $("seek").value = Math.round((t/total)*10000);
    $("head").style.left = `${(t/total)*100}%`;
    if (stopAt !== null && t >= stopAt) { aud.pause(); stopAt = null; }
    zoom();
    if (clicking && ctx && !aud.paused) {
      for (const bt of SCORE.beats || []) {
        if (bt.t <= sent || bt.t < t || bt.t > t + 0.35) continue;
        sent = bt.t;
        const i = SCORE.beats.indexOf(bt), per = SCORE.grid.beats_per_bar;
        click(ctx.currentTime + (bt.t - t),
              ((i - (SHIFT - BASE)) % per + per) % per === firstIndex());
      }
    }
    const bar = Math.floor((t - SCORE.grid.first_beat_s)/BAR) + 1;
    let at = -1;
    (SCORE.parts||[]).forEach((p,i) => { if (bar >= p.from_bar && bar <= p.to_bar) at = i; });
    document.querySelectorAll(".part").forEach((n,i) => n.classList.toggle("here", i === at));
    if (at >= 0) {
      const p = SCORE.parts[at];
      const b = SCORE.bars || {}, idx = Math.max(0, bar - FIRSTBAR);
      const now = LANES.filter(n => Array.isArray(b[n]) && b[n][idx] > 0.12)
        .map(n => `<span style="color:${STEM[n]}">${n}</span>`).join(" ");
      const beat = (60/SCORE.grid.bpm);
      const here = (SCORE.moments||[]).filter(m => Math.abs(momentTime(m) - t) < beat*0.75)
        .sort((x,y) => (y.sure||0)-(x.sure||0)).slice(0,3)
        .map(m => `<span style="color:${KIND[m.is]||'#8b93a6'}">${momentWords(m)}</span>`).join(" · ");
      $("now").innerHTML = `<span style="color:${HUE[p.repeats_as]}">${p.role ?? p.repeats_as}</span>
        · ${p.feels}<small>bar ${Math.max(0,bar)} · ${now || "nothing"}</small>`
        + (here ? `<div style="margin-top:5px;font-size:12px">${here}</div>` : "");
    }
  }
  requestAnimationFrame(tick);
}

$("play").onclick = () => { stopAt = null; aud.paused ? aud.play() : aud.pause(); };
aud.onplay = () => $("play").textContent = "pause";
aud.onpause = () => $("play").textContent = "play";
$("seek").oninput = e => { dragging = true; stopAt = null;
  if (SCORE) aud.currentTime = (e.target.value/10000)*SCORE.song.length_s; };
$("seek").onchange = () => dragging = false;
$("only").onclick = e => {
  const on = !e.target.classList.contains("on");
  e.target.classList.toggle("on", on);
  aud.volume = on ? 0 : 1;
  if (on && !clicking) $("clicker").click();
};
$("zoom").onclick = e => {
  if (!SCORE) return;
  const r = e.target.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  const hit = ZHIT.find(h => px >= h.x0 && px <= h.x1 && py >= h.y0 && py <= h.y1);
  if (hit) { hearMoment(hit.m); return; }
  const at = aud.currentTime - WINDOW/2 + ((e.clientX - r.left)/r.width) * WINDOW;
  stopAt = null;
  aud.currentTime = Math.max(0, Math.min(SCORE.song.length_s - 0.05, at));
};
$("tune").onclick = e => {
  if (!SCORE) return;
  const r = e.target.getBoundingClientRect();
  const px = e.clientX - r.left;
  const hit = THIT.find(h => px >= h.x0 - 3 && px <= h.x1 + 3);
  if (hit) { hearMoment(hit.m); return; }
  const total = SCORE.song.length_s;
  const at = ((px - 88) / Math.max(1, r.width - 93)) * total;
  play(Math.max(0, Math.min(total - 0.1, at)), null);
};
$("zoom").onwheel = e => {
  if (!SCORE) return;
  e.preventDefault();
  stopAt = null;
  const step = (60 / SCORE.grid.bpm) * (e.deltaY > 0 ? 1 : -1);
  aud.currentTime = Math.max(0, Math.min(SCORE.song.length_s - 0.05, aud.currentTime + step));
};
$("clicker").onclick = e => {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  clicking = !clicking; sent = aud.currentTime;
  e.target.classList.toggle("on", clicking);
  e.target.textContent = "click: " + (clicking ? "on" : "off");
};
aud.onseeked = () => sent = aud.currentTime;
$("song").onchange = e => { aud.pause(); load(e.target.value, e.target.selectedOptions[0].dataset.a); };
addEventListener("resize", () => { if (SCORE) { lanes(); tune(); zoom(); } });

library();
tick();
</script>
