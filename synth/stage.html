<title>Limelight · stage</title>
<style>
:root{--bg:#08090d;--pan:#12151d;--rule:#232838;--rule2:#333b4c;--ink:#e6e9f1;
      --mut:#8f98ad;--faint:#666c7e;--tung:#f0a93c;--good:#54c98a;--bad:#e8705a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;
     display:flex;flex-direction:column;font:13px ui-sans-serif,system-ui,sans-serif}
header{display:flex;gap:9px;align-items:center;padding:7px 11px;background:var(--pan);
       border-bottom:1px solid var(--rule);flex:0 0 auto;flex-wrap:wrap}
h1{font:600 12px ui-monospace,monospace;margin:0;letter-spacing:.08em;
   text-transform:uppercase;color:var(--tung)}
select,button{background:#1d222e;color:var(--ink);border:1px solid var(--rule2);
  border-radius:4px;padding:4px 9px;font:12px ui-monospace,monospace;cursor:pointer}
button.on{background:var(--tung);color:#20160a;border-color:var(--tung);font-weight:700}
label{color:var(--faint);font:10px ui-monospace,monospace;letter-spacing:.08em;
      text-transform:uppercase}
#wrap{flex:1 1 0;position:relative;min-height:0}
canvas{display:block}
#hud{position:absolute;left:11px;bottom:11px;font:11px ui-monospace,monospace;
     color:var(--mut);background:rgba(8,9,13,.72);padding:6px 9px;border-radius:4px;
     border:1px solid var(--rule);pointer-events:none;line-height:1.6}
#hud b{color:var(--tung)}
footer{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:6px 11px;
       background:var(--pan);border-top:1px solid var(--rule)}
audio{height:32px;flex:1 1 auto}
#err{position:absolute;inset:0;display:none;place-items:center;text-align:center;
     padding:40px;font:14px ui-monospace,monospace;color:var(--bad);line-height:1.7}
</style>

<header>
  <h1>stage</h1>
  <select id="song"></select>
  <label>rung</label><select id="rung"></select>
  <button id="solo" title="run this rung on its own">solo</button>
  <label>energy</label>
  <select id="drive"><option>low</option><option selected>medium</option><option>high</option></select>
  <label>colour</label>
  <select id="pal"><option selected>garrix</option><option>garrix-red</option>
    <option>sunset</option><option>ice</option><option>neon</option><option>amber</option>
    <option>white</option></select>
  <label>view</label>
  <select id="cam"><option>audience</option><option>side</option><option>above</option></select>
  <span style="flex:1"></span>
  <span id="stat" style="color:var(--faint);font:11px ui-monospace,monospace"></span>
</header>

<div id="wrap"><div id="err"></div></div>
<footer><audio id="aud" controls preload="auto"></audio></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const fail=m=>{ $("err").style.display="grid"; $("err").innerHTML=m; };

/* ---------------------------------------------------------------------------
   A room, not a row of circles.

   The 2D panel answered "what level is this lamp" and that is the wrong question
   once the show has gestures in it. A drop is the darkness before it; a build is
   the rig narrowing; the tune walking the row only reads if you can see the row
   in space. None of those survive being drawn as five discs.

   So: the actual room from the layout file -- six metres by five, 3.4 high -- with
   the beams drawn as cones through haze, because a beam you can see in the air is
   the entire reason a club rig has haze in it. Same reader as every other page,
   so this cannot drift from what the checks measure.
--------------------------------------------------------------------------- */
if(typeof THREE==="undefined"){
  fail("three.js did not load.<br><br>It comes from cdnjs, so this page needs "
     + "the internet the first time.<br>Everything else in Limelight works offline.");
}

let RM=null, MAP=null, LAY=null, F=null, SONG="", RUNGS=[];
let STEP=7, SOLO=false;
let DRIVE=Q.get("energy")||"medium", PAL=Q.get("pal")||"garrix";
let scene, cam, renderer, fixtures=[], clock=0;
const V=THREE?THREE.Vector3:null;

/* A Sprite with no texture is a square, which is what the halos were: five red
   blocks hanging behind the lamps. A glow needs a radial falloff, so one is drawn
   once into a canvas and shared by every fixture. */
function glowTexture(){
  const c=document.createElement("canvas"); c.width=c.height=128;
  const g=c.getContext("2d");
  const rg=g.createRadialGradient(64,64,0,64,64,64);
  rg.addColorStop(0.00,"rgba(255,255,255,1)");
  rg.addColorStop(0.18,"rgba(255,255,255,0.72)");
  rg.addColorStop(0.45,"rgba(255,255,255,0.18)");
  rg.addColorStop(1.00,"rgba(255,255,255,0)");
  g.fillStyle=rg; g.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c); t.needsUpdate=true; return t;
}
let GLOW=null;

function build(){
  const W=$("wrap"), w=W.clientWidth, h=W.clientHeight;
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(2,devicePixelRatio));
  renderer.setSize(w,h);
  /* Fifty-two additive fixtures at full saturate to flat white, and the drop --
     the one moment you most want to see the shape of -- became a blank page. An
     eye and a camera both solve this with exposure rather than by asking the room
     to be dimmer, so the renderer does the same. The recipe still asks for 44
     times the brightness of the bar before; the highlights just roll off instead
     of clipping. */
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  W.appendChild(renderer.domElement);
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x05060a, 0.030);
  cam=new THREE.PerspectiveCamera(52, w/h, 0.1, 100);

  const S=LAY.size_m||{w:6,d:5,h:3.4}, DECK=LAY.deck_m||0;
  const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.95,metalness:0});
  const steel=new THREE.MeshStandardMaterial({color:0x2b3140,roughness:.55,metalness:.75});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(S.w*3,S.d*4), mat(0x0a0c11));
  floor.rotation.x=-Math.PI/2; floor.position.set(S.w/2,0,S.d/2); scene.add(floor);
  scene.add(new THREE.AmbientLight(0x22262f, DECK?0.35:0.5));
  GLOW=glowTexture();

  /* A festival stage is architecture, and the architecture is why it reads as one.
     Ground-support towers either side, a roof grid over the top, a front truss
     hung under it, rear ladders upstage, and an LED wall behind everything. A
     layout that declares deck_m gets built this way; a plain room does not. */
  const bar=(x,y,z,len,axis)=>{
    const m=new THREE.Mesh(new THREE.CylinderGeometry(0.055,0.055,len,8), steel);
    if(axis==="x") m.rotation.z=Math.PI/2;
    if(axis==="z") m.rotation.x=Math.PI/2;
    m.position.set(x,y,z); scene.add(m); return m;
  };
  /* a truss is four chords and a zigzag; drawn as chords plus a few diagonals it
     reads as truss from the field without thousands of triangles */
  const truss3=(x,y,z,len,axis,w2)=>{
    const o=w2||0.28;
    for(const [dy,dz] of [[o,o],[o,-o],[-o,o],[-o,-o]])
      axis==="x" ? bar(x, y+dy, z+dz, len, "x")
                 : bar(x+dy, y+dz*(axis==="y"?0:1), z+(axis==="y"?dz:0), len, axis);
  };

  if(DECK){
    const deck=new THREE.Mesh(new THREE.BoxGeometry(S.w*0.72, DECK, S.d*0.72),
                              mat(0x14171f));
    deck.position.set(S.w/2, DECK/2, S.d*0.62); scene.add(deck);
    // ground-support towers, one each side, the full height of the roof
    for(const tx of [S.w*0.055, S.w*0.945]){
      truss3(tx, S.h*0.5, S.d*0.60, S.h, "y", 0.55);
      for(let k=1;k<7;k++) bar(tx, S.h*k/7, S.d*0.60, 1.1, "z");
      // line array hung off the inside face
      for(let k=0;k<9;k++){
        const b=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.36,0.62),
                               mat(0x101319));
        const lean=k*0.055;
        b.position.set(tx + (tx<S.w/2?1.15:-1.15), S.h*0.80 - k*0.40, S.d*0.44 + k*0.09);
        b.rotation.x=lean; scene.add(b);
      }
    }
    // the roof grid
    for(let k=0;k<=6;k++) truss3(S.w/2, S.h - 0.35, S.d*0.22 + k*(S.d*0.62)/6, S.w*0.94, "x", 0.22);
    const roof=new THREE.Mesh(new THREE.BoxGeometry(S.w*1.02, 0.12, S.d*0.72), mat(0x0e1116));
    roof.position.set(S.w/2, S.h+0.05, S.d*0.55); scene.add(roof);
    // rear lighting ladders, one per column of heads
    const lx=[...new Set(LAY.fixtures.filter(f=>/^head_l/.test(f.id)).map(f=>f.at[0]))];
    for(const x of lx){ truss3(x, S.h*0.42, 9.6, S.h*0.84, "y", 0.20);
      for(let k=1;k<5;k++) bar(x, S.h*0.84*k/5, 9.6, 0.4, "x"); }
    // and the front truss the pars hang from
    const py=(LAY.fixtures.find(f=>f.kind==="par")||{at:[0,7,7]}).at;
    truss3(S.w/2, py[1]+0.34, py[2], S.w*0.92, "x", 0.24);
  } else {
    const back=new THREE.Mesh(new THREE.PlaneGeometry(S.w*1.6,S.h*1.6), mat(0x0b0d13));
    back.position.set(S.w/2,S.h*0.8,S.d+0.05); back.rotation.y=Math.PI; scene.add(back);
    const truss=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,S.w+0.6,10), steel);
    truss.rotation.z=Math.PI/2;
    const parY=(LAY.fixtures.find(f=>f.kind==="par")||{at:[0,3,4.6]}).at;
    truss.position.set(S.w/2, parY[1]+0.22, parY[2]); scene.add(truss);
  }

  for(const f of (LAY.fixtures||[])){
    if(f.kind==="fog") continue;
    /* battens are edges, not lamps: a thin emissive bar tracing the architecture */
    if(f.kind==="strip"){
      const sz=f.size_m||{w:0.2,h:3};
      const barM=new THREE.Mesh(new THREE.BoxGeometry(sz.w,sz.h,0.10),
        new THREE.MeshBasicMaterial({color:0x000000}));
      barM.position.set(f.at[0],f.at[1],f.at[2]); scene.add(barM);
      const bl=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xffffff,
        transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
      bl.position.set(f.at[0],f.at[1],f.at[2]-0.15);
      bl.scale.set(Math.max(sz.w,0.9)*2.2, sz.h*1.25, 1); scene.add(bl);
      fixtures.push({def:f,wall:barM,bloom:bl,screen:true});
      continue;
    }
    /* a CO2 jet is a plume, not a beam: it goes UP and it is the only thing on
       this stage that is not light */
    if(f.kind==="co2"){
      const plume=new THREE.Mesh(new THREE.ConeGeometry(0.55,5.0,16,1,true),
        new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,
          blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
      plume.geometry.translate(0,2.5,0);
      plume.position.set(f.at[0],f.at[1],f.at[2]); scene.add(plume);
      fixtures.push({def:f,plume,jet:true});
      continue;
    }
    if(f.kind==="screen"){
      const sz=f.size_m||{w:10,h:5};
      const wall=new THREE.Mesh(new THREE.PlaneGeometry(sz.w,sz.h),
        new THREE.MeshBasicMaterial({color:0x000000}));
      wall.position.set(f.at[0],f.at[1],f.at[2]); wall.rotation.y=Math.PI;
      scene.add(wall);
      const bloom=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOW,color:0xffffff,
        transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
      bloom.position.set(f.at[0],f.at[1],f.at[2]-0.3);
      bloom.scale.set(sz.w*1.5,sz.h*1.7,1); scene.add(bloom);
      fixtures.push({def:f,wall,bloom,screen:true});
      continue;
    }
    const at=f.at||[S.w/2,3,4.6];
    const g=new THREE.Group(); g.position.set(at[0],at[1],at[2]); scene.add(g);
    /* A par can is a real object and you should be able to see it. These were dark
       grey at distance against a black room, so the beams appeared out of nowhere
       and the rig read as an effect rather than as lights. Bigger, lighter, and
       with a yoke, which is most of what tells you which way a lamp is pointing. */
    const shell=new THREE.MeshStandardMaterial({color:0x39414f,roughness:.45,metalness:.75});
    /* A strobe panel is a wide flat bar and a par is a round can -- on a real
       truss they hang in two rows and you can tell them apart at fifty metres by
       shape alone, which is most of why the truss reads as a truss. */
    const body=new THREE.Mesh(
      f.kind==="head"    ? new THREE.SphereGeometry(0.15,18,14)
    : f.kind==="blinder" ? new THREE.BoxGeometry(0.42,0.30,0.16)
    : f.kind==="strobe"  ? new THREE.BoxGeometry(0.62,0.20,0.13)
                         : new THREE.CylinderGeometry(0.135,0.155,0.34,18),
      shell);
    if(f.kind==="par") body.rotation.x=Math.PI/2;
    g.add(body);
    const yoke=new THREE.Mesh(new THREE.TorusGeometry(0.17,0.022,8,20), shell);
    yoke.rotation.y=Math.PI/2; g.add(yoke);
    // three nested cones: wide and faint, then narrower, then a core. Real
    // scattering falls off across the beam and one flat cone reads as plastic.
    /* a blinder is a flood pointed at the crowd, not a beam: short, very wide,
       and its whole job is the half second it is on */
    /* Throw scales with the room. Fixed lengths were tuned for a six-metre club
       and left every beam stopping in mid-air on an eighteen-metre stage. */
    const reach=Math.max(6, (S.d||5)*1.25);
    const deg=(f.beam_deg||24)*Math.PI/180,
          len=f.kind==="head"    ? reach*1.35
            : f.kind==="blinder" ? reach*0.42
            : f.kind==="strobe"  ? reach*0.55      // a strobe throws wide and short
                                 : reach;
    const cones=[[1.6,0.07],[1.0,0.17],[0.45,0.52]].map(([k,a])=>{
      const r=Math.tan(deg/2)*len*k;
      const m=new THREE.Mesh(new THREE.ConeGeometry(r,len,26,1,true),
        new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,
          blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
      m.geometry.translate(0,-len/2,0);      // apex at the lamp
      m.userData.alpha=a; g.add(m); return m;
    });
    const lens=new THREE.Mesh(
      f.kind==="strobe"  ? new THREE.PlaneGeometry(0.56,0.15)
    : f.kind==="blinder" ? new THREE.PlaneGeometry(0.36,0.24)
                         : new THREE.CircleGeometry(0.125,20),
      new THREE.MeshBasicMaterial({color:0x0b0d12,side:THREE.DoubleSide}));
    lens.rotation.x=-Math.PI/2; lens.position.y=f.kind==="strobe"?-0.11:-0.17; g.add(lens);
    /* the halo is what a lamp pointed at you actually looks like: a bloom around
       the lens that grows with output. Without it the brightest thing on stage was
       the middle of the beam rather than its source, which is backwards. */
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({
      map:GLOW, color:0xffffff, transparent:true, opacity:0,
      blending:THREE.AdditiveBlending, depthWrite:false, depthTest:false}));
    halo.scale.set(0.5,0.5,1); g.add(halo);
    // where the beam lands
    const pool=new THREE.Mesh(new THREE.CircleGeometry(Math.tan(deg/2)*len*1.1,28),
      new THREE.MeshBasicMaterial({map:GLOW,color:0xffffff,transparent:true,opacity:0,
        blending:THREE.AdditiveBlending,depthWrite:false}));
    pool.rotation.x=-Math.PI/2; pool.position.y=0.012; scene.add(pool);
    fixtures.push({def:f,g,cones,lens,halo,pool,len});
  }
  place();
  addEventListener("resize",()=>{ const w=W.clientWidth,h=W.clientHeight;
    renderer.setSize(w,h); cam.aspect=w/h; cam.updateProjectionMatrix(); place() });
}

function place(){
  const S=LAY.size_m||{w:6,d:5,h:3.4}, mode=$("cam").value;
  if(mode==="above"){ cam.position.set(S.w/2, S.h*2.6, S.d/2+0.01); cam.lookAt(S.w/2,0,S.d/2) }
  else if(mode==="side"){ cam.position.set(-S.w*0.55, S.h*0.5, S.d*0.25); cam.lookAt(S.w/2,S.h*0.35,S.d*0.7) }
  else if(LAY.deck_m){ cam.position.set(S.w/2, 1.7, -S.d*0.55);
                       cam.lookAt(S.w/2, S.h*0.44, S.d*0.78) }
  else { cam.position.set(S.w/2, 1.6, -S.d*0.42); cam.lookAt(S.w/2, S.h*0.52, S.d*0.80) }
}

/* aim: pars are fixed and rake down the floor; heads obey pan and tilt */
function aim(fx, o){
  const at=fx.def.at, S=LAY.size_m;
  let target;
  if(fx.def.kind==="head" && o && o.pan!==undefined){
    const pan=(o.pan-0.5)*Math.PI*1.5, tilt=0.25+ (o.tilt!==undefined?o.tilt:0.5)*1.1;
    target=new THREE.Vector3(at[0]+Math.sin(pan)*6, at[1]-Math.cos(tilt*0.9)*6,
                             at[2]-Math.cos(pan)*4.0);
  } else {
    /* Front-truss pars point at the CROWD, down and forward, so from the audience
       you see the face of the lamp and the beam coming toward you. They were aimed
       at the floor just under the truss, which is why every lens was edge-on and
       invisible. The row also fans slightly outward, as a real rig is rigged. */
    if(fx.def.kind==="blinder" || fx.def.kind==="strobe"){
      target=new THREE.Vector3(at[0], 1.5, -3.0);       // straight at the audience
    } else {
      const mid=S.w/2, fan=(at[0]-mid)*0.55;
      target=new THREE.Vector3(mid+fan, 0, -0.6);
    }
  }
  const dir=target.clone().sub(new THREE.Vector3(...at)).normalize();
  const q=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,-1,0), dir);
  fx.g.quaternion.copy(q);
  const hit=new THREE.Vector3(...at).add(dir.clone().multiplyScalar(fx.len));
  fx.pool.position.set(hit.x, 0.012, hit.z);
}

/* Auto-exposure, because tone mapping alone cannot fix this. In r128 tone mapping
   runs per material, so fifty-two additively blended cones still sum past white
   after every one of them has been compressed. A camera does not solve a bright
   room by asking it to be dimmer -- it closes down -- so the renderer measures how
   much light the frame contains and stops down accordingly, and opens back up in
   the dark. The FRAMES ARE UNTOUCHED: this changes what the picture looks like and
   nothing about what would be sent to a real rig. */
let EXPO=1;
function render(t){
  if(!F) return;
  const fr=F(t);
  const by={}; for(const o of fr.fixtures) by[o.id]=o;
  let total=0;
  for(const o of fr.fixtures) if("level" in o && !/^fog/.test(o.id)) total+=o.level;
  const REF=5.5;
  const want=Math.max(0.16, Math.min(1, REF/Math.max(REF, total)));
  EXPO += (want-EXPO) * 0.22;                 // follows fast enough to catch a drop
  let haze=0;
  for(const o of fr.fixtures) if(/^fog/.test(o.id)) haze=Math.max(haze,o.level||0);
  for(const fx of fixtures){
    const o=by[fx.def.id]||{}, L=Math.max(0, Math.min(1, o.level||0));
    if(fx.jet){
      fx.plume.material.opacity = L*0.40*EXPO;
      const g2 = 0.4 + 1.5*L;                       // it grows as it fires
      fx.plume.scale.set(g2, 0.55 + 0.75*L, g2);
      continue;
    }
    if(fx.screen){
      const cc=new THREE.Color((o.r||0)/255,(o.g||0)/255,(o.b||0)/255);
      fx.wall.material.color.copy(cc).multiplyScalar(L);
      fx.bloom.material.color.copy(cc); fx.bloom.material.opacity=L*0.30*EXPO;
      continue;
    }
    const c=new THREE.Color((o.r!==undefined?o.r:255)/255,
                            (o.g!==undefined?o.g:255)/255,
                            (o.b!==undefined?o.b:255)/255);
    aim(fx,o);
    for(const m of fx.cones){
      m.material.color.copy(c);
      m.material.opacity = Math.pow(L,0.8) * m.userData.alpha * EXPO
                         * (0.45 + 0.55*Math.min(1,haze+0.5));
    }
    fx.lens.material.color.copy(c).multiplyScalar(Math.min(1, 0.20 + L));
    fx.halo.material.opacity = Math.min(0.95, L*0.85*(0.35+0.65*EXPO));
    fx.halo.material.color.copy(c);
    const wide = fx.def.kind==="blinder" || fx.def.kind==="strobe";
    const hs = (wide ? 0.8 : 0.30) + (wide ? 3.2 : 1.25)*L;
    fx.halo.scale.set(hs, hs, 1);
    fx.pool.material.color.copy(c);
    fx.pool.material.opacity = L*0.22*EXPO;
  }
  renderer.render(scene,cam);
}

function rebuild(){
  if(!RM||!MAP||!LAY) return;
  F=RM.mkReader(MAP, LAY, DRIVE, PAL, STEP, null, SOLO?STEP:0);
  const r=RUNGS[STEP-1];
  $("hud").innerHTML=`<b>${STEP}. ${r?r.name:""}</b>${SOLO?" · on its own":""}<br>`
    +`${r?r.adds:""}<br><span style="color:var(--faint)">${LAY.fixtures.length} fixtures`
    +` · ${DRIVE} · ${PAL}</span>`;
}

(async()=>{
 try{
  if(typeof THREE==="undefined") return;
  const cr=await fetch("/static/checks.js");
  if(!cr.ok) throw new Error("the server is out of date -- restart python3 synth/serve.py");
  new Function(await cr.text()+"\n;window.RUNGS=RUNGS;")();
  RUNGS=window.RUNGS;
  const RECIPE=await (await fetch("/static/recipe_steps.js")).text();
  const ROOMJS=await (await fetch("/static/room.js")).text();
  RM=new Function("RECIPE",ROOMJS+"\n;return {mkReader,prep};")(RECIPE);
  SONG=Q.get("song")||"levels";
  const sg=await (await fetch("/api/song?song="+SONG)).json();
  const want=Q.get("rig");
  LAY=(sg.layouts||{})[want] || (sg.layouts||{}).mainstage || (sg.layouts||{}).show
      || (sg.layouts||{}).small || (sg.layouts||{}).beat;
  const G=await (await fetch("/api/maps?song="+SONG)).json();
  SONG=G.song; MAP=G.maps.answer||Object.values(G.maps)[0];
  $("song").innerHTML=Object.entries(G.songs).map(([k,v])=>
    `<option value="${k}"${k===SONG?" selected":""}>${v}</option>`).join("");
  $("song").onchange=e=>location.href=`/stage?song=${e.target.value}`;
  $("rung").innerHTML=RUNGS.map(r=>`<option value="${r.n}">${r.n}. ${r.name}</option>`).join("");
  STEP=parseInt(Q.get("step")||"",10)||RUNGS.length;
  $("rung").value=STEP;
  $("rung").onchange=e=>{ STEP=+e.target.value; rebuild() };
  $("solo").onclick=()=>{ SOLO=!SOLO; $("solo").classList.toggle("on",SOLO); rebuild() };
  $("drive").value=DRIVE;
  $("drive").onchange=e=>{ DRIVE=e.target.value; rebuild() };
  $("pal").value=PAL;
  $("pal").onchange=e=>{ PAL=e.target.value; rebuild() };
  $("cam").onchange=()=>place();
  const hud=document.createElement("div"); hud.id="hud"; $("wrap").appendChild(hud);
  build(); rebuild();
  $("aud").src=`/api/audio?song=${SONG}`;
  const qt=parseFloat(Q.get("t")||"");
  if(isFinite(qt)) $("aud").addEventListener("loadedmetadata",
    ()=>{ $("aud").currentTime=qt },{once:true});
  $("stat").textContent="ready";
  /* ?at= freezes the stage on one instant with no audio, so a moment can be
     linked, screenshotted or compared side by side. ?t= still seeks the player. */
  const frozen=parseFloat(Q.get("at")||"");
  if(isFinite(frozen)){
    $("stat").textContent="frozen at "+frozen.toFixed(2)+"s";
    (function loop(){ render(frozen); requestAnimationFrame(loop) })();
  } else {
    (function loop(){ render($("aud").currentTime); requestAnimationFrame(loop) })();
  }
 }catch(e){ fail("This page could not start.<br><br>"+String(e.message||e)) }
})();
</script>
