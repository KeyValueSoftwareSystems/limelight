<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map editor</title><style>
:root{--bg:#0e1016;--surface:#171a23;--raise:#1e222d;--ink:#e6e9f1;--muted:#959bac;
 --faint:#666c7e;--rule:#252935;--rule2:#373c4d;--tung:#f0a93c;--learn:#8f9aff;
 --good:#69be86;--bad:#e88055}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);padding:0;overflow:hidden;
 font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;padding:10px 14px 8px}
a.back{color:var(--faint);text-decoration:none;font-family:ui-monospace,monospace;font-size:12px}
.mono,select,button{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 11px;margin:0 0 8px;
 background:var(--surface);border:1px solid var(--rule);border-radius:4px;flex:0 0 auto}
label{color:var(--faint);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
select,button{background:var(--raise);color:var(--ink);border:1px solid var(--rule2);
 border-radius:3px;padding:6px 11px;font-size:12.5px;cursor:pointer}
button.go{background:var(--tung);color:#20160a;border-color:var(--tung);font-weight:700}
button.on{border-color:var(--tung);color:var(--tung)}
.track{background:var(--surface);border:1px solid var(--rule);border-radius:4px;margin:0 0 7px;
 overflow:hidden;flex:1 1 0;display:flex;flex-direction:column;min-height:0}
.track canvas{flex:1 1 0;min-height:0}
/* the fixture panel is a fixed instrument, not a timeline -- the flex rule above
   is for the tracks and was shrinking it to a strip */
#room{flex:0 0 auto!important;height:250px!important}
.track.edit{border-color:var(--tung)}
.thead{display:flex;justify-content:space-between;align-items:baseline;padding:7px 12px;
 border-bottom:1px solid var(--rule);font-family:ui-monospace,monospace;font-size:11.5px}
.thead b{color:var(--tung);letter-spacing:.06em;text-transform:uppercase}
.thead span{color:var(--faint)}
canvas{display:block;width:100%;cursor:crosshair}
.help{color:var(--faint);font-size:12px;font-family:ui-monospace,monospace;margin:8px 0 0}
audio{width:100%;height:34px;flex:0 0 auto;filter:invert(.92) hue-rotate(180deg)}
.help{flex:0 0 auto}
#sel{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--tung);
 border-radius:4px;padding:12px 14px;display:none;min-width:230px}
#sel h3{margin:0 0 8px;font:700 12px ui-monospace,monospace;color:var(--tung)}
#sel input,#sel select{width:100%;margin:0 0 8px;background:var(--raise);color:var(--ink);
 border:1px solid var(--rule2);border-radius:3px;padding:6px 8px;font-size:13px;
 font-family:ui-monospace,monospace}
#sel .row{display:flex;gap:7px}
</style></head><body><div class="wrap">

<div class="bar">
  <a class="back" href="/">←</a>
  <label for="song">song</label><select id="song"></select>
  <label for="mine">editing</label><select id="mine"></select>
  <label for="other">against</label><select id="other"></select>
  <button id="tool-sec" class="on">sections</button>
  <button id="tool-mom">moments</button>
  <button class="go" id="save">Save</button>
  <label>zoom</label>
  <button id="zout">−</button><button id="zin">+</button><button id="zall">all</button>
  <button id="follow" class="on">follow</button>
  <span id="stat" class="mono" style="color:var(--muted);font-size:12px"></span>
</div>

<div class="track edit" id="t1"><div class="thead"><b id="n1">—</b><span id="d1"></span></div>
  <canvas id="c1"></canvas></div>
<div class="track" id="t2"><div class="thead"><b id="n2">—</b><span id="d2"></span></div>
  <canvas id="c2"></canvas></div>

<div id="live" style="display:flex;gap:8px;flex:0 0 auto;margin:0 0 7px">
  <div class="track" style="flex:1 1 0;margin:0">
    <div class="thead"><b>the fixtures, from the map above</b>
      <span><button id="viewtog" style="background:var(--raise);color:var(--muted);
        border:1px solid var(--rule2);border-radius:3px;padding:2px 8px;font-size:10.5px;
        cursor:pointer;font-family:ui-monospace,monospace">room view</button>
      <span id="rmeta" style="margin-left:8px">—</span></span></div>
    <canvas id="room"></canvas></div>
  <div class="track" style="flex:0 0 250px;margin:0">
    <div class="thead"><b>vs <span id="vsname">—</span></b><span id="vstale"></span></div>
    <div style="padding:11px 13px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.9">
      <div>flash match <b id="lflash" style="font-size:19px;color:var(--tung)">—</b></div>
      <div>seconds wrong <b id="lbad" style="font-size:15px">—</b></div>
      <div style="color:var(--faint);font-size:11px;margin-top:6px" id="lnote"></div>
    </div></div>
</div>
<audio id="aud" controls preload="auto"></audio>
<p class="help" id="help"></p>
</div>

<div id="sel"><h3 id="selt">—</h3>
  <select id="selkind"></select>
  <input id="selname" placeholder="name">
  <div class="row"><button id="seldel">delete</button><button id="selclose">close</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const H={sections:34,moments:26,energy:52,stems:34,ruler:18};
const TOTAL=H.sections+H.moments+H.energy+H.stems+H.ruler;
const COL={intro:"#4a5570",verse:"#4f7a8c",chorus:"#f0a93c",drop:"#f0a93c",build:"#c98a3a",
 break:"#3d4459",inst:"#5b6b8a",quiet:"#3d4459",outro:"#4a5570",start:"#2b3040",end:"#2b3040",
 unknown:"#3a3f52"};
const KINDS=["build","drop","stop","quiet","spotlight","return"];
let G=null, SONG="", MINE=null, OTHER=null, mineKey="", otherKey="", tool="sections", sel=null;
// the visible window. A whole song across 1500 px puts a bar at twelve pixels,
// which is not enough to see whether a boundary is where you heard it.
let VIEW={t0:0, span:0}, FOLLOW=true, drag=null;
// the room is rebuilt from MINE on every edit, so a boundary moved on the
// timeline changes the lights immediately -- that is the loop worth having
let RECIPE="", RM=null, LAY=null, F1=null, F2=null, rebuildTimer=null, scoreTimer=null;
// fixtures by default: this panel is for checking the output is what you meant,
// not for imagining what the room looks like
let VIEWMODE="fixtures";
const clampView=D=>{ VIEW.span=Math.max(4,Math.min(D,VIEW.span||D));
  VIEW.t0=Math.max(0,Math.min(D-VIEW.span,VIEW.t0)) };

const secs=m=>((m.sections&&m.sections.entries)||[]).slice();
const dur=m=>m.song.length;
function snap(m,t){
  const pool=(m.downbeats&&m.downbeats.length)?m.downbeats:(m.beats||[]);
  if(!pool.length) return +t.toFixed(3);
  return pool.reduce((a,b)=>Math.abs(b-t)<Math.abs(a-t)?b:a);
}
function draw(cv,m,editable){
  const W=cv.clientWidth, Hpx=cv.clientHeight, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=Hpx*dpr;
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#12141b"; g.fillRect(0,0,W,Hpx);
  if(!m) return;
  const D=dur(m); clampView(D);
  // rows share the height that is actually on screen instead of a fixed 164 px
  const spare=Math.max(0,Hpx-TOTAL);
  const H={sections:34+spare*0.16, moments:26+spare*0.10, energy:52+spare*0.46,
           stems:34+spare*0.28, ruler:18};
  const x=t=>(t-VIEW.t0)/VIEW.span*W;
  let y=0;
  // sections
  const S=secs(m);
  if(S.length){
    S.forEach((s,i)=>{
      const a=x(s.at), b=x(s.to!==undefined?s.to:(S[i+1]?S[i+1].at:D));
      g.fillStyle=COL[s.name]||"#46506b"; g.globalAlpha=.85;
      g.fillRect(a,y+3,Math.max(1,b-a-1),H.sections-9); g.globalAlpha=1;
      if(b-a>36){ g.fillStyle="#0e1016"; g.font="600 11px ui-sans-serif,system-ui";
        g.fillText(s.name+(s.repeat>1?" "+s.repeat:""),Math.max(a,0)+5,y+H.sections/2+3) }
      g.strokeStyle="#0e1016"; g.lineWidth=1;
      g.beginPath(); g.moveTo(a,y+2); g.lineTo(a,y+H.sections-4); g.stroke();
    });
  } else {
    g.fillStyle="#2a2f3e"; g.fillRect(0,y+3,W,H.sections-9);
    g.fillStyle="#666c7e"; g.font="11px ui-monospace,monospace";
    g.fillText(editable?"no sections — click here to add one":"no sections",8,y+H.sections/2+3);
  }
  y+=H.sections;
  // moments
  g.fillStyle="#1a1e28"; g.fillRect(0,y,W,H.moments);
  for(const mo of (m.moments||[])){
    const a=x(mo.at);
    g.strokeStyle=mo.kind==="drop"?"#f0a93c":mo.kind==="quiet"?"#5b6b8a":"#8f9aff";
    g.lineWidth=2; g.beginPath(); g.moveTo(a,y+3); g.lineTo(a,y+H.moments-9); g.stroke();
    g.fillStyle=g.strokeStyle; g.font="9px ui-monospace,monospace";
    g.fillText(mo.kind,a+3,y+H.moments-2);
  }
  y+=H.moments;
  // energy
  const E=m.energy||[];
  if(E.length){
    g.beginPath(); g.moveTo(0,y+H.energy);
    E.forEach(p=>g.lineTo(x(p[0]),y+H.energy-p[1]*(H.energy-6)));
    g.lineTo(W,y+H.energy); g.closePath();
    g.fillStyle="rgba(240,169,60,.18)"; g.fill();
    g.strokeStyle="#f0a93c"; g.lineWidth=1.2; g.stroke();
  }
  y+=H.energy;
  // stems
  const st=(m.stems&&m.stems.sources)||{}, at=(m.stems&&m.stems.at)||[];
  const rows=["drums","bass","other","vocals"].filter(k=>st[k]&&st[k].length);
  rows.forEach((k,i)=>{
    const h=H.stems/Math.max(1,rows.length), yy=y+i*h;
    st[k].forEach((v,j)=>{
      const t=at[j]!==undefined?at[j]:(j/st[k].length*D);
      const w=Math.max(1,W/st[k].length);
      g.fillStyle=`rgba(143,154,255,${(0.10+0.75*v).toFixed(3)})`;
      g.fillRect(x(t),yy+1,w,h-2);
    });
    g.fillStyle="#666c7e"; g.font="8.5px ui-monospace,monospace"; g.fillText(k,3,yy+h-2);
  });
  y+=H.stems;
  // ruler, and bar lines once they are far enough apart to mean anything
  const bar=(m.grid?m.grid.period*4:2);
  if(VIEW.span/bar < W/6){
    g.strokeStyle="rgba(230,233,241,.055)"; g.lineWidth=1;
    const first=Math.floor((VIEW.t0-(m.grid?m.grid.phase:0))/bar)*bar+(m.grid?m.grid.phase:0);
    for(let t=first;t<VIEW.t0+VIEW.span;t+=bar){
      g.beginPath(); g.moveTo(x(t),0); g.lineTo(x(t),y); g.stroke() }
  }
  const stepOpts=[1,2,5,10,15,30,60,120];
  const step=stepOpts.find(s=>VIEW.span/s<14)||120;
  g.fillStyle="#666c7e"; g.font="9px ui-monospace,monospace";
  for(let s=Math.ceil(VIEW.t0/step)*step;s<VIEW.t0+VIEW.span;s+=step){ const a=x(s);
    g.strokeStyle="rgba(230,233,241,.13)"; g.beginPath(); g.moveTo(a,0); g.lineTo(a,y); g.stroke();
    g.fillText(`${s/60|0}:${String(Math.round(s%60)).padStart(2,"0")}`,a+3,y+12) }
  // playhead
  const a=$("aud"), t=a.src?a.currentTime:0;
  g.strokeStyle="#fff"; g.lineWidth=1.3;
  g.beginPath(); g.moveTo(x(t),0); g.lineTo(x(t),y); g.stroke();
}
function redraw(){ draw($("c1"),MINE,true); draw($("c2"),OTHER,false);
  $("d1").textContent=MINE?desc(MINE):""; $("d2").textContent=OTHER?desc(OTHER):"" }
const desc=m=>`${(m.beats||[]).length} beats · ${secs(m).length} sections · `
  +`${(m.moments||[]).length} moments · ${(m.energy||[]).length} energy`;

function hit(m,t,W){
  const tol=VIEW.span/W*6;
  for(const s of secs(m)) if(Math.abs(s.at-t)<tol) return {type:"section",o:s};
  for(const mo of (m.moments||[])) if(Math.abs(mo.at-t)<tol) return {type:"moment",o:mo};
  return null;
}
$("c1").onclick=e=>{
  if(!MINE) return;
  if(drag&&drag.moved) return;
  const r=e.target.getBoundingClientRect(), W=r.width;
  const t=VIEW.t0+(e.clientX-r.left)/W*VIEW.span, y=e.clientY-r.top;
  const spare=Math.max(0,r.height-TOTAL);
  const HS=34+spare*0.16;
  const h=hit(MINE,t,W);
  if(h){ open(h); return }
  const st=snap(MINE,t);
  if(y<HS || tool==="sections"){
    const S=secs(MINE);
    S.push({at:st,to:dur(MINE),name:"new",id:"N",repeat:1,arc:+(st/dur(MINE)).toFixed(3)});
    S.sort((a,b)=>a.at-b.at);
    S.forEach((s,i)=>{ s.to=S[i+1]?S[i+1].at:dur(MINE); s.arc=+(s.at/dur(MINE)).toFixed(3) });
    MINE.sections={how:"hand-corrected in the editor",entries:S};
    MINE.chapters=S.map(s=>({at:s.at,name:s.name}));
    delete MINE.chapters_note;
    open({type:"section",o:S.find(s=>s.at===st)});
  } else {
    MINE.moments=(MINE.moments||[]).concat([{at:st,kind:"drop",size:0.9,
      note:"placed by ear in the editor"}]).sort((a,b)=>a.at-b.at);
    open({type:"moment",o:MINE.moments.find(x=>x.at===st)});
  }
  dirty(); redraw();
};
$("c2").onclick=e=>{ if(drag&&drag.moved) return;
  const r=e.target.getBoundingClientRect();
  seek(VIEW.t0+(e.clientX-r.left)/r.width*VIEW.span) };
function seek(t){ const a=$("aud"); if(a.src) a.currentTime=t; redraw() }

function open(h){
  sel=h; $("sel").style.display="block";
  $("selt").textContent=`${h.type} at ${h.o.at.toFixed(2)}s`;
  if(h.type==="section"){
    $("selkind").style.display="none"; $("selname").style.display="block";
    $("selname").value=h.o.name; $("selname").focus(); $("selname").select();
  } else {
    $("selkind").style.display="block"; $("selname").style.display="none";
    $("selkind").innerHTML=KINDS.map(k=>`<option${k===h.o.kind?" selected":""}>${k}</option>`).join("");
  }
}
$("selname").oninput=()=>{ if(sel&&sel.type==="section"){ sel.o.name=$("selname").value;
  sel.o.id=(sel.o.name[0]||"N").toUpperCase();
  MINE.chapters=secs(MINE).map(s=>({at:s.at,name:s.name}));
  const seen={}; secs(MINE).forEach(s=>{seen[s.id]=(seen[s.id]||0)+1; s.repeat=seen[s.id]});
  dirty(); redraw() } };
$("selkind").onchange=()=>{ if(sel&&sel.type==="moment"){ sel.o.kind=$("selkind").value; dirty(); redraw() } };
$("seldel").onclick=()=>{
  if(!sel) return;
  if(sel.type==="section"){ const S=secs(MINE).filter(s=>s!==sel.o);
    S.forEach((s,i)=>{s.to=S[i+1]?S[i+1].at:dur(MINE)});
    MINE.sections.entries=S; MINE.chapters=S.map(s=>({at:s.at,name:s.name})); }
  else MINE.moments=MINE.moments.filter(m=>m!==sel.o);
  sel=null; $("sel").style.display="none"; dirty(); redraw();
};
$("selclose").onclick=()=>{ sel=null; $("sel").style.display="none" };
let changed=false;
function dirty(){
  changed=true; $("save").textContent="Save •";
  clearTimeout(rebuildTimer);
  rebuildTimer=setTimeout(rebuildShow,120);
}
function rebuildShow(){
  if(!RM||!LAY||!MINE) return;
  try{
    F1=RM.mkReader(MINE,LAY);
    F2=OTHER?RM.mkReader(OTHER,LAY):null;
    $("rmeta").textContent=`${mineKey} · ${LAY.room} · ${LAY.fixtures.length} fixtures`;
    $("vsname").textContent=otherKey||"—";
    $("vstale").textContent="";
    clearTimeout(scoreTimer); scoreTimer=setTimeout(rescore,60);
  }catch(e){ $("rmeta").textContent="reader failed: "+e.message }
}
function rescore(){
  if(!F1||!F2||!RM){ $("lflash").textContent="—"; $("lbad").textContent="—";
    $("lnote").textContent=otherKey?"":"pick something in “against” to compare"; return }
  const D=dur(MINE), FD=0.06;
  const L1=[],L2=[];
  for(let t=0;t<D;t+=FD){ L1.push(RM.totalLight(F1(t))); L2.push(RM.totalLight(F2(t))) }
  const d1=[],d2=[];
  for(let i=1;i<L1.length;i++){ d1.push(L1[i]-L1[i-1]); d2.push(L2[i]-L2[i-1]) }
  const r=Math.max(0,RM.pearson(d1,d2))*100;
  let bad=0;
  for(let t=0;t<D;t+=0.5) if(RM.frameDiff(F1(t),F2(t))>0.06) bad+=0.5;
  $("lflash").textContent=r.toFixed(1)+"%";
  $("lflash").style.color = r>97?"var(--good)":r<60?"var(--bad)":"var(--tung)";
  $("lbad").textContent=bad.toFixed(0)+"s / "+D.toFixed(0)+"s";
  $("lnote").textContent="recalculated on every edit";
}
$("save").onclick=async()=>{
  const to = mineKey==="answer" ? "truth" : mineKey;
  const r=await fetch(`/api/save_map?song=${SONG}&to=${encodeURIComponent(to)}`,
    {method:"POST",body:JSON.stringify(MINE)});
  const j=await r.json();
  $("stat").style.color=j.error?"#e88055":"var(--good)";
  $("stat").textContent=j.error||("saved → "+j.path);
  if(!j.error){ changed=false; $("save").textContent="Save" }
};
for(const [b,t] of [["tool-sec","sections"],["tool-mom","moments"]])
  $(b).onclick=()=>{ tool=t; $("tool-sec").className=t==="sections"?"on":"";
    $("tool-mom").className=t==="moments"?"on":"" };
addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  const a=$("aud"); if(!a.src) return;
  if(e.key===" "){e.preventDefault(); a.paused?a.play():a.pause()}
  else if(e.key==="ArrowRight") a.currentTime+=e.shiftKey?30:2;
  else if(e.key==="ArrowLeft") a.currentTime-=e.shiftKey?30:2;
  else return; e.preventDefault(); redraw();
});
function zoom(f,at){
  const D=dur(MINE||OTHER||{song:{length:1}});
  const c=at!==undefined?at:VIEW.t0+VIEW.span/2;
  VIEW.span=Math.max(4,Math.min(D,VIEW.span*f));
  VIEW.t0=c-VIEW.span*((c-VIEW.t0)/(VIEW.span/f));
  clampView(D); redraw();
}
$("zin").onclick=()=>zoom(0.5);
$("zout").onclick=()=>zoom(2);
$("zall").onclick=()=>{ VIEW.t0=0; VIEW.span=dur(MINE||OTHER); redraw() };
$("follow").onclick=()=>{ FOLLOW=!FOLLOW; $("follow").className=FOLLOW?"on":"" };
for(const id of ["c1","c2"]){
  const cv=$(id);
  cv.addEventListener("wheel",e=>{
    e.preventDefault();
    const r=cv.getBoundingClientRect();
    const at=VIEW.t0+(e.clientX-r.left)/r.width*VIEW.span;
    if(e.shiftKey){ VIEW.t0+=(e.deltaY>0?1:-1)*VIEW.span*0.15; clampView(dur(MINE)); redraw() }
    else zoom(e.deltaY>0?1.25:0.8, at);
  },{passive:false});
  cv.addEventListener("mousedown",e=>{ drag={x:e.clientX,t0:VIEW.t0,moved:false} });
}
addEventListener("mousemove",e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x;
  if(Math.abs(dx)>3){ drag.moved=true;
    const W=$("c1").clientWidth;
    VIEW.t0=drag.t0-dx/W*VIEW.span; clampView(dur(MINE)); redraw() }
});
addEventListener("mouseup",()=>{ setTimeout(()=>{drag=null},0) });
addEventListener("resize",redraw);
function drawRoom(){
  if(!F1||!RM) return;
  const a=$("aud"), t=Math.min(a.src?a.currentTime:0, dur(MINE)-0.02);
  try{ (VIEWMODE==="room" ? RM.drawRoom : RM.drawFixtures)($("room"), F1(t), LAY) }
  catch(e){ if(!window.__drawErr){ window.__drawErr=1;
    $("stat").style.color="#e88055"; $("stat").textContent="draw: "+e.message } }
}
(function tick(){
  const a=$("aud");
  if(FOLLOW && a.src && !a.paused && MINE){
    const t=a.currentTime, D=dur(MINE);
    if(VIEW.span<D && (t<VIEW.t0+VIEW.span*0.15 || t>VIEW.t0+VIEW.span*0.85)){
      VIEW.t0=t-VIEW.span*0.35; clampView(D);
    }
  }
  redraw(); drawRoom(); requestAnimationFrame(tick);
})();

(async()=>{
 try{
  const Q=new URLSearchParams(location.search);
  RECIPE=await (await fetch("/static/recipe4.js")).text();
  const rj=await (await fetch("/static/room.js")).text();
  RM=new Function("RECIPE", rj+"\n;return {mkReader,prep,drawRoom,drawFixtures,frameDiff,pearson,totalLight};")(RECIPE);
  const sg=await (await fetch("/api/song?song="+encodeURIComponent(Q.get("song")||""))).json();
  LAY=(sg.layouts||{}).small||(sg.layouts||{}).club||Object.values(sg.layouts||{})[0];
  G=await (await fetch("/api/maps?song="+encodeURIComponent(Q.get("song")||""))).json();
  SONG=G.song;
  $("song").innerHTML=Object.entries(G.songs).map(([k,v])=>
    `<option value="${k}"${k===SONG?" selected":""}>${v}</option>`).join("");
  $("song").onchange=e=>location.href=`/analyse?song=${e.target.value}`;
  const keys=Object.keys(G.maps);
  if(!keys.length){ $("stat").textContent="no maps for this song yet"; return }
  const opt=k=>`<option value="${k}">${k}</option>`;
  $("mine").innerHTML=keys.map(opt).join("");
  $("other").innerHTML=['<option value="">— nothing —</option>'].concat(keys.map(opt)).join("");
  mineKey = keys.includes("answer")?"answer":keys[0];
  otherKey = keys.find(k=>k!==mineKey)||"";
  $("mine").value=mineKey; $("other").value=otherKey;
  const load=()=>{ mineKey=$("mine").value; otherKey=$("other").value;
    MINE=JSON.parse(JSON.stringify(G.maps[mineKey]));
    OTHER=otherKey?G.maps[otherKey]:null;
    $("n1").textContent=mineKey+"  (editing)"; $("n2").textContent=otherKey||"—";
    rebuildShow(); redraw() };
  $("mine").onchange=load; $("other").onchange=load; load();
  $("viewtog").onclick=()=>{ VIEWMODE = VIEWMODE==="fixtures" ? "room" : "fixtures";
    $("viewtog").textContent = VIEWMODE==="fixtures" ? "room view" : "fixture view" };
  VIEW={t0:0,span:dur(MINE)};
  $("aud").src="/api/audio?song="+SONG;
  // ?t= opens at a moment worth looking at, which matters when judging the room:
  // at 0:00 nothing is lit and a black rectangle tells you nothing
  const t0=parseFloat(Q.get("t")||"");
  if(isFinite(t0)) $("aud").addEventListener("loadedmetadata",()=>{$("aud").currentTime=t0},{once:true});
  $("help").textContent="wheel to zoom · shift-wheel or drag to pan · click the top strip to add a "
   +"section, the row under it for a moment · click a marker to rename or delete · snaps to the "
   +"nearest downbeat · space plays · arrows seek 2s, shift 30s";
 }catch(e){ $("stat").style.color="#e88055"; $("stat").textContent=e.message }
})();
</script></body></html>
