function setStrip(id,px){
  const S=GL.strips[id]; if(!S||!px) return;
  const col=S.col, n=Math.min(S.n,px.length), K=1.35;
  for(let i=0;i<n;i++){
    const c=px[i]||[0,0,0];
    const r=sRGBtoLin(c[0]/255)*K, g2=sRGBtoLin(c[1]/255)*K, b=sRGBtoLin(c[2]/255)*K;
    const base=i*36;
    for(let k=0;k<12;k++){const o=base+k*3;col[o]=r;col[o+1]=g2;col[o+2]=b}}
  S.attr.needsUpdate=true}

function crowdGL(t,e){
  const P=GL.people, n=GL.cbody.count, amp=0.055*(0.35+0.95*e);
  for(let i=0;i<n;i++){
    const p=P[i];
    const bob=amp*(0.5+0.5*Math.sin(2*Math.PI*(t/(2*BAR))+p.ph*6.283));
    const hb=p.h-0.22;
    GL.p3.set(p.x,bob,p.z); GL.s3.set(p.w,hb,p.w);
    GL.m4.compose(GL.p3,GL.idq,GL.s3); GL.cbody.setMatrixAt(i,GL.m4);
    GL.p3.set(p.x,bob+p.h-0.115,p.z); GL.s3.set(p.w,p.w,p.w);
    GL.m4.compose(GL.p3,GL.idq,GL.s3); GL.chead.setMatrixAt(i,GL.m4)}
  GL.cbody.instanceMatrix.needsUpdate=true;
  GL.chead.instanceMatrix.needsUpdate=true}

function drawRoomGL(f){
  const t=f.t, hz=hazeAt(t), e=en(t);
  window.__haze=hz;
  if(QUAL!==GL.qual) applyQual();
  camApply(t);
  const G=GL.map, F=f.fixtures;
  for(let i=0;i<F.length;i++) G[F[i].id]=F[i];
  const dens=0.34+0.66*hz;
  let sf=0;

  for(let i=0;i<R_PARS.length;i++){const id=R_PARS[i],o=get(id);
    const I=Math.pow(cl(o.level),0.80)*GAIN.par;
    const end=setBeam(id,POS[id],PAR_AIM[id],o.r,o.g,o.b,I,HALF.par,dens);
    setPool(id,end,o.r,o.g,o.b,I*POOLK.par);
    setLens(id,o.r,o.g,o.b,I*0.45)}

  for(let i=0;i<R_UPS.length;i++){const id=R_UPS[i],o=get(id);
    const I=Math.pow(cl(o.level),0.80)*GAIN.up;
    setBeam(id,POS[id],UP_AIM[id],o.r,o.g,o.b,I,HALF.uplight,dens);
    setWash(id,o.r,o.g,o.b,I*1.30);
    setLens(id,o.r,o.g,o.b,I*0.40)}

  for(let i=0;i<R_HEADS.length;i++){const id=R_HEADS[i],o=get(id);
    let lv=cl(o.level);
    if(o.strobe>0) lv*=chop(t,o.strobe,0.45,0.06);
    const I=Math.pow(lv,0.80)*GAIN.head;
    const end=setBeam(id,POS[id],headAim(id,o.pan,o.tilt),o.r,o.g,o.b,I,HALF.head,dens);
    setPool(id,end,o.r,o.g,o.b,I*POOLK.head);
    setLens(id,o.r,o.g,o.b,I*0.55)}

  for(let i=0;i<R_STROBES.length;i++){const id=R_STROBES[i],o=get(id);
    const on=o.strobe>0?o.level*chop(t,o.strobe,0.42,0.03):o.level;
    if(on>sf) sf=on;
    const I=Math.pow(cl(on),0.80)*GAIN.strobe;
    const end=setBeam(id,POS[id],STROBE_AIM[id],255,252,246,I,HALF.strobe,dens);
    setPool(id,end,255,252,246,I*POOLK.strobe);
    setLens(id,255,252,246,I*0.60)}

  for(let i=0;i<R_STRIPS.length;i++){const id=R_STRIPS[i];setStrip(id,get(id).pixels)}

  crowdGL(t,e);
  window.__sf=sf;
  fogChip(!!(get('fog_1')&&get('fog_1').level>0));

  const load=frameLoad(f);
  const ex=(1.28+0.18*hz)/(1.0+1.05*load);
  GL.r.toneMappingExposure=ex;
  if(QUAL&&GL.composer){
    if(GL.bloom) GL.bloom.strength=0.46+0.26*hz;
    if(GL.aces){GL.aces.uniforms.exposure.value=ex;GL.aces.uniforms.air.value=hz}
    GL.composer.render();
  }else{
    GL.r.setRenderTarget(null);
    GL.r.render(GL.scene,GL.cam)}}

let ROOMJS=true;
function drawRoom(f){
  if(RMODE==='gl'){
    try{drawRoomGL(f);GLSTRIKE=0}
    catch(err){
      console.error(err);
      /* degrade a step at a time: drop postprocessing first, and only give up
         on WebGL entirely if the plain path is broken too */
      GLSTRIKE++;
      if(GLSTRIKE===3&&GL&&GL.composer){GL.composer=null;GL.qual=-1;
        note('bloom off — postprocessing failed')}
      else if(GLSTRIKE>5) to2D('webgl render failed — 2D fallback')}
    return}
  if(RMODE==='2d'){
    const LR=(typeof window!=='undefined')&&window.LimelightRoom;
    if(ROOMJS&&LR&&LR.drawRoom){
      try{ LR.drawRoom(cv,f,LAYOUT); window.__haze=hazeAt(f.t); return }
      catch(err){ ROOMJS=false; console.error(err); note('room.js failed — built-in 2D') }
    }
    drawRoom2D(f);return}
  window.__haze=hazeAt(f.t)}          // still loading: the HUD keeps working

/* ---------- choosing a renderer ---------- */
function to2D(why){
  if(RMODE==='2d') return;
  RMODE='2d';
  try{if(GL&&GL.r)GL.r.dispose()}catch(e){}
  GL=null;
  /* a canvas cannot hand back a 2D context once WebGL has had it, so if we got
     as far as making a context we draw into a fresh canvas over the top and
     point `cv` -- the surface snap() saves -- at that instead */
  try{
    if(GLTRIED&&cv&&cv.parentNode){
      const n=document.createElement('canvas');
      n.id='room2d';
      n.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1';
      cv.style.display='none';
      cv.parentNode.insertBefore(n,cv);
      cv=n}
  }catch(e){}
  init2D();
  note(why);
  fit();
  try{if(typeof render==='function')render()}catch(e){console.error(e)}}

let BOOTED=false;
function boot(why){
  if(BOOTED) return; BOOTED=true;
  let bad=null;
  const T3=window.THREE;
  if(!T3||!T3.WebGLRenderer)
    bad=(why==='slow')?'three.js did not load in time — 2D fallback'
                      :'three.js did not load — 2D fallback';
  else{
    const miss=['EffectComposer','RenderPass','ShaderPass','UnrealBloomPass','CopyShader',
                'LuminosityHighPassShader'].filter(function(k){return !T3[k]});
    if(miss.length) bad='missing '+miss[0]+' — 2D fallback'}
  if(!bad){
    try{
      const probe=document.createElement('canvas').getContext('webgl2');
      if(!probe) bad='no webgl2 — 2D fallback';
      else{const x=probe.getExtension('WEBGL_lose_context'); if(x)x.loseContext()}
    }catch(e){bad='no webgl2 — 2D fallback'}}
  if(bad){to2D(bad);return}
  try{initGL();RMODE='gl'}
  catch(e){console.error(e);to2D('webgl init failed — 2D fallback');return}
  fit();
  try{if(typeof render==='function')render()}
  catch(e){console.error(e);to2D('webgl render failed — 2D fallback')}}

(function loadCDN(){
  let gi=0;
  const nextGroup=function(){
    if(gi>=CDN_FILES.length){boot('');return}
    const list=CDN_FILES[gi++];
    let left=list.length;
    const step=function(){if(--left===0) nextGroup()};
    list.forEach(function(p){
      const s=document.createElement('script');
      s.src=CDN+p; s.async=false; s.onload=step; s.onerror=step;
      document.head.appendChild(s)})};
  setTimeout(function(){if(!BOOTED)boot('slow')},9000);   // a hung CDN falls back too
  nextGroup()})();

function rendererReset(){

  R_PARS=OF('par'); R_UPS=OF('uplight'); R_HEADS=OF('head').concat(OF('wash'));
  R_STROBES=OF('strobe').concat(OF('blinder')); R_STRIPS=OF('strip');

/* ================= renderer: SKY =================
   Drones are points of light against black, which is a much easier thing to draw
   convincingly than volumetric beams -- an additive glow per drone, sorted back
   to front, is most of the way there. */
const skyCv=$('#sky'), sx=skyCv.getContext('2d');
let SW=0,SH=0;
const SKYVIEWS=[{eye:[0,4,-150],at:[0,42,0],fov:38},
                {eye:[-118,16,-86],at:[0,44,0],fov:40},
                {eye:[0,132,-30],at:[0,30,0],fov:52},
                {eye:[0,6,-72],at:[0,50,0],fov:56}];
function skyFit(){SW=window.innerWidth;SH=window.innerHeight;
  const d=Math.min(2,window.devicePixelRatio||1);
  skyCv.width=SW*d;skyCv.height=SH*d;sx.setTransform(d,0,0,d,0,0)}
function sproj(p,cam){
  const f=[cam.at[0]-cam.eye[0],cam.at[1]-cam.eye[1],cam.at[2]-cam.eye[2]];
  const fl=Math.hypot(f[0],f[1],f[2]), fz=[f[0]/fl,f[1]/fl,f[2]/fl];
  let rx=[fz[2],0,-fz[0]]; const rl=Math.hypot(rx[0],rx[1],rx[2])||1;
  rx=[rx[0]/rl,0,rx[2]/rl];
  const uy=[rx[1]*fz[2]-rx[2]*fz[1],rx[2]*fz[0]-rx[0]*fz[2],rx[0]*fz[1]-rx[1]*fz[0]];
  const d=[p[0]-cam.eye[0],p[1]-cam.eye[1],p[2]-cam.eye[2]];
  const z=d[0]*fz[0]+d[1]*fz[1]+d[2]*fz[2]; if(z<=0.5) return null;
  const x=d[0]*rx[0]+d[1]*rx[1]+d[2]*rx[2], y=d[0]*uy[0]+d[1]*uy[1]+d[2]*uy[2];
  const k=(SH*0.5)/Math.tan(cam.fov*Math.PI/360);
  return {x:SW/2+k*x/z, y:SH/2-k*y/z, z:z, s:k/z}}
function drawSky(f){
  const t=f.t;
  let cam={...SKYVIEWS[VIEW%SKYVIEWS.length]};
  if(DRIFT){cam.eye=[cam.eye[0]+7*Math.sin(t*0.045),cam.eye[1]+2.5*Math.sin(t*0.031+1.1),cam.eye[2]]}
  const g=sx.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,'#020306');g.addColorStop(0.62,'#04060c');g.addColorStop(1,'#070a12');
  sx.fillStyle=g;sx.fillRect(0,0,SW,SH);
  // a horizon and a hint of ground, so altitude reads
  const h=sproj([0,0,0],cam);
  if(h){sx.fillStyle='rgba(255,255,255,.022)';sx.fillRect(0,h.y,SW,SH-h.y);
    sx.fillStyle='rgba(255,255,255,.06)';sx.fillRect(0,h.y,SW,1)}
  const pts=[];
  for(const d of f.drones){const q=sproj([d.x,d.y,d.z],cam); if(q) pts.push([q,d])}
  pts.sort((a,b)=>b[0].z-a[0].z);
  sx.globalCompositeOperation='lighter';
  for(const [q,d] of pts){
    const lv=Math.pow(d.level,1/1.6); if(lv<0.004) continue;
    /* A drone ninety metres away is a POINT. The radius must be a small pixel
       size that falls off with distance, not the raw projection scale -- that
       gave 38 px cores and 340 px glows, and a hundred and twenty of them
       additively is a sun. And the per-drone alpha has to be low enough that a
       dense formation stays a swarm rather than a white mass. */
    const R=Math.max(1.1,Math.min(5.0, 190/q.z));
    const GLOW=R*4.0;
    const gr=sx.createRadialGradient(q.x,q.y,0,q.x,q.y,GLOW);
    gr.addColorStop(0,'rgba('+d.r+','+d.g+','+d.b+','+(0.60*lv).toFixed(3)+')');
    gr.addColorStop(0.30,'rgba('+d.r+','+d.g+','+d.b+','+(0.16*lv).toFixed(3)+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    sx.fillStyle=gr;sx.beginPath();sx.arc(q.x,q.y,GLOW,0,7);sx.fill();
    sx.fillStyle='rgba('+d.r+','+d.g+','+d.b+','+(0.85*lv).toFixed(3)+')';
    sx.beginPath();sx.arc(q.x,q.y,R,0,7);sx.fill();
    if(lv>0.55){sx.fillStyle='rgba(255,255,255,'+(0.55*(lv-0.55)/0.45).toFixed(3)+')';
      sx.beginPath();sx.arc(q.x,q.y,R*0.5,0,7);sx.fill()}}
  sx.globalCompositeOperation='source-over';
  /* a soft ceiling: dim the whole frame back when a lot of drones are bright at
     once, which is the additive equivalent of stopping a camera down */
  const load=f.drones.reduce((a,d)=>a+d.level,0)/f.drones.length;
  if(load>0.42){sx.globalCompositeOperation='multiply';
    const k=Math.max(0.45,1-(load-0.42)*1.3);
    sx.fillStyle='rgba('+Math.round(255*k)+','+Math.round(255*k)+','+Math.round(255*k)+',1)';
    sx.fillRect(0,0,SW,SH);sx.globalCompositeOperation='source-over'}}

  const E=(SOBS.chords&&SOBS.chords.events); if(!E||!E.length) return;
  E.forEach((c,i)=>{const a=X(c.at),b=i+1<E.length?X(E[i+1].at):X(DUR);
    g.fillStyle=i%2?'#12161d':'#151a22';g.fillRect(a,2,b-a-1,h-4);
    g.fillStyle='#c9a0ff';g.font='600 10px ui-monospace,Menlo,monospace';
    if(b-a>18)g.fillText(c.chord,a+3,h/2+4)})});

lane('lyrics','243 words, Whisper',24,(g,w,h)=>{
  const VS=(SOBS.vocal_silence&&SOBS.vocal_silence.spans)||[];
  VS.forEach(s=>{g.fillStyle='rgba(255,255,255,.04)';
    g.fillRect(X(s.from),0,X(s.to)-X(s.from),h)});
  g.font='10px ui-sans-serif';g.fillStyle='#ffd166';
  let lastx=-99;
  const WD=(SOBS.lyrics&&SOBS.lyrics.words); if(!WD) return;
  WD.forEach(wd=>{const x=X(wd.at);
    if(x-lastx<7) return; g.fillText(wd.word,x,h-7); lastx=x+wd.word.length*5.2})});

lane('stereo','width & pan',30,(g,w,h)=>{
  const st=(SOBS.stereo&&SOBS.stereo.mix); if(!st||!st.width||!st.pan) return;
  g.strokeStyle='#5b8cff';g.lineWidth=1.2;g.beginPath();
  st.width.forEach((v,i)=>{const x=X(DOWNS[i]),y=h-2-(h-5)*v;i?g.lineTo(x,y):g.moveTo(x,y)});
  g.stroke();
  g.strokeStyle='#ff7a2f';g.lineWidth=1.2;g.beginPath();
  st.pan.forEach((v,i)=>{const x=X(DOWNS[i]),y=h/2-(h/2-3)*(v*3);i?g.lineTo(x,y):g.moveTo(x,y)});
  g.stroke();
  g.strokeStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke()});

lane('brightness','centroid per stem',30,(g,w,h)=>{
  const BS=(SOBS.brightness&&SOBS.brightness.sources); if(!BS) return;
  Object.keys(STEMC).forEach(k=>{const v=BS[k]; if(!v) return;
    g.strokeStyle=gr(hexrgb(STEMC[k]),0.55);g.lineWidth=1;g.beginPath();
    v.forEach((y,i)=>{const x=X(DOWNS[i]),yy=h-2-(h-5)*y;i?g.lineTo(x,yy):g.moveTo(x,yy)});
    g.stroke()})});

function hexrgb(hx){const n=parseInt(hx.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255)}


/* ================= the app =================
   Three readers of one file. The switch between them is the demonstration. */
let T=0, playing=false, lastTs=0, LASTF=null, fps=0, fc=0, fT=0;
const mm=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const mms=t=>mm(t)+'.'+Math.floor(t*10%10);

/* bi() comes from the recipe */
function chAtT(t){let n=CH[0][1];for(const c of CH){if(c[0]<=t)n=c[1];else break}return n}

/* ---- modes ---- */
function mode(i){
  MODE=i;
  document.querySelectorAll('#modes button').forEach((b,j)=>b.setAttribute('aria-selected',i===j));
  $('#room').classList.toggle('hide',i!==0);
  $('#sky').classList.toggle('hide',i!==1);
  $('#score').classList.toggle('hide',i!==2);
  $('#tools').children[0].style.display=(i===2?'none':'');
  if(i===2) buildScore();
  fit(); skyFit(); render()}
function cycleView(){VIEW=(VIEW+1)%4;
  if(typeof setView==='function'&&MODE===0) setView(VIEW); else render()}
function full(){const e=document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen(); else e.requestFullscreen&&e.requestFullscreen()}
function drawer(){$('#drawer').classList.toggle('open');
  $('#tools').children[2].classList.toggle('on')}


const SAFE=(function(){
  const M=(typeof MAP_FULL!=='undefined'&&MAP_FULL)?MAP_FULL:{};
  const O=M.observations||{};
  const arr=x=>Array.isArray(x)?x:[];
  const title=(typeof SONG_TITLE==='string'&&SONG_TITLE)?SONG_TITLE
    :((M.song&&M.song.title)?String(M.song.title).replace(/\.[a-z0-9]+$/i,''):'Limelight');
  const bpm=(M.grid&&M.grid.bpm)!==undefined?M.grid.bpm
    :(typeof PER==='number'&&PER>0?(60/PER).toFixed(1):'?');
  const key=(O.key&&O.key.estimate)?O.key.estimate:'';
  const acc=arr(M.accents&&M.accents.events);
  const beats=arr(M.beats);
  const vec=(M.vectors&&M.vectors.rows&&M.vectors.dim)?M.vectors:null;
  function rows(){
    const out=[['beats',beats.length],['grid','<b>'+bpm+'</b> bpm']];
    if(key) out.push(['key','<b>'+key+'</b>']);
    const mt=O.microtiming;
    if(mt&&typeof mt.quantisation==='string')
      out.push(['quantised','1/'+mt.quantisation.split('/').pop()+' of a beat'
        +(mt.within_15ms_pct!==undefined?', '+mt.within_15ms_pct+'% inside 15 ms':'')]);
    const learned=M.segmentation_proposal&&arr(M.segmentation_proposal.sections).length;
    out.push(['sections',(typeof SEC!=='undefined'?SEC.length:0)+' mine'
      +(learned?', '+learned+' learned':'')]);
    if(O.chords) out.push(['chords',arr(O.chords.events).length+' bars']);
    if(M.stems&&M.stems.sources) out.push(['stems',Object.keys(M.stems.sources).length]);
    if(acc.length) out.push(['accents','<b>'+acc.length+'</b>, '
      +Math.round(100*acc.filter(a=>!a.on_grid).length/acc.length)+'% off-grid']);
    if(O.lyrics) out.push(['lyrics',arr(O.lyrics.words).length+' word times']);
    for(const k of ['melody','harmony','voice'])
      if(O[k]&&arr(O[k].value).length) out.push([k,arr(O[k].value).length+' points']);
    if(vec) out.push(['vectors',vec.rows+'&times;'+vec.dim]);
    return out;
  }
  return {title:title,bpm:bpm,key:key,beats:beats,vectors:vec,rows:rows};
})();

/* ---- transport ---- */
function pick(inp){const f=inp.files[0]; if(!f) return;
  $('#audio').src=URL.createObjectURL(f);
  $('#hello').classList.add('hide');
  $('#audio2') && ($('#audio2').src=$('#audio').src);
  setTimeout(()=>{playing=true;$('#play').innerHTML='&#10074;&#10074;';$('#audio').play()},120)}
function toggle(){playing=!playing;$('#play').innerHTML=playing?'&#10074;&#10074;':'&#9654;';
  const a=$('#audio'); if(a.src){playing?a.play():a.pause()}}
function seek(v){T=Math.max(0,Math.min(DUR,v));const a=$('#audio');if(a.src)a.currentTime=T;render()}
function scrub(e){const r=$('#seekwrap').getBoundingClientRect();seek((e.clientX-r.left)/r.width*DUR)}

/* ---- the frame, per reader ---- */
function currentFrame(){
  if(MODE===1) return droneFrame(T);
  return frame(T)}

function render(){
  const f=currentFrame(); LASTF=f;
  if(MODE===0) drawRoom(f);
  else if(MODE===1) drawSky(f);
  else drawScoreCursor();
  const p=T/DUR*100;
  $('#fill').style.width=p+'%'; $('#knob').style.left=p+'%';
  $('#time').textContent=mms(T)+' / '+mm(DUR);
  const b=bi(T), bar=Math.floor((b-DBP)/4)+1;
  let cd='-'; for(const q of (MAP.chords||[])){if(q[0]<=T)cd=q[1];else break}
  const S=SEC.filter(s=>s.at<=T).pop();
  $('#where').textContent='bar '+bar+'  '+chAtT(T)+'  '+cd+(S?('  '+S.id+'#'+S.repeat):'')}

function loop(ts){
  const a=$('#audio');
  if(playing){ if(a.src&&!a.paused){T=a.currentTime}else{T+=(ts-lastTs)/1000} }
  lastTs=ts; if(T>DUR)T=0;
  fc++; if(ts-fT>1000){fps=fc;fc=0;fT=ts;
    const m=$('#metafps');
    if(m){const r=(typeof RMODE!=='undefined')?RMODE:'?';
      m.textContent=fps+' fps · '+(MODE===0?('room: '+(r==='gl'?'webgl':r==='2d'?'canvas 2d':'loading')):
        MODE===1?'sky: canvas 2d':'score')}}
  render(); requestAnimationFrame(loop)}

/* ---- score, built on demand ---- */
let scoreBuilt=false, PXS=8;
function buildScore(){
  if(scoreBuilt) return; scoreBuilt=true;
  const host=$('#score'); host.innerHTML='';
  const wrap=document.createElement('div');
  wrap.style.cssText='position:relative;padding:56px 0 96px';
  LANES.forEach(L=>{
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:stretch;border-bottom:1px solid rgba(255,255,255,.04)';
    const lab=document.createElement('div');
    lab.style.cssText='position:sticky;left:0;z-index:5;width:126px;flex:0 0 126px;'
      +'background:var(--bg);border-right:1px solid var(--line);padding:5px 10px;'
      +'font:11px/1.35 ui-monospace,Menlo,monospace;color:var(--faint);display:flex;'
      +'flex-direction:column;justify-content:center';
    lab.innerHTML='<div style="color:var(--dim)">'+L.name+'</div><div>'+L.sub+'</div>';
    const c=document.createElement('canvas');
    const d=Math.min(2,window.devicePixelRatio||1), w=Math.ceil(DUR*PXS)+2;
    c.width=w*d;c.height=L.h*d;c.style.width=w+'px';c.style.height=L.h+'px';
    const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0);
    g.fillStyle='#08090c';g.fillRect(0,0,w,L.h);
    try{L.draw(g,w,L.h)}catch(e){g.fillStyle='#f0b429';g.font='10px monospace';
      g.fillText(L.name+': '+e.message,6,13)}
    row.appendChild(lab);const bd=document.createElement('div');
    bd.style.cssText='position:relative;flex:1';bd.appendChild(c);row.appendChild(bd);
    wrap.appendChild(row)});
  const cur=document.createElement('div'); cur.id='scur';
  cur.style.cssText='position:absolute;top:0;bottom:0;width:1px;background:var(--acc);'
    +'pointer-events:none;box-shadow:0 0 8px var(--acc)';
  wrap.appendChild(cur); host.appendChild(wrap);
  host.onclick=e=>{const r=wrap.getBoundingClientRect();
    seek((host.scrollLeft+e.clientX-r.left-126)/PXS)}}
function drawScoreCursor(){
  const c=$('#scur'); if(!c) return;
  c.style.left=(126+T*PXS)+'px';
  const h=$('#score');
  if(playing){const px=T*PXS;
    if(px<h.scrollLeft+180||px>h.scrollLeft+h.clientWidth-220)
      h.scrollLeft=Math.max(0,px-h.clientWidth*0.35)}}

/* ---- the drawer, which is where every remaining control went ---- */
function fillDrawer(){
  const O=(MAP_FULL&&MAP_FULL.observations)||{};
  const n=(O.notes&&O.notes.sources)
    ? Object.values(O.notes.sources).reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0) : 0;
  const venues=Object.keys(LAYOUTS);
  $('#drawer').innerHTML=
   '<h2>Venue</h2><div class="row"><span>rig</span><div class="seg" id="vseg">'
   + venues.map((v,i)=>'<button class="'+(LAYOUTS[v]===LAYOUT?'on':'')+'" onclick="setVenue(\''+v+'\')">'
       +v+'</button>').join('') + '</div></div>'
   + '<div class="mono" id="vinfo"></div>'
   + '<h2>Look</h2>'
   + '<div class="row"><span>haze</span><input type="range" min="0" max="0.9" step="0.02" value="0.28"'
   + ' oninput="HAZE=+this.value;render()"></div>'
   + '<div class="row"><span>camera drift</span><div class="seg"><button class="on"'
   + ' onclick="DRIFT=!DRIFT;this.classList.toggle(\'on\');this.textContent=DRIFT?\'on\':\'off\'">on</button></div></div>'
   + '<div class="row"><span>quality</span><div class="seg"><button class="on"'
   + ' onclick="QUAL=QUAL?0:1;this.classList.toggle(\'on\');this.textContent=QUAL?\'high\':\'fast\';render()">high</button></div></div>'
   + '<div class="row"><span>anticipation</span><div class="seg"><button class="on"'
   + ' onclick="ANT=!ANT;this.classList.toggle(\'on\');render()">on</button></div></div>'
   + '<h2>Structure</h2>'
   + '<div class="row"><span>segmentation</span><div class="seg" id="sseg">'
   + '<button class="on" onclick="useStructure(0)">mine</button>'
   + '<button onclick="useStructure(1)">learned</button></div></div>'
   + '<p class="mono">Six methods say the hand segmentation is wrong between 1:03 and 1:47. The '
   + 'learned one carries <b>7</b> repeats to escalate against <b>1</b>.</p>'
   + '<h2>Take it away</h2>'
   + '<div class="row"><a class="link" href="#" onclick="dlScore();return false">the score, '+(SAFE.beats.length)+' beats &#8595;</a></div>'
   + (SAFE.vectors ? '<div class="row"><a class="link" href="#" onclick="dlVec();return false">the vectors, '
      + SAFE.vectors.rows+'&times;'+SAFE.vectors.dim+' &#8595;</a></div>' : '')
   + '<h2>What is in the file</h2><div class="mono">'
   + SAFE.rows().map(r=>'<div>'+r[0]+' &middot; '+r[1]+'</div>').join('')+'</div>'
   + '<h2>Keys</h2><div class="keys">'
   + [['space','play'],['&larr; &rarr;','a bar'],['1 2 3','room / sky / score'],
      ['c','camera'],['f','full screen'],['g','swap segmentation'],['.','more']]
     .map(k=>'<kbd>'+k[0]+'</kbd><span>'+k[1]+'</span>').join('')+'</div>'
   + '<h2>Audio</h2><audio id="audio2" controls></audio>';
  vinfo()}
function vinfo(){
  const c={}; LAYOUT.fixtures.forEach(f=>c[f.kind]=(c[f.kind]||0)+1);
  const dmx=LAYOUT.fixtures.reduce((s,f)=>s+(f.dmx_ch||0),0);
  $('#vinfo').innerHTML='<div><b>'+LAYOUT.fixtures.length+'</b> fixtures &middot; '
    + Object.keys(c).map(k=>c[k]+' '+k).join(', ')+'</div>'
    + '<div>'+LAYOUT.size_m.w+' &times; '+LAYOUT.size_m.d+' &times; '+LAYOUT.size_m.h+' m'
    + (dmx?(' &middot; '+dmx+' DMX ch, '+Math.ceil(dmx/512)+' universes'):'')+'</div>'
    + '<div>the same recipe drives all of these, unchanged</div>'}
function setVenue(v){
  LAYOUT=LAYOUTS[v];
  document.querySelectorAll('#vseg button').forEach(b=>b.classList.toggle('on',b.textContent===v));
  rebuildGeo();
  if(typeof rendererReset==='function') rendererReset();
  if(typeof GL!=='undefined'&&GL){GL=null;GLTRIED=false}   // the GL scene rebuilds itself
  vinfo(); fit(); render()}
function useStructure(i){
  document.querySelectorAll('#sseg button').forEach((b,j)=>b.classList.toggle('on',i===j));
  const src=i?MAP.proposal.sections:MAP.sections;
  const ch=i?MAP.proposal.chapters:MAP.chapters;
  CH.length=0; ch.forEach(c=>CH.push(c.slice?c.slice():[c.at,c.name]));
  SEC.length=0; src.forEach(s=>SEC.push(Object.assign({},s)));
  SEG=buildSegs(); render()}
function dlScore(){const b=new Blob([JSON.stringify(MAP_FULL,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='the-nights.map.json';a.click()}
function dlVec(){const r=atob(VEC_B64),u=new Uint8Array(r.length);
  for(let i=0;i<r.length;i++)u[i]=r.charCodeAt(i);
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u]));
  a.download='the-nights.vec.f16';a.click()}

/* ---- meta, top left: four lines, no chrome ---- */
$('#meta').innerHTML='<div><b>'+SAFE.title+'</b></div>'
  +'<div>'+SAFE.bpm+' bpm'+(SAFE.key?' &middot; '+SAFE.key:'')
  +' &middot; '+BEATS.length+' beats</div>'
  +'<div id="metafps">&mdash;</div>';

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='AUDIO')return;
  const k=e.key;
  if(k===' '){toggle();e.preventDefault()}
  if(k==='ArrowLeft'){seek(T-BAR);e.preventDefault()}
  if(k==='ArrowRight'){seek(T+BAR);e.preventDefault()}
  if(k==='1'){mode(0)} if(k==='2'){mode(1)} if(k==='3'){mode(2)}
  if(k==='c'){cycleView()} if(k==='f'){full()} if(k==='.'){drawer()}
  if(k==='g'){const on=document.querySelectorAll('#sseg button')[1].classList.contains('on');
    useStructure(on?0:1)}});
window.addEventListener('resize',()=>{fit();skyFit();render()});
(function(){
  const m=$('#marks'); let h='';
  MO.forEach(x=>{h+='<i class="'+(x.kind==='drop'?'drop':'')+'" style="left:'
    +(x.at/DUR*100)+'%"></i>'});
  m.innerHTML=h})();
const AUD=document.createElement('audio'); AUD.id='audio'; document.body.appendChild(AUD);
fillDrawer(); fit(); skyFit(); mode(0); requestAnimationFrame(loop);

function serverAudio(){
  if(typeof SONG_SLUG!=='string'||!SONG_SLUG) return;
  const d=document;
  const a=d.getElementById('audio');
  const pick=d.getElementById('picker'), hint=d.getElementById('pickhint');
  if(!a||!pick||d.getElementById('playnow')) return;
  const url='/api/audio?song='+encodeURIComponent(SONG_SLUG);
  const b=d.createElement('button');
  b.id='playnow'; b.type='button'; b.textContent='Play';
  b.onclick=function(){
    try{
      if(!a.src) a.src=url;
      const two=d.getElementById('audio2'); if(two&&!two.src) two.src=url;
      const h=d.getElementById('hello'); if(h) h.classList.add('hide');
      playing=true;
      const pb=d.getElementById('play'); if(pb) pb.innerHTML='&#10074;&#10074;';
      const p=a.play(); if(p&&p.catch) p.catch(function(){});
    }catch(e){}
  };
  pick.parentNode.insertBefore(b,pick);
  pick.style.display='none';
  if(hint) hint.textContent='This machine already has the audio.';
  const alt=d.createElement('a');
  alt.href='#'; alt.textContent='choose a different file instead';
  alt.style.cssText='display:block;margin-top:12px;opacity:.55;font-size:13px;color:inherit';
  alt.onclick=function(e){e.preventDefault();pick.style.display='';b.remove();alt.remove()};
  if(hint&&hint.parentNode) hint.parentNode.insertBefore(alt,hint.nextSibling);
  a.src=url;
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',serverAudio);
else serverAudio();

</script>
