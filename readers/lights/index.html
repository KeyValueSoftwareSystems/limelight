<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>club — limelight</title>
<style>
:root{
  --bg:#07070c; --panel:#101018; --line:#23232f; --ink:#eef0f6; --dim:#9aa0b4; --faint:#5f657a;
  --hot:#ff9d4d; --ok:#5fe3b0; --blue:#5b8cff;
  --mono:"Ubuntu Mono",ui-monospace,Menlo,monospace;
  --sans:"Lato",system-ui,-apple-system,sans-serif;
}
:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:1rem;padding:.55rem .9rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--hot)}
.meta{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
.meta b{color:var(--ink);font-weight:400}
label.file{font-family:var(--mono);font-size:.7rem;color:var(--dim);border:1px solid var(--line);
  padding:.3rem .55rem;cursor:pointer;background:var(--panel)}
label.file:hover{color:var(--ink);border-color:var(--dim)}
label.file input{display:none}
main{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
@media(max-width:900px){main{grid-template-columns:1fr}}
#stage{background:#040408;position:relative;min-height:0}
#stage svg{display:block;width:100%;height:100%}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h3{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  padding:.55rem .7rem .3rem}
#frame{flex:1;overflow:auto;font-family:var(--mono);font-size:.68rem;line-height:1.5;color:var(--dim);
  padding:0 .7rem .7rem;white-space:pre}
#frame .k{color:var(--blue)}#frame .v{color:var(--hot)}#frame .z{color:#3d4256}
#next{font-family:var(--mono);font-size:.74rem;color:var(--ok);padding:.4rem .7rem;border-top:1px solid var(--line)}
#recipe{font-family:var(--mono);font-size:.68rem;color:var(--faint);padding:.45rem .7rem;border-top:1px solid var(--line)}
#recipe b{color:var(--hot);font-weight:400}
footer{border-top:1px solid var(--line);padding:.5rem .9rem .7rem}
#lanes{display:block;width:100%;height:96px}
.controls{display:flex;align-items:center;gap:.55rem;margin-top:.45rem;flex-wrap:wrap}
button{font-family:var(--mono);font-size:.72rem;background:var(--panel);color:var(--dim);
  border:1px solid var(--line);padding:.34rem .6rem;cursor:pointer}
button:hover{color:var(--ink);border-color:var(--dim)}
button.on{border-color:var(--ok);color:var(--ok)}
#t{font-family:var(--mono);font-size:.76rem;color:var(--ink);min-width:9.5rem}
#t span{color:var(--faint)}
audio{display:none}
</style>
</head>
<body>

<header>
  <span class="brand">club</span>
  <span class="meta" id="songmeta"></span>
  <span style="flex:1"></span>
  <label class="file">load map<input type="file" id="mapfile" accept=".json"></label>
  <label class="file">load audio<input type="file" id="audiofile" accept="audio/*"></label>
  <span class="meta" id="clocksrc">clock: <b>internal</b></span>
</header>

<main>
  <div id="stage"><svg id="scene" viewBox="0 0 800 460" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside>
    <h3>frame — what play/ must produce</h3>
    <div id="frame"></div>
    <div id="next"></div>
    <div id="recipe"></div>
  </aside>
</main>

<footer>
  <svg id="lanes" viewBox="0 0 1000 96" preserveAspectRatio="none"></svg>
  <div class="controls">
    <button id="play">▶ play</button>
    <span id="t"></span>
    <button data-jump="build1">build</button>
    <button data-jump="stop1">the stop</button>
    <button data-jump="drop1">drop</button>
    <button data-jump="spot">spotlight</button>
    <button data-jump="drop2">drop 2</button>
    <button id="slow">¼ speed</button>
    <button id="fogtoggle" class="on">haze</button>
  </div>
</footer>

const NS="http://www.w3.org/2000/svg";
const el=(p,n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,u)=>a+(b-a)*u;
function hash(i,s){let n=(i*2654435761)^(s*40503);n=((n^(n>>>15))*2246822519)&0xffffffff;return ((n^(n>>>13))&0xffff)/65535;}

/* ---------- map queries. the map is the history: lookups, never memory ---------- */
const M={
  beatLen(){const b=MAP.beats;return b.length>1?(b[b.length-1]-b[0])/(b.length-1):0.5;},
  chapterAt(t){let c=MAP.chapters[0];for(const x of MAP.chapters)if(t>=x.at)c=x;return c;},
  chapterSpan(t){const cs=MAP.chapters;for(let i=0;i<cs.length;i++){const a=cs[i].at,b=i+1<cs.length?cs[i+1].at:MAP.song.length;if(t>=a&&t<b)return[a,b,cs[i].name];}return[0,MAP.song.length,"intro"];},
  lastBeat(t){const b=MAP.beats;let lo=0,hi=b.length-1,r=b[0];while(lo<=hi){const m=(lo+hi)>>1;if(b[m]<=t){r=b[m];lo=m+1}else hi=m-1}return r;},
  beatIndex(t){const b=MAP.beats;let lo=0,hi=b.length-1,r=0;while(lo<=hi){const m=(lo+hi)>>1;if(b[m]<=t){r=m;lo=m+1}else hi=m-1}return r;},
  beatPhase(t){const bl=this.beatLen();return clamp((t-this.lastBeat(t))/bl,0,1);},
  isDown(t){const b=this.lastBeat(t);return MAP.downbeats.some(d=>Math.abs(d-b)<1e-6);},
  active(t){let best=null;
    for(const m of MAP.moments){
      const end = m.holds!=null ? m.at+m.holds : m.at+0.45;
      if(t>=m.at && t<end) best=m;
    } return best;},
  nextMoment(t){for(const m of MAP.moments)if(m.at>t)return m;return null;},
  find(kind,n=1){let c=0;for(const m of MAP.moments)if(m.kind===kind&&++c===n)return m;return null;}
};

           blue:[40,70,190],violet:[157,123,255],warm:[255,214,160],off:[0,0,0]};

function recipe(t){
  const [a,b,name]=M.chapterSpan(t), mom=M.active(t), ph=M.beatPhase(t), bi=M.beatIndex(t);
  const prog=clamp((t-a)/Math.max(0.001,b-a),0,1);
  const S={label:name,note:"",floods:[],heads:[],strips:[],fog:0};

  if(mom && mom.kind==="stop"){
    S.label="STOP"; S.note="everything to zero — it knows what is coming";
    for(let i=0;i<4;i++)S.floods.push({rgb:RGB.off,level:0});
    for(let i=0;i<2;i++)S.heads.push({rgb:RGB.off,level:0,pan:.5,tilt:.35,strobe:0});
    S.strips=[0,0]; S.fog=0; return S;
  }
  if(name==="drop"){
    const flash=ph<.42, alt=bi%2===0, c=alt?RGB.white:RGB.magenta;
    S.note="white on the downbeat, alternating, strobing";
    for(let i=0;i<4;i++)S.floods.push({rgb:c,level:(i%2===(alt?0:1))?(flash?1:.25):.08});
    for(let i=0;i<2;i++)S.heads.push({rgb:RGB.white,level:flash?1:.3,
      pan:.5+Math.sin(t*3.1+i*Math.PI)*.42,tilt:.28,strobe:8});
    S.strips=[flash?1:.2,flash?1:.2]; S.fog=.85; return S;
  }
  if(name==="build"){
    const rate=1.5+prog*2.6, pulse=Math.max(0,1-ph*rate);
    S.note="pulse every beat, faster as it rises";
    const c=RGB.amber;
    for(let i=0;i<4;i++)S.floods.push({rgb:c,level:pulse*(0.45+prog*0.55)});
    for(let i=0;i<2;i++)S.heads.push({rgb:c,level:pulse*.8,
      pan:.5+Math.sin(t*(0.8+prog*3))*(0.15+prog*0.3),tilt:.3+prog*.15,strobe:0});
    S.strips=[prog,prog];
    S.fog=prog>.55?.6:.25;   // primed early: fog has 9 s of lag
    return S;
  }
  if(mom && mom.kind==="spotlight"){
    S.label="spotlight"; S.note="one head warm and alone. contrast carries it";
    for(let i=0;i<4;i++)S.floods.push({rgb:RGB.off,level:0});
    S.heads.push({rgb:RGB.warm,level:.95,pan:.5,tilt:.42,strobe:0});
    S.heads.push({rgb:RGB.off,level:0,pan:.5,tilt:.35,strobe:0});
    S.strips=[0,0]; S.fog=.35; return S;
  }
  if(name==="verse"){
    const d=M.isDown(t)?Math.max(0,1-ph*2.2):0;
    S.note="gentle. a pulse on downbeats only";
    for(let i=0;i<4;i++)S.floods.push({rgb:RGB.cyan,level:.10+d*.5*(i%2?1:.6)});
    for(let i=0;i<2;i++)S.heads.push({rgb:RGB.cyan,level:.12,pan:.5+Math.sin(t*.4+i)*.18,tilt:.32,strobe:0});
    S.strips=[.18,.18]; S.fog=.2; return S;
  }
  if(name==="break"||(mom&&mom.kind==="quiet")){
    S.note="cool, low, drifting. nothing moves fast";
    for(let i=0;i<4;i++)S.floods.push({rgb:RGB.violet,level:.10+.05*Math.sin(t*.6+i)});
    for(let i=0;i<2;i++)S.heads.push({rgb:RGB.violet,level:.10,pan:.5+Math.sin(t*.25+i)*.12,tilt:.3,strobe:0});
    S.strips=[.12,.12]; S.fog=.25; return S;
  }
  // intro / outro / return
  const base=.08+.06*Math.sin(t*.5);
  S.note="dim and cool. the room pacing itself";
  for(let i=0;i<4;i++)S.floods.push({rgb:RGB.blue,level:base*(i%2?1:.7)});
  for(let i=0;i<2;i++)S.heads.push({rgb:RGB.blue,level:.07,pan:.5+Math.sin(t*.3+i)*.1,tilt:.3,strobe:0});
  S.strips=[.08,.08]; S.fog=.15; return S;
}

/* ---------- state -> the frame that play/ must produce ---------- */
function frameFrom(t,S){
  const fx=[], L=LAYOUT.fixtures;
  const floods=L.filter(f=>f.kind==="flood"), heads=L.filter(f=>f.kind==="head"),
        strips=L.filter(f=>f.kind==="strip"), fog=L.filter(f=>f.kind==="fog");
  floods.forEach((f,i)=>{const s=S.floods[i]||S.floods[0];
    fx.push({id:f.id,r:s.rgb[0],g:s.rgb[1],b:s.rgb[2],level:+s.level.toFixed(3)});});
  heads.forEach((f,i)=>{const s=S.heads[i]||S.heads[0];
    fx.push({id:f.id,r:s.rgb[0],g:s.rgb[1],b:s.rgb[2],level:+s.level.toFixed(3),
             pan:+s.pan.toFixed(3),tilt:+s.tilt.toFixed(3),strobe:s.strobe});});
  strips.forEach((f,i)=>fx.push({id:f.id,level:+(S.strips[i]||0).toFixed(3)}));
  fog.forEach(f=>fx.push({id:f.id,level:+S.fog.toFixed(3)}));
  return {t:+t.toFixed(3),fixtures:fx};
}

/* ---------- the scene ---------- */
const scene=document.getElementById("scene");
let G={};
function buildScene(){
  scene.textContent="";
  el(scene,"rect",{x:0,y:0,width:800,height:460,fill:"#040408"});
  G.haze=el(scene,"rect",{x:0,y:0,width:800,height:460,fill:"#7a8ab5",opacity:0});
  G.wash=el(scene,"rect",{x:0,y:330,width:800,height:130,fill:"#2050e0",opacity:0});
  const floods=LAYOUT.fixtures.filter(f=>f.kind==="flood");
  const heads=LAYOUT.fixtures.filter(f=>f.kind==="head");
  G.fbeam=[];G.fdot=[];G.hbeam=[];G.hdot=[];
  floods.forEach((f,i)=>{const x=90+i*205;
    G.fbeam.push(el(scene,"polygon",{points:`${x},34 ${x-60},400 ${x+60},400`,fill:"#4d7cff",opacity:0}));
    G.fdot.push(el(scene,"circle",{cx:x,cy:26,r:9,fill:"#171722"}));
    const lb=el(scene,"text",{x:x,y:14,"text-anchor":"middle",fill:"#40465c","font-size":9});
    lb.style.fontFamily="Ubuntu Mono, monospace"; lb.textContent=f.id;});
  heads.forEach((f,i)=>{const x=280+i*240;
    G.hbeam.push(el(scene,"polygon",{points:`${x},58 ${x-26},400 ${x+26},400`,fill:"#fff",opacity:0}));
    G.hdot.push(el(scene,"circle",{cx:x,cy:50,r:11,fill:"#171722"}));
    const lb=el(scene,"text",{x:x,y:74,"text-anchor":"middle",fill:"#40465c","font-size":9});
    lb.style.fontFamily="Ubuntu Mono, monospace"; lb.textContent=f.id;});
  G.hx=[280,520];
  G.strip=[[],[]];
  for(let s=0;s<2;s++)for(let i=0;i<30;i++)
    G.strip[s].push(el(scene,"rect",{x:22+i*25.5,y:s===0?438:418,width:20,height:7,fill:"#13131c"}));
  G.big=el(scene,"text",{x:400,y:250,"text-anchor":"middle",fill:"#ff5ca8","font-size":26,
    "letter-spacing":8,opacity:0}); G.big.style.fontFamily="Ubuntu Mono, monospace";
}
function paint(S){
  const hz = hazeOn ? S.fog : 0;
  G.haze.setAttribute("opacity",(0.03+hz*0.07).toFixed(3));
  const f0=S.floods[0]||{rgb:[0,0,0],level:0};
  G.wash.setAttribute("fill",`rgb(${f0.rgb.join(",")})`);
  G.wash.setAttribute("opacity",(f0.level*0.22).toFixed(3));
  S.floods.forEach((s,i)=>{ if(!G.fdot[i])return;
    const c=`rgb(${s.rgb.join(",")})`, lv=Math.pow(clamp(s.level,0,1),1/2.2);
    G.fdot[i].setAttribute("fill", lv>0.02?c:"#171722");
    G.fdot[i].setAttribute("r", (9+lv*3).toFixed(1));
    G.fbeam[i].setAttribute("fill",c);
    G.fbeam[i].setAttribute("opacity",(lv*(0.10+hz*0.30)).toFixed(3));});
  S.heads.forEach((s,i)=>{ if(!G.hdot[i])return;
    const c=`rgb(${s.rgb.join(",")})`, lv=Math.pow(clamp(s.level,0,1),1/2.2);
    G.hdot[i].setAttribute("fill", lv>0.02?c:"#171722");
    G.hbeam[i].setAttribute("fill",c);
    G.hbeam[i].setAttribute("opacity",(lv*(0.14+hz*0.42)).toFixed(3));
    const x=G.hx[i], sx=(s.pan-0.5)*260, w=14+s.tilt*26;
    G.hbeam[i].setAttribute("points",`${x},58 ${x+sx-w},400 ${x+sx+w},400`);});
  for(let s=0;s<2;s++){const lv=S.strips[s]||0;
    G.strip[s].forEach((r,i)=>{const on=(i/30)<lv || (lv>0.5 && (i+Math.floor(now*8))%3===0);
      r.setAttribute("fill", on?`rgb(${(S.floods[0]||{rgb:[0,0,0]}).rgb.join(",")})`:"#13131c");});}
  if(S.label==="STOP"){G.big.setAttribute("opacity",1);G.big.textContent="· · ·";}
  else G.big.setAttribute("opacity",0);
}

/* ---------- the timeline ---------- */
const lanes=document.getElementById("lanes");
let PH;
function buildLanes(){
  lanes.textContent="";
  const W=1000,X=t=>(t/MAP.song.length)*W;
  const CH={intro:"#5b6480",verse:"#41c9ea",build:"#ff9d4d",drop:"#ff5ca8",break:"#9d7bff",outro:"#5b6480"};
  MAP.chapters.forEach((c,i)=>{const a=X(c.at),b=i+1<MAP.chapters.length?X(MAP.chapters[i+1].at):W;
    el(lanes,"rect",{x:a,y:0,width:Math.max(1,b-a-1),height:22,fill:CH[c.name]||"#5b6480",opacity:.85});
    if(b-a>44){const tx=el(lanes,"text",{x:a+4,y:15,fill:"#07070c","font-size":9,"letter-spacing":1});
      tx.style.fontFamily="Ubuntu Mono, monospace"; tx.textContent=c.name.toUpperCase();}});
  MAP.beats.forEach((b,i)=>{const d=MAP.downbeats.some(x=>Math.abs(x-b)<1e-6);
    el(lanes,"rect",{x:X(b),y:d?28:33,width:d?1.4:.7,height:d?16:9,fill:"#ff9d4d",opacity:d?.9:.3});});
  MAP.moments.forEach(m=>{const x=X(m.at);
    const col=m.kind==="drop"?"#ffffff":m.kind==="stop"?"#ff5ca8":m.kind==="spotlight"?"#41c9ea":"#ff9d4d";
    el(lanes,"path",{d:`M${x},52 l5,6 l-5,6 l-5,-6 Z`,fill:col});
    const tx=el(lanes,"text",{x:x,y:78,fill:"#5f657a","font-size":8.5,"text-anchor":"middle"});
    tx.style.fontFamily="Ubuntu Mono, monospace"; tx.textContent=m.kind;});
  PH=el(lanes,"line",{x1:0,y1:0,x2:0,y2:70,stroke:"#fff","stroke-width":1.6,opacity:.9});
}

/* ---------- one clock: the audio element if loaded, else internal ---------- */
const au=document.getElementById("au"), playBtn=document.getElementById("play");
const tEl=document.getElementById("t"), clocksrc=document.getElementById("clocksrc");
let now=0, playing=false, speed=1, last=null, haveAudio=false, hazeOn=true;

function clockNow(dtms){
  if(haveAudio) return au.currentTime;             // the audio device owns time
  if(playing){ if(last!=null) now += (dtms-last)/1000*speed; last=dtms; }
  else last=null;
  return now;
}
function loop(ts){
  const t=clamp(clockNow(ts),0,MAP.song.length);
  now=t;
  const S=recipe(t);
  paint(S);
  const X=(t/MAP.song.length)*1000; PH.setAttribute("x1",X); PH.setAttribute("x2",X);
  renderFrame(t,S);
  const mm=String(Math.floor(t/60)).padStart(2,"0"), ss=(t%60).toFixed(2).padStart(5,"0");
  tEl.innerHTML=`${mm}:${ss} <span>/ ${MAP.song.length.toFixed(0)}s · ${S.label}</span>`;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const frameEl=document.getElementById("frame"), nextEl=document.getElementById("next"),
      recipeEl=document.getElementById("recipe");
function renderFrame(t,S){
  const F=frameFrom(t,S);
  let s=`{\n  <span class="k">"t"</span>: <span class="v">${F.t}</span>,\n  <span class="k">"fixtures"</span>: [\n`;
  F.fixtures.forEach(f=>{
    const dim=f.level<0.02?' class="z"':'';
    let parts=`<span class="k">"id"</span>:<span class="v">"${f.id}"</span>`;
    if(f.r!=null) parts+=` <span class="k">"rgb"</span>:<span class="v">[${f.r},${f.g},${f.b}]</span>`;
    parts+=` <span class="k">"level"</span>:<span class="v">${f.level}</span>`;
    if(f.pan!=null) parts+=` <span class="k">"pan"</span>:<span class="v">${f.pan}</span>`;
    if(f.strobe) parts+=` <span class="k">"strobe"</span>:<span class="v">${f.strobe}</span>`;
    s+=`    <span${dim}>{ ${parts} }</span>\n`;});
  s+="  ]\n}";
  frameEl.innerHTML=s;
  const nm=M.nextMoment(t);
  nextEl.textContent = nm ? `next: ${nm.kind} in ${(nm.at-t).toFixed(2)}s` : "next: —";
  recipeEl.innerHTML = S.note ? `<b>${S.label}</b> — ${S.note}` : `<b>${S.label}</b>`;
}

/* ---------- controls ---------- */
playBtn.addEventListener("click",()=>{
  playing=!playing; playBtn.textContent=playing?"❙❙ pause":"▶ play";
  playBtn.classList.toggle("on",playing);
  if(haveAudio){ playing?au.play():au.pause(); }
});
document.getElementById("slow").addEventListener("click",e=>{
  speed = speed===1?0.25:1; e.target.classList.toggle("on",speed!==1);
  if(haveAudio) au.playbackRate=speed;
});
document.getElementById("fogtoggle").addEventListener("click",e=>{
  hazeOn=!hazeOn; e.target.classList.toggle("on",hazeOn);
});
const JUMPS={build1:()=>M.find("build",1),stop1:()=>M.find("stop",1),drop1:()=>M.find("drop",1),
             spot:()=>M.find("spotlight",1),drop2:()=>M.find("drop",2)};
document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
  const m=JUMPS[b.dataset.jump](); if(!m) return;
  const t=Math.max(0,m.at-2.0);
  now=t; if(haveAudio) au.currentTime=t;
  speed=0.25; document.getElementById("slow").classList.add("on");
  if(haveAudio) au.playbackRate=0.25;
  if(!playing){ playing=true; playBtn.textContent="❙❙ pause"; playBtn.classList.add("on"); if(haveAudio)au.play(); }
}));
lanes.addEventListener("click",e=>{
  const r=lanes.getBoundingClientRect();
  const t=clamp(((e.clientX-r.left)/r.width)*MAP.song.length,0,MAP.song.length);
  now=t; if(haveAudio) au.currentTime=t;
});
document.getElementById("mapfile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const m=JSON.parse(rd.result);
      if(!m.beats||!m.chapters) throw new Error("not a map: needs beats and chapters");
      MAP=m; now=0; buildLanes(); meta(); }
    catch(err){ alert("could not read that map: "+err.message); } };
  rd.readAsText(f);
});
document.getElementById("audiofile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  au.src=URL.createObjectURL(f); haveAudio=true;
  clocksrc.innerHTML='clock: <b>audio device</b>';
  au.playbackRate=speed;
  if(playing) au.play();
});
function meta(){
  document.getElementById("songmeta").innerHTML =
    `<b>${MAP.song.title}</b> · ${MAP.beats.length} beats · ${MAP.chapters.length} chapters · ${MAP.moments.length} moments`;
}
buildScene(); buildLanes(); meta();
</script>
