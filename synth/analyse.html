<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map editor</title><style>
:root{--bg:#0e1016;--surface:#171a23;--raise:#1e222d;--ink:#e6e9f1;--muted:#959bac;
 --faint:#666c7e;--rule:#252935;--rule2:#373c4d;--tung:#f0a93c;--learn:#8f9aff;
 --good:#69be86;--bad:#e88055}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);padding:0;overflow:hidden;
 font:14px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;padding:10px 14px 64px}
/* The transport is pinned. It used to be the last child of a 100vh flex column
   whose children added up to more than 100vh, so on a shorter window it was
   pushed below the fold -- and the body being overflow:hidden meant there was no
   way to scroll down to it. Measured at a 713 px viewport: the player sat at
   707-741 and elementFromPoint on the play button returned nothing at all. */
#foot{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:80;
      display:flex;align-items:center;gap:14px;padding:0 14px;
      background:var(--surface);border-top:1px solid var(--rule)}
#foot audio{height:34px;flex:0 0 400px}
#foot .help{flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
            margin:0;font-size:11px}
/* and the lanes give way instead of overflowing the window */
#tw{flex:1 1 auto;min-height:150px}
#live{flex:1 1 auto;min-height:130px}
a.back{color:var(--faint);text-decoration:none;font-family:ui-monospace,monospace;font-size:12px}
.mono,select,button{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 11px;margin:0 0 8px;
 background:var(--surface);border:1px solid var(--rule);border-radius:4px;flex:0 0 auto}
label{color:var(--faint);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
select,button{background:var(--raise);color:var(--ink);border:1px solid var(--rule2);
 border-radius:3px;padding:6px 11px;font-size:12.5px;cursor:pointer}
button.go{background:var(--tung);color:#20160a;border-color:var(--tung);font-weight:700}
button.on{border-color:var(--tung);color:var(--tung)}
.track{background:var(--surface);border:1px solid var(--rule);border-radius:4px;margin:0 0 7px;
 overflow:hidden;flex:1 1 0;display:flex;flex-direction:column;min-height:0}
.track canvas{flex:1 1 0;min-height:0}
/* the fixture panel is a fixed instrument, not a timeline -- the flex rule above
   is for the tracks and was shrinking it to a strip */
#room{flex:0 0 auto!important;height:250px!important}
.track.edit{border-color:var(--tung)}
.thead{display:flex;justify-content:space-between;align-items:baseline;padding:7px 12px;
 border-bottom:1px solid var(--rule);font-family:ui-monospace,monospace;font-size:11.5px}
.thead b{color:var(--tung);letter-spacing:.06em;text-transform:uppercase}
.thead span{color:var(--faint)}
canvas{display:block;width:100%;cursor:crosshair}
.help{color:var(--faint);font-size:12px;font-family:ui-monospace,monospace;margin:8px 0 0}
audio{width:100%;height:34px;flex:0 0 auto;filter:invert(.92) hue-rotate(180deg)}
.help{flex:0 0 auto}
#sel{position:fixed;right:18px;bottom:18px;background:var(--surface);border:1px solid var(--tung);
 border-radius:4px;padding:12px 14px;display:none;min-width:230px}
#sel h3{margin:0 0 8px;font:700 12px ui-monospace,monospace;color:var(--tung)}
#sel input,#sel select{width:100%;margin:0 0 8px;background:var(--raise);color:var(--ink);
 border:1px solid var(--rule2);border-radius:3px;padding:6px 8px;font-size:13px;
 font-family:ui-monospace,monospace}
#sel .row{display:flex;gap:7px}
</style></head><body><div class="wrap">

<div class="bar">
  <a class="back" href="/">←</a>
  <label for="song">song</label><select id="song"></select>
  <label for="mine">editing</label><select id="mine"></select>
  <label for="other">against</label><select id="other"></select>
  <label for="drive">energy</label>
  <select id="drive"><option>low</option><option selected>medium</option><option>high</option></select>
  <label for="palette">colour</label>
  <select id="palette"><option>white</option><option>garrix</option><option>garrix-red</option><option>sunset</option><option>ice</option><option>neon</option><option>amber</option></select>
  <label for="rig">rig</label>
  <select id="rig"></select>
  <button id="beatonly">beats only</button>
  <button id="tool-sec" class="on">sections</button>
  <button id="tool-mom">moments</button>
  <button class="go" id="save">Save</button>
  <label>zoom</label>
  <button id="zout">−</button><button id="zin">+</button><button id="zall">all</button>
  <button id="follow" class="on">follow</button>
  <label for="sync" title="the picture runs ahead of the sound by however long your audio takes to reach the speakers">sync</label>
  <input id="sync" type="range" min="-250" max="100" step="5" value="0"
    style="width:110px;accent-color:var(--tung)">
  <span id="syncv" class="mono" style="color:var(--faint);font-size:11.5px">0 ms</span>
  <span id="stat" class="mono" style="color:var(--muted);font-size:12px"></span>
</div>

<div class="track" id="tw" style="flex:0 0 auto">
  <div class="thead"><b>audio · beats · downbeats</b>
    <span><button id="nudgeL" style="background:var(--raise);color:var(--ink);border:1px solid var(--rule2);
      border-radius:3px;padding:2px 9px;font-size:11px;cursor:pointer;font-family:ui-monospace,monospace">◀ 5ms</button>
    <button id="nudgeR" style="background:var(--raise);color:var(--ink);border:1px solid var(--rule2);
      border-radius:3px;padding:2px 9px;font-size:11px;cursor:pointer;font-family:ui-monospace,monospace">5ms ▶</button>
    <button id="fitgrid" style="background:var(--raise);color:var(--tung);border:1px solid var(--tung);
      border-radius:3px;padding:2px 10px;font-size:11px;cursor:pointer;font-family:ui-monospace,monospace">snap to kicks</button>
    <span id="gridinfo" style="margin-left:9px">—</span></span></div>
  <canvas id="wave" style="height:120px;flex:0 0 auto"></canvas>
  <div class="thead" style="border-top:1px solid var(--rule)"><b>light out · is it on the beat?</b>
    <span id="syncverdict">—</span></div>
  <canvas id="lightlane" style="height:96px;flex:0 0 auto"></canvas></div>
<div class="track edit" id="t1"><div class="thead"><b id="n1">—</b><span id="d1"></span></div>
  <canvas id="c1"></canvas></div>
<div class="track" id="t2"><div class="thead"><b id="n2">—</b><span id="d2"></span></div>
  <canvas id="c2"></canvas></div>

<div id="live" style="display:flex;gap:8px;flex:0 0 auto;margin:0 0 7px">
  <div class="track" style="flex:1 1 0;margin:0">
    <div class="thead"><b>the fixtures, from the map above</b>
      <span><button id="viewtog" style="background:var(--raise);color:var(--muted);
        border:1px solid var(--rule2);border-radius:3px;padding:2px 8px;font-size:10.5px;
        cursor:pointer;font-family:ui-monospace,monospace">room view</button>
      <button id="bigtog" style="background:var(--raise);color:var(--muted);
        border:1px solid var(--rule2);border-radius:3px;padding:2px 8px;font-size:10.5px;
        margin-left:5px;cursor:pointer;font-family:ui-monospace,monospace">full screen</button>
      <span id="rmeta" style="margin-left:8px">—</span></span></div>
    <canvas id="room"></canvas></div>
  <div class="track" style="flex:0 0 250px;margin:0">
    <div class="thead"><b>vs <span id="vsname">—</span></b><span id="vstale"></span></div>
    <div style="padding:11px 13px;font-family:ui-monospace,monospace;font-size:12px;line-height:1.9">
      <div>flash match <b id="lflash" style="font-size:19px;color:var(--tung)">—</b></div>
      <div>seconds wrong <b id="lbad" style="font-size:15px">—</b></div>
      <div style="color:var(--faint);font-size:11px;margin-top:6px" id="lnote"></div>
    </div></div>
</div>
<div id="foot"><audio id="aud" controls preload="auto"></audio>
  <span class="help" id="help"></span></div>
</div>

<div id="sel"><h3 id="selt">—</h3>
  <select id="selkind"></select>
  <input id="selname" placeholder="name">
  <div class="row"><button id="seldel">delete</button><button id="selclose">close</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
const H={sections:34,moments:26,energy:52,stems:34,ruler:18};
const TOTAL=H.sections+H.moments+H.energy+H.stems+H.ruler;
const COL={intro:"#4a5570",verse:"#4f7a8c",chorus:"#f0a93c",drop:"#f0a93c",build:"#c98a3a",
 break:"#3d4459",inst:"#5b6b8a",quiet:"#3d4459",outro:"#4a5570",start:"#2b3040",end:"#2b3040",
 unknown:"#3a3f52"};
const KINDS=["build","drop","stop","quiet","spotlight","return"];
let G=null, SONG="", MINE=null, OTHER=null, mineKey="", otherKey="", tool="sections", sel=null;
// the visible window. A whole song across 1500 px puts a bar at twelve pixels,
// which is not enough to see whether a boundary is where you heard it.
let VIEW={t0:0, span:0}, FOLLOW=true, drag=null;
// the room is rebuilt from MINE on every edit, so a boundary moved on the
// timeline changes the lights immediately -- that is the loop worth having
let RECIPE="", RECIPE_BEAT="", ROOMJS="", LAYOUTS={}, BEATONLY=false, RM=null, LAY=null, F1=null, F2=null, rebuildTimer=null, scoreTimer=null;
// fixtures by default: this panel is for checking the output is what you meant,
// not for imagining what the room looks like
let VIEWMODE = localStorage.getItem("limelight.view") || "";
const mkRM=r=>new Function("RECIPE",
  ROOMJS+"\n;return {mkReader,prep,drawRoom,drawFixtures,frameDiff,pearson,totalLight};")(r);
/* "beats only" throws the show away and leaves the one question underneath it:
   on a beat, all five pars go to full. No chase, no colour, no build, no heads.
   Six things were moving at once, and only one of them was the beat, so a late
   look could not be traced to what was late. Here a beat that looks wrong is the
   grid, not the recipe. */
let RIG = new URLSearchParams(location.search).get("rig")
       || localStorage.getItem("limelight.rig") || "";
const pickLayout=()=> BEATONLY
  ? (LAYOUTS.beat || LAYOUTS.small || Object.values(LAYOUTS)[0])
  : (LAYOUTS[RIG] || LAYOUTS.small || LAYOUTS.club || Object.values(LAYOUTS)[0]);
function fillRigs(){
  const e=$("rig"); if(!e) return;
  const names=Object.keys(LAYOUTS).sort((a,b)=>
    (LAYOUTS[b].fixtures||[]).length-(LAYOUTS[a].fixtures||[]).length);
  if(!LAYOUTS[RIG]) RIG = names.includes("festival") ? "festival" : (names[0]||"");
  e.innerHTML = names.map(n=>`<option value="${n}"${n===RIG?" selected":""}>`
    +`${n} · ${(LAYOUTS[n].fixtures||[]).length}</option>`).join("");
  e.onchange = ev => { RIG = ev.target.value;
    localStorage.setItem("limelight.rig", RIG);
    LAY = pickLayout();
    if((LAY&&LAY.fixtures||[]).length > 40 && VIEWMODE!=="room"){
      VIEWMODE="room"; localStorage.setItem("limelight.view","room");
      const b=$("viewtog"); if(b) b.textContent="fixture view"; }
    rebuildShow(); };
}
function setBeatOnly(on){
  BEATONLY=on; RM=mkRM(on?RECIPE_BEAT:RECIPE); LAY=pickLayout();
  const b=$("beatonly"); if(b){ b.classList.toggle("on",on);
    b.textContent = on ? "beats only ✓" : "beats only" }
  ["drive","palette"].forEach(id=>{ const e=$(id); if(e) e.disabled=on });
  if(VIEWMODE==="room"){ VIEWMODE="fixtures"; $("viewtog").textContent="room view" }
  rebuildShow();
}
let BIG=false;
let PALETTE = new URLSearchParams(location.search).get("pal")
           || localStorage.getItem("limelight.palette") || "garrix";
let WAVE=null;
/* The light the rig is actually emitting, sampled once per map and cached, so it
   can be drawn on the SAME axis as the waveform and the beats. Asking "are the
   lights on the beat" is then a thing you look at rather than a thing you try to
   hear -- which is what Renjith has been unable to do, correctly, because nothing
   on this page ever showed the two together. */
let LIGHT=null, LIGHT_HZ=50;
let lightJob=0;
function buildLight(){
  const job = ++lightJob;
  if(!F1||!MINE){ LIGHT=null; return }
  const D=dur(MINE), n=Math.floor(D*LIGHT_HZ), out=new Float32Array(n);
  const reader=F1;
  let i=0;
  const slice=()=>{
    if(job!==lightJob) return;
    const t0=performance.now();
    while(i<n && performance.now()-t0 < 12){
      let s=0; const fr=reader(i/LIGHT_HZ);
      for(const o of fr.fixtures) if("level" in o && !/^fog/.test(o.id)) s+=o.level;
      out[i++]=s;
    }
    let mx=0; for(let k=0;k<i;k++) if(out[k]>mx) mx=out[k];
    LIGHT={v:out, hz:LIGHT_HZ, max:mx||1, done:i>=n, upto:i};
    if(i<n){ setTimeout(slice,0) } else { measureSync() }
  };
  setTimeout(slice,0);
}
/* The number, so it is not a matter of opinion: find each rise in emitted light
   and measure how far it sits from the nearest beat. */
function measureSync(){
  if(!LIGHT||!MINE||!MINE.beats||!MINE.beats.length){ $("syncverdict").textContent="—"; return }
  /* Measuring against quarter notes was the wrong question. A flash on a
     syncopated sixteenth is dead in time and would score as 100 ms wrong, so the
     number punished exactly the playing that makes the show feel human. The grid
     the music is on is the sixteenth, so that is what a flash is measured to. */
  const v=LIGHT.v, hz=LIGHT.hz, PER=MINE.grid.period, PH=MINE.grid.phase, SUB=PER/4;
  const B=MINE.beats, offs=[], beatoffs=[];
  for(let i=2;i<v.length-2;i++){
    const rise=v[i]-v[i-1];
    if(rise < LIGHT.max*0.06) continue;
    if(v[i]-v[i-2] < v[i+1]-v[i-1]) continue;     // keep the steepest point of a rise
    /* a rise found at sample i happened somewhere inside the 20 ms before it, so
       the midpoint of that interval is the estimate -- without this every number
       on this line carries a fixed half-sample of fake lateness */
    const t=i/hz - 0.5/hz;
    offs.push(Math.abs(t-(PH+Math.round((t-PH)/SUB)*SUB))*1000);
    let lo=0,hi=B.length-1,best=0;
    while(lo<=hi){const mi=(lo+hi)>>1; if(B[mi]<=t){best=mi;lo=mi+1}else hi=mi-1}
    beatoffs.push(Math.min(Math.abs(B[best]-t),
                           Math.abs(B[Math.min(B.length-1,best+1)]-t))*1000);
  }
  if(!offs.length){ $("syncverdict").textContent="no flashes found"; return }
  const n=offs.length;
  const onGrid=offs.filter(o=>o<=40).length/n*100;
  const onBeat=beatoffs.filter(o=>o<=40).length/n*100;
  offs.sort((a,b)=>a-b);
  const el=$("syncverdict");
  el.textContent=`${n} flashes · ${onGrid.toFixed(0)}% in time (within 40 ms of a 16th)`
               + ` · median ${offs[n>>1].toFixed(0)} ms · ${onBeat.toFixed(0)}% land on a beat`;
  el.style.color = onGrid>85 ? "var(--good)" : onGrid>60 ? "var(--tung)" : "var(--bad)";
}
function drawLight(){
  const cv=$("lightlane"); if(!cv||!MINE) return;
  const W=cv.clientWidth,H=cv.clientHeight||96,dpr=window.devicePixelRatio||1;
  if(cv.width!==W*dpr||cv.height!==H*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#0a0c11"; g.fillRect(0,0,W,H);
  const D=dur(MINE), x=t=>(t-VIEW.t0)/VIEW.span*W;
  // beats first, so the light is drawn over them
  if(VIEW.span<90){
    g.strokeStyle="rgba(230,233,241,.22)"; g.lineWidth=1;
    for(const t of (MINE.beats||[])){ if(t<VIEW.t0||t>VIEW.t0+VIEW.span) continue;
      g.beginPath(); g.moveTo(x(t),0); g.lineTo(x(t),H); g.stroke() }
    g.strokeStyle="rgba(143,154,255,.75)"; g.lineWidth=1.5;
    for(const t of (MINE.downbeats||[])){ if(t<VIEW.t0||t>VIEW.t0+VIEW.span) continue;
      g.beginPath(); g.moveTo(x(t),0); g.lineTo(x(t),H); g.stroke() }
  }
  if(LIGHT){
    const hz=LIGHT.hz;
    g.beginPath(); g.moveTo(0,H);
    const i0=Math.max(0,Math.floor(VIEW.t0*hz)), i1=Math.min(LIGHT.v.length,Math.ceil((VIEW.t0+VIEW.span)*hz));
    const stride=Math.max(1,Math.floor((i1-i0)/Math.max(1,W)));
    for(let i=i0;i<i1;i+=stride){ let p=0;
      for(let j=i;j<Math.min(i1,i+stride);j++) if(LIGHT.v[j]>p) p=LIGHT.v[j];
      g.lineTo(x(i/hz), H-2-(p/LIGHT.max)*(H-8)) }
    g.lineTo(W,H); g.closePath();
    g.fillStyle="rgba(240,169,60,.22)"; g.fill();
    g.strokeStyle="#f0a93c"; g.lineWidth=1.4; g.stroke();
  }
  const a=$("aud"), pt=(a.src?a.currentTime:0)+SYNC/1000;
  g.strokeStyle="#fff"; g.lineWidth=1.2;
  g.beginPath(); g.moveTo(x(pt),0); g.lineTo(x(pt),H); g.stroke();
  if(VIEW.span>=90){ g.fillStyle="#666c7e"; g.font="10px ui-monospace,monospace";
    g.fillText("zoom in past 90 s to line the flashes up against the beats",8,14) }
}
let DRIVE = localStorage.getItem("limelight.drive") || "medium";
const clampView=D=>{ VIEW.span=Math.max(4,Math.min(D,VIEW.span||D));
  VIEW.t0=Math.max(0,Math.min(D-VIEW.span,VIEW.t0)) };

const secs=m=>((m.sections&&m.sections.entries)||[]).slice();
const dur=m=>m.song.length;
function snap(m,t){
  const pool=(m.downbeats&&m.downbeats.length)?m.downbeats:(m.beats||[]);
  if(!pool.length) return +t.toFixed(3);
  return pool.reduce((a,b)=>Math.abs(b-t)<Math.abs(a-t)?b:a);
}
function draw(cv,m,editable){
  const W=cv.clientWidth, Hpx=cv.clientHeight, dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=Hpx*dpr;
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle="#12141b"; g.fillRect(0,0,W,Hpx);
  if(!m) return;
  const D=dur(m); clampView(D);
  // rows share the height that is actually on screen instead of a fixed 164 px
  const spare=Math.max(0,Hpx-TOTAL);
  const H={sections:34+spare*0.16, moments:26+spare*0.10, energy:52+spare*0.46,
           stems:34+spare*0.28, ruler:18};
  const x=t=>(t-VIEW.t0)/VIEW.span*W;
  let y=0;
  // sections
  const S=secs(m);
  if(S.length){
    S.forEach((s,i)=>{
      const a=x(s.at), b=x(s.to!==undefined?s.to:(S[i+1]?S[i+1].at:D));
      g.fillStyle=COL[s.name]||"#46506b"; g.globalAlpha=.85;
      g.fillRect(a,y+3,Math.max(1,b-a-1),H.sections-9); g.globalAlpha=1;
      if(b-a>36){ g.fillStyle="#0e1016"; g.font="600 11px ui-sans-serif,system-ui";
        g.fillText(s.name+(s.repeat>1?" "+s.repeat:""),Math.max(a,0)+5,y+H.sections/2+3) }
      g.strokeStyle="#0e1016"; g.lineWidth=1;
      g.beginPath(); g.moveTo(a,y+2); g.lineTo(a,y+H.sections-4); g.stroke();
    });
  } else {
    g.fillStyle="#2a2f3e"; g.fillRect(0,y+3,W,H.sections-9);
    g.fillStyle="#666c7e"; g.font="11px ui-monospace,monospace";
    g.fillText(editable?"no sections — click here to add one":"no sections",8,y+H.sections/2+3);
  }
  y+=H.sections;
  // moments
  g.fillStyle="#1a1e28"; g.fillRect(0,y,W,H.moments);
  for(const mo of (m.moments||[])){
    const a=x(mo.at);
    g.strokeStyle=mo.kind==="drop"?"#f0a93c":mo.kind==="quiet"?"#5b6b8a":"#8f9aff";
    g.lineWidth=2; g.beginPath(); g.moveTo(a,y+3); g.lineTo(a,y+H.moments-9); g.stroke();
    g.fillStyle=g.strokeStyle; g.font="9px ui-monospace,monospace";
    g.fillText(mo.kind,a+3,y+H.moments-2);
  }
  y+=H.moments;
  // energy
  const E=m.energy||[];
  if(E.length){
    g.beginPath(); g.moveTo(0,y+H.energy);
    E.forEach(p=>g.lineTo(x(p[0]),y+H.energy-p[1]*(H.energy-6)));
    g.lineTo(W,y+H.energy); g.closePath();
    g.fillStyle="rgba(240,169,60,.18)"; g.fill();
    g.strokeStyle="#f0a93c"; g.lineWidth=1.2; g.stroke();
  }
  y+=H.energy;
  // stems
  const st=(m.stems&&m.stems.sources)||{}, at=(m.stems&&m.stems.at)||[];
  const rows=["drums","bass","other","vocals"].filter(k=>st[k]&&st[k].length);
  rows.forEach((k,i)=>{
    const h=H.stems/Math.max(1,rows.length), yy=y+i*h;
    st[k].forEach((v,j)=>{
      const t=at[j]!==undefined?at[j]:(j/st[k].length*D);
      const w=Math.max(1,W/st[k].length);
      g.fillStyle=`rgba(143,154,255,${(0.10+0.75*v).toFixed(3)})`;
      g.fillRect(x(t),yy+1,w,h-2);
    });
    g.fillStyle="#666c7e"; g.font="8.5px ui-monospace,monospace"; g.fillText(k,3,yy+h-2);
  });
  y+=H.stems;
  // ruler, and bar lines once they are far enough apart to mean anything
  const bar=(m.grid?m.grid.period*4:2);
  if(VIEW.span/bar < W/6){
    g.strokeStyle="rgba(230,233,241,.055)"; g.lineWidth=1;
    const first=Math.floor((VIEW.t0-(m.grid?m.grid.phase:0))/bar)*bar+(m.grid?m.grid.phase:0);
    for(let t=first;t<VIEW.t0+VIEW.span;t+=bar){
