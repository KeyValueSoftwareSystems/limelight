[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

# ── Hub: score storage + protocol (port 8770, internal only) ─────────────────
[program:hub]
command=python3 /app/serve.py
directory=/app
environment=HOST="127.0.0.1",PORT="8770"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10
startsecs=2

# ── Portal: main API (port 8800, internal only) ─────────────────────────────
[program:portal]
command=python3 /app/portal/server.py --host 127.0.0.1 --port 8800 --hub http://127.0.0.1:8770 --no-net
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
startsecs=3

# ── Next.js UI (port 3000, internal only) ────────────────────────────────────
# standalone output: a single server.js with minimal deps
[program:nextjs]
command=node server.js
directory=/app/limelight-ui
environment=PORT="3000",HOSTNAME="127.0.0.1",NEXT_PUBLIC_API_URL=""
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
startsecs=5

# ── Nginx reverse proxy (port 80, the only public port) ─────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=40
startsecs=2
