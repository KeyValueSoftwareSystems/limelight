# Nginx reverse proxy — one public port (80) fans out to internal services.
# / → Next.js (3000), /api + /audio + /covers + /logos → Portal (8800)

upstream nextjs {
    server 127.0.0.1:3000;
}

upstream portal {
    server 127.0.0.1:8800;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 120M;

    # ── Portal backend routes ────────────────────────────────────────────
    # The UI's fetch() calls hit /api/* on the same origin; Nginx proxies
    # them to the Portal Python server on 8800.

    location /api/ {
        proxy_pass         http://portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /audio/ {
        proxy_pass         http://portal;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Range             $http_range;
        proxy_set_header   If-Range          $http_if_range;
    }

    location /covers/ {
        proxy_pass         http://portal;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /logos/ {
        proxy_pass         http://portal;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Next.js UI (everything else) ─────────────────────────────────────
    location / {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
