<title>Limelight</title>
<style>
  /* One accent. One type scale. Two greys. Nothing else. */
  :root{
    --bg:#08090c; --ink:#f2f3f5; --dim:#8b929c; --faint:#4a5058;
    --line:rgba(255,255,255,.07); --glass:rgba(16,18,23,.72); --acc:#ff7a2f;
    --s0:11px; --s1:12.5px; --s2:14px; --s3:17px; --s4:24px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:var(--s2)/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}

  /* ---- the stage: content is the interface, chrome defers to it ---- */
  #stage{position:fixed;inset:0;background:#000}
  #room,#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
  #score{position:absolute;inset:0;overflow:auto;background:var(--bg)}
  .hide{display:none!important}

  /* ---- chrome: one cluster top-left, one transport bottom, nothing else ---- */
  .chrome{position:fixed;z-index:10;color:var(--dim)}
  #modes{top:16px;left:50%;transform:translateX(-50%);display:flex;gap:2px;
    background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:3px;
    backdrop-filter:blur(18px) saturate(150%)}
  #modes button{padding:6px 16px;border-radius:8px;font-size:var(--s1);letter-spacing:.01em;
    color:var(--dim);transition:color .18s,background .18s}
  #modes button[aria-selected=true]{background:rgba(255,255,255,.09);color:var(--ink);font-weight:560}
  #modes button:hover{color:var(--ink)}

  #meta{top:18px;left:20px;font-size:var(--s0);line-height:1.7;letter-spacing:.02em;
    color:var(--faint);pointer-events:none}
  #meta b{color:var(--dim);font-weight:500}

  #tools{top:16px;right:20px;display:flex;gap:2px;align-items:center;
    background:var(--glass);border:1px solid var(--line);border-radius:11px;padding:3px;
    backdrop-filter:blur(18px)}
  #tools button{width:30px;height:28px;border-radius:8px;font-size:var(--s1);color:var(--dim)}
  #tools button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
  #tools button.on{background:var(--acc);color:#170c04}

  #bar{bottom:0;left:0;right:0;padding:14px 20px 16px;
    background:linear-gradient(0deg,rgba(8,9,12,.92),rgba(8,9,12,0));display:flex;
    align-items:center;gap:16px}
  #play{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:var(--ink);
    color:#08090c;display:grid;place-items:center;font-size:13px;transition:transform .12s}
  #play:hover{transform:scale(1.06)}
  #seekwrap{flex:1;position:relative;height:38px;display:flex;align-items:center;cursor:pointer}
  #track{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.10);border-radius:2px}
  #fill{position:absolute;left:0;height:3px;background:var(--acc);border-radius:2px;width:0}
  #knob{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--ink);
    margin-left:-5.5px;box-shadow:0 1px 6px rgba(0,0,0,.6);opacity:0;transition:opacity .15s}
  #seekwrap:hover #knob{opacity:1}
  #marks{position:absolute;left:0;right:0;height:11px;pointer-events:none}
  #marks i{position:absolute;width:1px;height:11px;background:rgba(255,255,255,.22);
    margin-top:-4px;font-style:normal}
  #marks i.drop{background:var(--acc);height:15px;margin-top:-6px}
  #time{font:var(--s1)/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
    min-width:104px;text-align:right;letter-spacing:.02em}
  #where{font:var(--s0)/1 ui-monospace,Menlo,monospace;color:var(--faint);min-width:190px}

  /* ---- first run: one sentence, one action, then gone forever ---- */
  #hello{position:fixed;inset:0;z-index:40;display:grid;place-items:center;
    background:rgba(8,9,12,.94);backdrop-filter:blur(24px)}
  #hello .in{text-align:center;max-width:30rem;padding:0 24px}
  #hello h1{font-size:var(--s4);font-weight:600;letter-spacing:-.02em;margin:0 0 10px}
  #hello p{color:var(--dim);font-size:var(--s2);margin:0 0 26px;line-height:1.6}
  #hello label{display:inline-block;padding:11px 22px;border-radius:11px;background:var(--ink);
    color:#08090c;font-size:var(--s2);font-weight:560;cursor:pointer;transition:transform .12s}
  #hello label:hover{transform:scale(1.03)}
  #hello input{display:none}
  #hello small{display:block;margin-top:18px;color:var(--faint);font-size:var(--s0)}

  /* ---- the drawer: everything else, behind one button ---- */
  #drawer{position:fixed;top:0;right:0;bottom:0;width:320px;z-index:30;overflow-y:auto;
    background:var(--glass);border-left:1px solid var(--line);backdrop-filter:blur(24px);
    transform:translateX(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    padding:64px 20px 32px}
  #drawer.open{transform:none}
  #drawer h2{font-size:var(--s0);letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
    font-weight:600;margin:26px 0 10px}
  #drawer h2:first-of-type{margin-top:0}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:var(--s1);color:var(--dim)}
  .row span{flex:1}
  .seg{display:flex;gap:1px;background:rgba(255,255,255,.05);border-radius:8px;padding:2px}
  .seg button{padding:4px 9px;border-radius:6px;font-size:var(--s0);color:var(--dim)}
  .seg button.on{background:rgba(255,255,255,.11);color:var(--ink);font-weight:560}
  .mono{font:var(--s0)/1.7 ui-monospace,Menlo,monospace;color:var(--faint)}
  .mono b{color:var(--dim);font-weight:500}
  input[type=range]{flex:1;accent-color:var(--acc);height:2px}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font:var(--s0)/1.6 ui-monospace,Menlo,monospace;
    color:var(--faint)}
  .keys kbd{color:var(--dim);text-align:right}
  .link{color:var(--dim);font-size:var(--s1);text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:1px}
  .link:hover{color:var(--ink)}
  #playnow{font:600 17px system-ui;padding:13px 30px;border:0;border-radius:9px;
    background:#f3f3f3;color:#111;cursor:pointer}
  #playnow:hover{background:#fff}
  #drawer audio{width:100%;height:30px;margin-top:8px;filter:invert(.9) hue-rotate(180deg) saturate(.2)}
</style>

<div id="stage">
  <canvas id="room"></canvas>
  <canvas id="sky" class="hide"></canvas>
  <div id="score" class="hide"></div>
</div>

<div id="meta" class="chrome"></div>

<div id="modes" class="chrome" role="tablist">
  <button role="tab" aria-selected="true"  onclick="mode(0)">Room</button>
  <button role="tab" aria-selected="false" onclick="mode(1)">Sky</button>
  <button role="tab" aria-selected="false" onclick="mode(2)">Score</button>
</div>

<div id="tools" class="chrome">
  <button onclick="cycleView()" title="camera">&#9707;</button>
  <button onclick="full()" title="full screen">&#9974;</button>
  <button onclick="drawer()" title="more">&#183;&#183;&#183;</button>
</div>

<div id="bar" class="chrome">
  <button id="play" onclick="toggle()">&#9654;</button>
  <div id="seekwrap" onclick="scrub(event)">
    <div id="track"></div><div id="fill"></div><div id="marks"></div><div id="knob"></div>
  </div>
  <div id="where"></div>
  <div id="time">0:00 / 0:00</div>
</div>

<div id="drawer"></div>

  return cl(cueAt(t,L).zoom * lerp(1, 0.62, tensionAt(t)*MOOD_W));
};
const NPXof=id=>{const f=LAYOUT.fixtures.find(x=>x.id===id);return (f&&f.pixels)||24};

/* ---- who plays what ----
   Designers assign instruments to fixture groups and give each group a style.
   The recipe had this implicit and incomplete: the GUITAR -- the defining
   instrument of this song's verses, sixteenth-note acoustic strumming -- drove
   nothing at all. Written out, it is legible and it is editable. */
const ASSIGN=[
  {source:'drums',  group:'par',      style:'pulse',    note:'the kick becomes the room pulse'},
  {source:'bass',   group:'uplight',  style:'bed',      note:'low end washes the back wall'},
  {source:'other',  group:'head',     style:'accent',   note:'the lead synth moves and accents'},
  {source:'guitar', group:'strip_1',  style:'shimmer',  note:'16th strumming as fine fast texture'},
  {source:'drums',  group:'strip_2',  style:'backbeat', note:'snare answers on 2 and 4'},
  {source:'vocals', group:'head_2',   style:'spot',     note:'the spotlight follows the voice'},
  {source:'-',      group:'blinder',  style:'hit',      note:'one bar at a drop, at the crowd'},
  {source:'-',      group:'strobe',   style:'swell',    note:'build tail into the drop'},
];

/* ---- one look, evaluated at t ---- */
function lookFrame(t,L){
  const e=en(t),p=bph(t),k=beatInBar(t),bx=barIdx(t),bp4=phrPh(t),bp=barPh(t);
  const drumGate=0.14+0.86*ss(0.14,0.82,stem('drums',t));
  const EX=escal(t), grow=EX.rep*EX.arc;
  const PAN=panAt(t);
  /* Pan was a 34%% multiplicative bias, which is invisible. Now the CENTRE of
     the wash moves: the mix's stereo image is small (+/-0.22) so it is amplified,
     and brightness falls off with distance from that centre. The room physically
     swings side to side with the record. */
  const panC=cl(0.5+PAN*2.1);
  const panBias=xn=>{
    const d=Math.abs(xn-panC);
    return 0.52+0.85*(1-Math.min(1,d*1.35))};
  const A=accent(p,e)*drumGate, F=[];
  /* The pull-back before a drop. It used to start a full BAR out and take 74% off,
     which is not an anticipation -- it is a long sag that eats the top of the
     build. Measured, the light climbed 1.55 -> 3.65 and then fell to 2.93 in the
     last second, so the build stopped building exactly where it should have been
     most urgent, and the flash afterwards read as disconnected rather than earned.
     A pull-back has to be SHORT and late: hold the climb, cut hard for half a
     beat, then slam. */
  let dip=1;
  if(ANT){
    const[d,dt]=until('drop',t,PER*0.5);
    if(d) dip=1-KILL_DEPTH*ss(0,1,1-dt/(PER*KILL_BEATS));
  }
  if(CUT_DEPTH>0){
    const m=mpos(t), into=m-Math.floor(m/CUT_PHRASE)*CUT_PHRASE;
    const start=CUT_PHRASE-CUT_BARS;
    if(into>=start){
      const x=cl((into-start)/CUT_BARS);
      const after=en(t+(CUT_BARS-(into-start))*BAR+BAR*0.5);
      const before=en(t-BAR*0.5);
      const earn=ss(0, CUT_RISE, after-before);
      dip*=1-CUT_DEPTH*earn*Math.sin(Math.PI*x);
    }
  }
  const z=spanAt(t);
  const prog=(L==='build'&&z)?cl((t-z.from)/(z.to-z.from)):1;
  const layer=i=>ss(i/4-0.14,i/4+0.14,prog);          // continuous, never a step
  // busyness ramps with energy instead of switching at a threshold
  const busy = k===0 ? 1 : k===2 ? ss(0.26,0.52,e) : ss(0.46,0.74,e);
  const off=L==='stop';

  // 6 PARs on the back truss: a wash with a travelling wave, one pass per phrase
  PARS.forEach(function(id,i){
    const G=GEO[id];
    let c=fixColour(t,L,'par',G.xn,e), lv=0;
    if(off){c=[0,0,0]}
    else if(L==='flash'){lv=1}
    else if(L==='spotlight'){c=[0,0,0];lv=0}
    else{
      /* Darkness is a tool, and I was never using it: every section sat above
         0.05 so the room was always faintly on. Breaks and quiets now go
         genuinely dark, which is what makes a drop land. */
      const b0={drop:0.38,build:0.15,verse:0.20,quiet:0.028,idle:0.036,outro:0.042}[L]??0.13;
      // span pulls the quiet parts down and the loud parts up around the middle,
      // so "high" is more contrast rather than more brightness
      const base=cl(0.20 + (b0-0.20)*K.span, 0, 1.4)*K.base;
      /* This used to be 0.70 + 0.30*cos(2pi*(xn - bp4)), a wave travelling across
         the room on a four-bar cycle. Measured, it swung one lamp from 0.400 to
         1.000 -- two and a half times -- on a 7.5 second timer that has nothing to
         do with the music, so the same beat at a different point in the phrase came
         out at a different brightness. That is the inconsistency Renjith heard.

         A STATIC gradient is fine and even wanted: the room should have a shape,
         and par_1 being a little dimmer than par_3 is consistent because it is
         always true. What was wrong was the part that moved on its own. Anything
         that changes brightness over time now has to come from the music. */
      const wave=0.88+0.12*Math.cos(2*Math.PI*G.xn);
      const musical=(0.15+0.85*e)*(L==='drop'?1:0.72);
      lv=(base*0.42 + 0.95*musical)*wave*EX.arc
         + (0.16+0.52*e)*A*grow*K.accent*drumGate;
      /* Layer the chase over the wash rather than replacing it: the wash keeps
         the room from going black between pulses, the chase supplies the
         movement. How much of each depends on how busy the music is -- a quiet
         section has no business chasing. */
      const chaseMix = {drop:0.78,build:0.55,verse:0.30,flash:0.0,quiet:0.0,idle:0.0,outro:0.0}[L] ?? 0.25;
      const c = chaseMix > 0.01 ? chaseAt(t, e, PARN) : null;
      if(c){
        const pulse = chaseGain(G.xn, c) * (0.30 + 0.70 * c.strength);
        const full = (base + 0.55*e) * EX.arc;
        // a shallow floor is what makes the gap read: 0.10 left the dark lamps at a
        // fifth of the bright one, which is a gradient again
        /* The chase must never fully replace the wash. Letting the mix reach 1.0
           at high drive left four lamps of five sitting on the chase floor, so the
           room got DARKER as the knob went up -- measured, p95 output fell from
           3.35 to 2.26 while the setting said "more". Capped at 0.85 the wash
           always carries something, and drive shows up where it should: a deeper
           floor between pulses and a brighter lamp on the hit. */
        const floor = 0.06 / Math.max(0.5, K.chase);
        const mix = cl(chaseMix * K.chase, 0, 0.85) * (0.45 + 0.55*e);
        lv = lerp(lv, full * (floor + (1 - floor) * pulse), mix);
      }
      if(L==='build') lv*=lerp(0.30,1,layer(1));
      if(L==='quiet') lv*=0.78+0.22*Math.sin(2*Math.PI*(mpos(t)/4)+sym(G.xn)*2.2);
      if(G.outer) lv*=1.10; else lv*=0.92;   // the outer pair carries the wash
    }
    F.push({id:id,r:c[0],g:c[1],b:c[2],level:+cl(lv*dip*emph('par',t,L)*arrayGate(G,t,e,L,PARS.length)).toFixed(3)})});

  // 4 uplights on the back wall: a slow colour bed. Almost never pulses.
  const upSwap=ss(0.25,0.75,barPh(t));      // odds hand over to evens across the bar
  UPS.forEach(function(id,i){
    const G=GEO[id];
    let c=fixColour(t,L,'up',G.xn,e), lv=0;
    if(off){c=[0,0,0]}
    else if(L==='flash'){lv=0.85}
    else{
      const share=(i%2===0)?(1-upSwap):upSwap;
      const bed=((L==='quiet'?QUIET_UP:0.070)+0.19*e*(L==='drop'?1.1:0.78))*(0.28+1.10*ss(0.12,0.86,stem('bass',t)));
      lv=bed*(0.55+0.90*share)*(0.84+0.16*Math.sin(2*Math.PI*(mpos(t)/8)+sym(G.xn)*3.1));
      if(L==='build') lv*=lerp(0.35,1,layer(0));
      if(L==='spotlight') lv*=0.22;
    }
    F.push({id:id,r:c[0],g:c[1],b:c[2],level:+cl(lv*dip*emph('uplight',t,L)*arrayGate(G,t,e,L,UPS.length)).toFixed(3)})});

  // 4 moving heads.
  //
  // v0.4 drifted on one sinusoid and read as lifeless. The first fix used discrete
  // modes per look -- sway, circle, ballyhoo -- and that TELEPORTED the heads at
  // 22.96 units/s, because different modes read the phase at different harmonics
  // so the phase itself jumped at a mode change. A level can cut in one frame; a
  // motor cannot. So there are no modes: the character is driven by energy, which
  // is continuous, and only amplitudes and shapes vary.
  /* A beam look is cast for BEAM_HOLD_BARS and the heads in it should hold
     their aim for the same interval -- otherwise the set of beams is stable
     while every one of them is sweeping to a new angle each frame, which is
     what made every half second of the contact sheet a different geometry.

     One full sweep per two intervals: out on this look, back on the next. mpos
     is continuous so this has no steps in it, and the rate below is its exact
     derivative and a constant, which is what keeps the analytic slew bound a
     proof rather than a hope. An earlier attempt at this drove the rate off a
     list of event times, which was discontinuous at the first event and slewed
     the heads at 3.68/s against a 1.05 limit. */
  const th=2*Math.PI*(mpos(t)/(2*BEAM_HOLD_BARS));
  const eM=eMotion(t);
  const shape=ss(0.35,0.85,eM);           // sway ....... circle
  // dwell both ways: hold when calm, and SNAP-then-hold when hot. A head that
  // crosses its arc in a burst and waits reads far faster than one drifting.
  const dw=cl(DWELL_LO*(1-eM)+DWELL_HI*ss(0.72,1.0,eM),0,DWELL_CAP);
  // Amplitude is DERIVED from the fixture's slew budget instead of being checked
  // against it, so the recipe can never ask for more than the motor has.
  // peak velocity of A*sin(u) with a smoothstep dwell is A*omega*1.5/(1-dw).
  /* ---- the slew problem, solved instead of tuned ----
     Four rounds of fudge factors did not converge, because the bound was being
     guessed. Do it analytically. For pan = 0.5 + A(t)*sin(Th(t)):
         |d/dt| <= |A'| + A * Th'
     Th' is the dwell-scaled rate, om*S/duty where S=1.5 is the smoothstep peak.
     A depends on t only through eM, and eM is a 5-tap average of a piecewise
     linear curve, so |eM'| is bounded by EMAX -- computable once from the map.
     Solving for A gives a guaranteed bound rather than a hopeful one. */
  const om=Math.PI/Math.max(1e-6, BEAM_HOLD_BARS*BAR), duty=Math.max(1-DWELL_CAP,1-dw), S=1.5;
  const thp=om*S/duty;                              // peak phase rate
  const ampP=Math.max(0.02,(LIMP-DADE*EMAX)/thp);   // pan  budget, proven
  const ampT=Math.max(0.02,(LIMT-DADE*EMAX)/(2*thp));// tilt runs at 2x in the sway shape
  const msc=Math.min(1, moveScaleAt(t));
  const amp=Math.min(AMP_CAP*msc, ampP)*(0.42+0.58*eM)*SLEW_CAP;
  const tam=Math.min(AMP_CAP*0.65*msc, ampT)*(0.34+0.66*eM)*SLEW_CAP;
  // No fast path for d==0. `return u` is NOT the d->0 limit of the branch below
  // (ss(m) != m), so crossing zero jumped the phase by ~0.6 rad and slewed the
  // heads at 9.8 units/s. Always ease -- which is what a real motor does anyway.
  const dwell=(u,d)=>{const m=u-Math.floor(u), mv=Math.max(1e-6,1-d);
    return Math.floor(u)+(m<mv?ss(0,1,m/mv):1)};
  const u=dwell(th/(2*Math.PI) + (1-dw)*0.5*MOVE_LEAD, dw)*2*Math.PI;
  // A lamp can black out in one frame; a motor cannot reposition in 0.22 s. So
  // position deliberately ignores `stop` -- a real head holds its aim while its
  // lamp goes dark. Only `spotlight`, whose crossfade is 0.9 s, asks for stillness.
  /* No positional stillness at all, for the same reason `stop` has none: a
     spotlight reads from BRIGHTNESS -- one head lit, the rest dark -- not from
     frozen motors. Freezing them bought nothing visually and cost a slew
     violation every time, because any window tied to a look boundary changes
     faster than a motor can follow. Motion is energy-driven and nothing else. */
  const still=1;
  // Real design alternates truss groups: front for a phrase, upstage for the next,
  // everything at the drop. Having all eight heads lit in every look is why a big
  // rig can read as flat -- contrast comes from what is OFF.
  const alt=0.5+0.5*Math.cos(2*Math.PI*(mpos(t)/8));
  const bothTrusses=(L==='drop'||L==='flash')?1:0;
  HEADS.forEach(function(id,i){
    const G=GEO[id];
    // fan and mirror come from WHERE the head hangs, so a rig with a different
    // number of heads or different spacing still reads correctly
    // heads on the upstage truss counter-rotate against the front truss, so the
    // beams cross over the floor instead of sweeping in parallel
    const back=G.z>3.0, mir=(G.left?1:-1)*(back?-1:1);
    const hoff=G.xn*2*Math.PI*HOFF_SPREAD+(back?Math.PI*HOFF_TRUSS:0), fan=(G.xn-0.5)*2;
    /* `shape` is the cue library's most visible parameter -- it is what makes
       pulse (0.10) different from fan (0.20), cross (0.90) and ballyhoo (1.00).
       It was inert: pSway and pCirc were the SAME formula apart from a
       fan*0.13 offset, so every block in the library produced one geometry.
       Watched frame by frame, a 42-second verse cycling four different cue
       blocks was 85 identical frames of the same V.

       Two figures that actually look different:
         fan   -- every head swings the same way, spread by where it hangs, so
                  the beams stay parallel and comb across the room
         cross -- neighbours counter-rotate, so the beams cut through each other
       The rate is unchanged in both, so the slew bound above still holds: the
       per-fixture sign and the phase offset are constants. */
    const odd = (G.ki % 2) === 1;
    const pSway = amp*mir*Math.sin(u) + fan*0.34;
    const pCirc = amp*mir*(odd?-1:1)*Math.sin(u + hoff*2.0);
    const tSway = tam*Math.sin(u*0.5 + hoff);
    const tCirc = tam*(odd?-1:1)*Math.cos(u + hoff);
    let pan =cl(0.5 +(lerp(pSway,pCirc,shape))*still);
    // the upstage truss aims out over the crowd; the front truss aims down
    let tilt=cl((back?0.62:0.42)+(lerp(tSway,tCirc,shape))*still
                + MEL_TILT*meloDrift(t)*still*(back?1:-1));
    const share=back?(1-alt):alt;
    const gate=bothTrusses?1:(0.10+0.90*share);
    let c=fixColour(t,L,'head',G.xn,e), lv=0, hz=0;
    if(off){c=[0,0,0]}
    else if(L==='flash'){lv=1}
    else if(L==='spotlight'){
      const near=Math.abs(G.xn-0.5);
      const voc=Math.max(stem('vocals',t), voxAt(t), sung(t));
      lv = near<=CENTRE_PAIR ? (0.30+0.62*voc)*(1-0.5*near/Math.max(1e-6,CENTRE_PAIR)) : 0.0}
    else{
      const lead=(((bx%2)+2)%2===0)?G.outer:!G.outer;   // outer pair, then inner pair
      // a small positional term, so the four heads are never identical even
      // between accents -- in a real rig no two fixtures read the same
      const base=(0.11+0.26*e)*(0.86+0.28*sym(G.xn));
      const lamp=(L==='drop'?0.30+0.44*e:0.18+0.36*e)*(0.84+0.28*Math.max(voxAt(t),sung(t)));
      lv=(base*EX.arc+lamp*accent(p,e)*(lead?1:0.28)*busy*grow+0.09*accentHit(t)*(lead?1:0.5))
;
      if(L==='build') lv*=lerp(0.25,1,layer(2));
      if(L==='quiet') lv=base*0.75+0.045*(0.5+0.5*Math.sin(2*Math.PI*(mpos(t)/4)));
      if(L==='idle')  lv=0.04+0.03*(0.5+0.5*Math.sin(2*Math.PI*(mpos(t)/8)+sym(G.xn)*4));
      if(L==='drop'){const[d,s]=since('drop',t,8);
        if(s!==null&&s<BAR&&STROBE_AT.has(d.at)) hz=musicalHz()}
    }
    const lvl0 = cl(lv*dip*gate*emph('head',t,L)*panBias(G.xn)
                    *arrayGate(G,t,e,L,HEADS.length));
    /* Narrow fixtures take their on/off from the phrase-held beam look and use
       the computed level only to shape how bright they are while up. Wide ones
       are unaffected, and "narrow" comes from the layout's own beam_deg, so
       nothing here knows a fixture by name. */
    const narrow = (G.deg !== undefined && G.deg <= BEAM_HARD_DEG);
    const lvlOut = narrow
      ? beamEnv(G, t, beamWant(t, L))
        * cl(BEAM_FLOOR + (1-BEAM_FLOOR)*lvl0*1.8)
      : lvl0;
    F.push({id:id,r:c[0],g:c[1],b:c[2],level:+lvlOut.toFixed(3),
            pan:+pan.toFixed(3),tilt:+tilt.toFixed(3),strobe:+hz.toFixed(3),
            zoom:+zoomAt(t,e,L).toFixed(3)})});

  // 2 strobes: ramped in and out, never a hard gate
  STROBES.forEach(function(id,i){
    const G=GEO[id];
    let lv=0,hz=0;
    if(L==='flash'){lv=1}
    else if(L==='drop'){const[d,s]=since('drop',t,8);
      if(s!==null&&s<BAR&&STROBE_AT.has(d.at)){lv=(1-ss(BAR*0.6,BAR,s));hz=musicalHz()}}
    else if(L==='build'&&z){const rem=z.to-t;
      if(rem<=2*BAR){lv=ss(0,1,1-rem/(2*BAR))*((G.left===(((bx%2)+2)%2===0))?1:0.5)*Math.min(1,grow);
        hz=musicalHz()}}
    F.push({id:id,level:+cl(lv*dip*STROBE_GAIN*deployed('strobe',t)).toFixed(3),strobe:+hz.toFixed(3)})});

  /* Blinders point AT the crowd. Used sparingly and only on the biggest hits --
     a blinder that is on often is just a lamp. Two windows: the first bar of a
     drop, and the last two bars of a build where it swells into the drop. */
  BLINDERS.forEach(function(id,i){
    const G=GEO[id]; let lv=0, hz=0;
    if(L==='flash'){ lv=1 }
    else if(L==='drop'){ const[d,sd]=since('drop',t,8);
      if(sd!==null&&sd<BAR){ lv=(1-ss(BAR*0.35,BAR,sd))*(0.75+0.25*(d.v??0.9));
        hz=musicalHz() } }
    else if(L==='build'&&z){ const rem=z.to-t;
      if(rem<=2*BAR) lv=0.55*ss(0,1,1-rem/(2*BAR))*(i===(((bx%2)+2)%2)?1:0.6) }
    F.push({id:id,level:+cl(lv*dip*Math.min(1,grow)*(0.25+0.75*BANG)*deployed('blinder',t)).toFixed(3),strobe:+hz.toFixed(3)})});

  /* 24 LED wash zoom on the mid and upstage trusses: the BACKLIGHT layer. They
     move slowly, sit wide, and carry the harmonic bed -- so they hold the room
     while the beams cut through it. Without this a quarter of the rig was dark. */
  const zW=zoomAt(t,e,L);
  WASHES.forEach(function(id,i){
    const G=GEO[id];
    let c=fixColour(t,L,'up',G.xn,e), lv=0;
    if(off){c=[0,0,0]}
    else if(L==='flash'){c=W_.slice();lv=0.90}
    else{
      const wave=0.72+0.28*Math.cos(2*Math.PI*(sym(G.xn)*1.5-bp4));
      const base={drop:0.28,build:0.12,verse:0.15,quiet:QUIET_WASH,idle:0.042,outro:0.05}[L]??0.10;
      lv=(base+0.32*e*(L==='drop'?1:0.64))*wave*EX.arc;
      if(L==='build') lv*=lerp(0.30,1,layer(1));
      if(L==='spotlight') lv*=0.18;
    }
    // slow counter-rotating tilt, so the backlight fans against the front beams
    const th2=motionPhase(t)*0.5+(G.z>29?Math.PI:0);
    F.push({id:id,r:c[0],g:c[1],b:c[2],level:+cl(lv*dip*emph('wash',t,L)*panBias(G.xn)*arrayGate(G,t,e,L,WASHES.length)).toFixed(3),
            pan:+cl(0.5+0.16*Math.sin(th2+G.xn*3.1)).toFixed(3),
            tilt:+cl(0.34+0.12*Math.sin(th2*2)).toFixed(3),
            zoom:+cl(zW*1.15).toFixed(3)})});

  /* Lasers are emitted at zero, deliberately. They are the only fixture in this
     rig that can injure an audience, and driving them needs a safety layer --
     aerial-only zones, a hard height floor, an interlock -- that does not exist
     yet. A zero here is a decision, not an omission. */
  LASERS.forEach(function(id){
    const G=GEO[id], lim=(LAYOUT.limits||{});
    const zones=lim.laser_zones||[], floorM=(lim.laser_min_height_m!==undefined?lim.laser_min_height_m:3.0);
    const okZone = zones.indexOf(G.zone)>=0;
    const okHigh = G.y >= floorM;
    if(!(okZone && okHigh)){
      F.push({id:id,level:0,pattern:0,scan:0,
              held_back: !okZone ? ('zone '+G.zone+' is not a declared laser zone')
                                 : ('mounted at '+G.y.toFixed(1)+' m, below the '+floorM+' m floor')});
      return }
    let lv=0;
    const[dL,sdL]=since('drop',t,BAR*8);
    if(dL && sdL!==null){
      const rise=ss(0,1,sdL/(BAR*0.5));
      const fall=1-ss(0,1,cl((sdL-BAR*3)/BAR));
      lv=(0.55+0.45*(dL.v!==undefined?dL.v:0.9))*rise*fall;
    }
    if(L==='build'&&z){ const rem=z.to-t;
      if(rem<=4*BAR) lv=Math.max(lv,0.70*ss(0,1,1-rem/(4*BAR))); }
    if(L==='flash') lv=Math.max(lv,0.9);
    lv*=0.30+0.70*BANG;
    const fan = 0.55+0.45*Math.cos(2*Math.PI*(sym(G.xn)*2 - mpos(t)/2));
    const c = fixColour(t,L,'head',G.xn,e);
    F.push({id:id, level:+cl(lv*fan*dip*EX.arc*deployed('laser',t),0,1).toFixed(3),
            r:c[0], g:c[1], b:c[2], pattern:1, scan:0, aerial:true})});

  /* The video wall is emitted as a declaration, not pixels. 96x54 is 5,184
     pixels a frame, and more importantly a screen is not a light: it wants its
     own reader off the same map, the way the drone reader does. Recorded here so
     the gap is visible in the frame rather than only in a document. */
  KIND('co2').forEach(function(id){
    const G=GEO[id]; let lv=0;
    if(L==='drop'){ const[d,sd]=since('drop',t,8);
      const burst=Math.min((LAYOUT.limits||{}).co2_max_burst_s||1.2, BAR*0.6);
      if(sd!==null && sd<burst) lv=(1-ss(0,burst,sd))*(0.6+0.4*(d&&d.v!==undefined?d.v:0.9)); }
    F.push({id:id,level:+cl(lv*BANG*deployed('co2',t),0,1).toFixed(3)})});

  KIND('confetti').forEach(function(id){
    let lv=0;
    const last=DROPS_AT.length?DROPS_AT[DROPS_AT.length-1]:null;
    if(last!==null && t>=last && t-last<BAR*4) lv=1-ss(0,BAR*4,t-last);

  const C = o => [o.r!==undefined?o.r:255, o.g!==undefined?o.g:255, o.b!==undefined?o.b:255];
  const lit = o => o && (o.level||0) > 0.012;
  const cl = (v,a,b) => v<a?a:v>b?b:v;

  // haze comes from the foggers, and everything airborne is scaled by it
  let haze = 0;
  for(const f of fx) if(fam(f)==="fog" && by[f.id]) haze = Math.max(haze, by[f.id].level||0);
  haze = 0.30 + 0.70*haze;                       // never quite zero: rooms are dusty

  // the air itself, thicker near the floor
  const air = g.createLinearGradient(0, topY, 0, floorY);
  air.addColorStop(0, `rgba(120,140,190,${(0.010*haze).toFixed(4)})`);
  air.addColorStop(1, `rgba(120,140,190,${(0.055*haze).toFixed(4)})`);
  g.fillStyle = air; g.fillRect(0,0,W,floorY);

  // ---- the upstage wall sits behind everything, so it is drawn first
  g.globalCompositeOperation = "source-over";
  for(const f of fx){
    if(fam(f) !== "wall") continue;
    const o = by[f.id]; if(!o) continue;
    const k = shrink(depth(f));
    const cx = VPX + (sx(f.at[0])-VPX)*k, cy = VPY + (sy(f.at[1])-VPY)*k;
    const wm = (f.size_m && f.size_m[0]) || size.w*0.7, hm = (f.size_m && f.size_m[1]) || size.h*0.5;
    const ww = (wm/size.w)*(W-2*pad)*k, hh = (hm/(size.h||3.4))*(floorY-topY)*k;
    g.fillStyle = "#04050a"; g.fillRect(cx-ww/2, cy-hh/2, ww, hh);
    const px = o.pixels && o.pixels.length ? o.pixels : null;
    if(px){
      const cols = Math.max(1, Math.round(Math.sqrt(px.length * (ww/Math.max(1,hh)))));
      const rows = Math.ceil(px.length/cols), cw = ww/cols, ch = hh/rows;
      for(let i=0;i<px.length;i++){
        const q = px[i];
        g.fillStyle = `rgb(${q[0]|0},${q[1]|0},${q[2]|0})`;
        g.fillRect(cx-ww/2 + (i%cols)*cw, cy-hh/2 + ((i/cols)|0)*ch, cw+0.6, ch+0.6);
      }
    } else if(lit(o)){
      const [r,gr,b] = C(o);
      g.fillStyle = `rgba(${r},${gr},${b},${(0.85*o.level).toFixed(3)})`;
      g.fillRect(cx-ww/2, cy-hh/2, ww, hh);
    }
  }

  // ---- the bodies of the battens, opaque, before anything additive is laid
  //      over them. An unlit cell then reads as a dark cell of a real fixture
  //      rather than a hole punched in the middle of it.
  for(const f of fx){
    if(fam(f) !== "bar") continue;
    const k = shrink(depth(f));
    const cx = VPX + (sx(f.at[0])-VPX)*k, cy = VPY + (sy(f.at[1])-VPY)*k;
    const vert = (f.axis || "v") === "v";
    const len = (vert ? (floorY-topY)*0.155 : (W-2*pad)*0.075) * k;
    g.fillStyle = "#12151f";
    if(vert) g.fillRect(cx-2.6*k, cy-len/2, Math.max(2,5.2*k), len);
    else     g.fillRect(cx-len/2, cy-2.6*k, len, Math.max(2,5.2*k));
  }

  g.globalCompositeOperation = "lighter";

  // ---- pixel bars: a bar is a row of cells, not a cone
  for(const f of fx){
    if(fam(f) !== "bar") continue;
    const o = by[f.id]; if(!o) continue;
    const k = shrink(depth(f));
    const cx = VPX + (sx(f.at[0])-VPX)*k, cy = VPY + (sy(f.at[1])-VPY)*k;
    const n = Math.max(1, f.pixels || 12);
    const vert = (f.axis || "v") === "v";
    const len = (vert ? (floorY-topY)*0.155 : (W-2*pad)*0.075) * k;
    const cellw = Math.max(1.6, (vert ? 5.0 : len/n) * k);
    const px = o.pixels && o.pixels.length ? o.pixels : null;
    for(let i=0;i<n;i++){
      let r,gr,b,L;
      if(px){ const q = px[Math.min(px.length-1, i)]; r=q[0]; gr=q[1]; b=q[2];
              L = (r+gr+b)/765; }
      else { const c = C(o); r=c[0]; gr=c[1]; b=c[2]; L = o.level||0; }
      if(L <= 0.02) continue;
      const u = (i+0.5)/n - 0.5;
      const ex = cx + (vert ? 0 : u*len), ey = cy + (vert ? u*len : 0);
      const cellh = Math.max(1.6, (vert ? len/n : 5.0*k));
      g.fillStyle = `rgba(${r|0},${gr|0},${b|0},${Math.min(1,0.30+0.70*L).toFixed(3)})`;
      g.fillRect(ex - cellw/2, ey - cellh/2, cellw, cellh);
      const gl = g.createRadialGradient(ex,ey,0,ex,ey,Math.max(cellw,cellh)*2.6);
      gl.addColorStop(0, `rgba(${r|0},${gr|0},${b|0},${(0.34*L).toFixed(3)})`);
      gl.addColorStop(1, `rgba(${r|0},${gr|0},${b|0},0)`);
      g.fillStyle = gl;
      g.beginPath(); g.arc(ex,ey,Math.max(cellw,cellh)*2.6,0,6.2832); g.fill();
    }
  }

  // ---- everything that throws light through air
  for(const f of fx){
    const F = fam(f);
    if(F==="fog" || F==="bar" || F==="wall") continue;
    const o = by[f.id];
    if(!lit(o)) continue;
    const [r,gr,b] = C(o), L = o.level;
    const k = shrink(depth(f));
    const px = VPX + (sx(f.at[0])-VPX)*k, py = VPY + (sy(f.at[1])-VPY)*k;
    const fy = floorAt(k);
    const pan  = o.pan  !== undefined ? o.pan  : 0.5;
    const tilt = o.tilt !== undefined ? o.tilt : 0.62;
    const face = f.face || "down";

    // ---- audience-facing fixtures do not put a cone into the room; they glare
    //      at the viewer. Drawing a blinder as a downward beam was why the rig
    //      never read as a stage pointed at a crowd.
    if(F==="blinder" || F==="strobe"){
      const rad = (F==="strobe" ? 26 : 44) * k * (0.45 + 0.55*L);
      const gl = g.createRadialGradient(px,py,0,px,py,rad);
      gl.addColorStop(0,   `rgba(${r},${gr},${b},${Math.min(0.98,0.92*L).toFixed(3)})`);
      gl.addColorStop(0.35,`rgba(${r},${gr},${b},${(0.34*L).toFixed(3)})`);
      gl.addColorStop(1,   `rgba(${r},${gr},${b},0)`);
      g.fillStyle = gl; g.beginPath(); g.arc(px,py,rad,0,6.2832); g.fill();
      // spill toward the viewer, washing the crowd
      const spill = g.createLinearGradient(px,py,px,Hpx);
      spill.addColorStop(0, `rgba(${r},${gr},${b},${(0.085*L*haze).toFixed(3)})`);
      spill.addColorStop(1, `rgba(${r},${gr},${b},0)`);
      g.fillStyle = spill;
      g.beginPath(); g.moveTo(px-rad*0.4,py); g.lineTo(px+rad*0.4,py);
      g.lineTo(px+rad*1.7,Hpx); g.lineTo(px-rad*1.7,Hpx); g.closePath(); g.fill();
      continue;
    }

    // ---- plumes and falls: CO2 and pyro rise, confetti falls
    if(F==="co2" || F==="pyro" || F==="confetti"){
      const rise = F==="confetti" ? -1 : 1;
      const reach = (F==="pyro" ? 0.72 : F==="co2" ? 0.58 : 0.85) * (py - topY) * L;
      const ty = py - rise*reach;
      const wideTop = (F==="co2" ? 34 : F==="pyro" ? 14 : 60) * k;
      const col = F==="co2" ? [235,240,255] : F==="pyro" ? [255,196,96] : [r,gr,b];
      const grad = g.createLinearGradient(px,py,px,ty);
      grad.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${(0.70*L).toFixed(3)})`);
      grad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
      g.fillStyle = grad;
      g.beginPath(); g.moveTo(px-4*k,py); g.lineTo(px+4*k,py);
      g.lineTo(px+wideTop,ty); g.lineTo(px-wideTop,ty); g.closePath(); g.fill();
      if(F==="confetti"){
        for(let i=0;i<26;i++){
          const u=((i*Math.PI*7.3)%1), v=((i*Math.PI*3.1)%1);
          const fxp = px + (u-0.5)*wideTop*2, fyp = py + v*reach;
          g.fillStyle = `rgba(${r},${gr},${b},${(0.75*L).toFixed(3)})`;
          g.fillRect(fxp, fyp, 2.2*k, 3.4*k);
        }
      }
      continue;
    }

    /* Which way it throws.

       A moving head does not use its whole mechanical range on a show, and it
       is never parked horizontal -- that aims it straight into the audience's
       eyes. A head hung on a truss works from straight down to a little above
       horizontal; a head standing on the deck works from straight up to well
       off vertical. Mapping tilt 0.5 to dead horizontal instead put two dozen
       beams flat across the room in a hairline and it read as scratches.

       vert is +1 for straight up, -1 for straight down. */
    const T = cl(tilt, 0, 1);
    let vert;
    if(moves(f))          vert = (face === "up") ? (1.00 - 0.55*T)    // deck: up
                                                 : (-1.00 + 1.55*T);  // truss: down
    else if(face==="up")    vert = 1;
    else if(face==="cross") vert = 0.12;
    else                    vert = -1;

    /* The throw is a direction and a length, not an x from pan and a y from
       tilt. Setting them independently let a nearly-level beam travel the
       whole width of the room while barely rising. */
    const span = (W - 2*pad) * k;
    const swing = moves(f) ? 0.92 : (face==="cross" ? 0.9 : 0.12);
    const ux = (pan - 0.5) * 2 * swing, uy = -vert;
    const un = Math.hypot(ux, uy) || 1;
    const reach = Math.max(py - topY, fy - py) * 1.30;
    const tx = px + (ux/un) * reach * 1.45;
    const ty = py + (uy/un) * reach;

    const deg = f.beam_deg !== undefined ? f.beam_deg
              : (F==="beam"?4 : F==="sky"?2.5 : F==="spot"?15 : F==="wash"?40 : F==="laser"?1 : 25);
    const spread = Math.tan((deg*Math.PI/180)/2);
    const len = Math.hypot(tx-px, ty-py) || 1;
    const hard = (F==="beam"||F==="sky"||F==="laser");
    const half = Math.max(hard ? 1.1*k : 4*k, spread*len);

    // a laser is a line, not a cone, and it is the one thing in the rig that
    // does not soften with distance
    if(F==="laser"){
      const grad = g.createLinearGradient(px,py,tx,ty);
      grad.addColorStop(0, `rgba(${r},${gr},${b},${Math.min(0.95,0.95*L).toFixed(3)})`);
      grad.addColorStop(1, `rgba(${r},${gr},${b},${(0.30*L*haze).toFixed(3)})`);
      g.strokeStyle = grad; g.lineWidth = Math.max(1, 1.4*k);
      const cxm = px + (tx-px)*0.35;          // the fan leans, it does not fly
      for(let i=-3;i<=3;i++){
        g.beginPath(); g.moveTo(px,py);
        g.lineTo(cxm + i*span*0.038, ty); g.stroke();
      }
      continue;
    }

    /* Three passes: wide and faint, mid, then a bright core. Real scattering
       falls off across the cone and one flat gradient cannot show it. A hard
       fixture gets a tighter, brighter core than a wash. */
    const passes = hard ? [[1.00,0.34,1.00],[0.46,0.62,1.00],[0.14,0.95,1.00]]
                        : [[1.00,0.42,1.00],[0.52,0.58,0.98],[0.18,0.85,0.95]];
    for(const [wf, af, lf] of passes){
      const ex = px + (tx-px)*lf, ey = py + (ty-py)*lf, hw = half*wf;
      const grad = g.createLinearGradient(px,py,ex,ey);
      const areaK = hard ? 1 : Math.min(1, 13/Math.max(5, deg));
      const a0 = Math.min(0.95, af * (0.35 + 0.65*L) * haze * areaK);
      grad.addColorStop(0,    `rgba(${r},${gr},${b},${a0.toFixed(3)})`);
      grad.addColorStop(0.55, `rgba(${r},${gr},${b},${(a0*(hard?0.72:0.45)).toFixed(3)})`);
      grad.addColorStop(1,    `rgba(${r},${gr},${b},${hard?(a0*0.30).toFixed(3):0})`);
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(px - 2.5*k, py); g.lineTo(px + 2.5*k, py);
      g.lineTo(ex + hw, ey);    g.lineTo(ex - hw, ey);
      g.closePath(); g.fill();
    }

    // the pool on the floor survives with no haze at all -- but only if the
    // fixture is actually aimed down
    if(vert < -0.15 && ty > fy - (fy-py)*0.30){
      const pw = Math.max(12*k, half*1.7), ph = Math.max(5*k, half*0.40);
      const pool = g.createRadialGradient(tx,fy,0,tx,fy,pw);
      pool.addColorStop(0,   `rgba(${r},${gr},${b},${(0.60*L).toFixed(3)})`);
      pool.addColorStop(0.5, `rgba(${r},${gr},${b},${(0.22*L).toFixed(3)})`);
      pool.addColorStop(1,   `rgba(${r},${gr},${b},0)`);
      g.fillStyle = pool;
      g.beginPath(); g.ellipse(tx, fy, pw, ph, 0, 0, 6.2832); g.fill();
    }

    // the lens
    const lr = Math.max(2.0, (4 + 8*L)*k);
    const gl = g.createRadialGradient(px,py,0,px,py,lr);
    gl.addColorStop(0, `rgba(${r},${gr},${b},${Math.min(0.95,0.85*L).toFixed(3)})`);
    gl.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = gl; g.beginPath(); g.arc(px,py,lr,0,6.2832); g.fill();
  }
  g.globalCompositeOperation = "source-over";

  // the deck edge, then a black crowd so brightness has something to read against
  g.strokeStyle = "rgba(200,215,255,.13)"; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0,floorY); g.lineTo(W,floorY); g.stroke();
  g.fillStyle = "#020306";
  const n = Math.max(14, (W/34)|0);
  for(let i=0;i<n;i++){
    const hx = (i+0.5)/n*W + ((i*37)%11 - 5);
    const hh = (Hpx-floorY)*(0.34 + ((i*53)%7)/26);
    g.beginPath(); g.ellipse(hx, floorY + hh*0.55, Math.max(3,W/n*0.30), hh*0.62, 0, 0, 6.2832);
    g.fill();
  }

  // the bodies of the fixtures, so an unlit rig is still visible as a rig
  for(const f of fx){
    const F = fam(f);
    if(F==="fog" || F==="wall") continue;
    const o = by[f.id];
    if(lit(o)) continue;
    const k = shrink(depth(f));
    const px = VPX + (sx(f.at[0])-VPX)*k, py = VPY + (sy(f.at[1])-VPY)*k;
    g.fillStyle = "#141824";
    if(F==="bar"){
      const vert = (f.axis||"v")==="v";
      const len = (vert ? (floorY-topY)*0.155 : (W-2*pad)*0.075) * k;
      g.fillRect(px - (vert?2:len/2), py - (vert?len/2:2), vert?4:len, vert?len:4);
    } else {
      g.beginPath(); g.arc(px,py,Math.max(1.1,(F==="beam"||F==="spot"?3.0:2.2)*k),0,6.2832); g.fill();
    }
  }

}

function frameDiff(a,b){
  const A={}; for(const o of a.fixtures) A[o.id]=o;
  let n=0,s=0;
  for(const o of b.fixtures){
    const p=A[o.id]; if(!p) continue;
    if("level" in o && "level" in p){
      s+=Math.abs(o.level-p.level); n++;
      const la=(o.level+p.level)/2;
      if(la>0.02 && "r" in o && "r" in p){
        s+=(Math.abs(o.r-p.r)+Math.abs(o.g-p.g)+Math.abs(o.b-p.b))/765*la*2; n+=1 }
    }
    if("pan" in o && "pan" in p && "tilt" in o && "tilt" in p){
      s+=Math.abs(o.pan-p.pan)*0.5+Math.abs(o.tilt-p.tilt)*0.5; n++ }
    if(o.pixels&&p.pixels&&o.pixels.length===p.pixels.length){
      let d=0; for(let i=0;i<o.pixels.length;i++)
        d+=(Math.abs(o.pixels[i][0]-p.pixels[i][0])+Math.abs(o.pixels[i][1]-p.pixels[i][1])
           +Math.abs(o.pixels[i][2]-p.pixels[i][2]))/765;
      s+=d/o.pixels.length; n++;
    }
  }
  const r=n?s/n:0;
  return Number.isFinite(r)?r:0;
}
/* Averaging every channel over three minutes buries the only thing an audience
   actually sees. A light show reads as EVENTS: if the flashes land in the wrong
   place the show is wrong, however close the average brightness stays. A
   half-beat phase error scored 97.8% on the mean, which is a comfortable lie.
   So the headline compares the CHANGE in emitted light between the two rooms,
   which is what a transient is, and correlates the two sequences. Identical maps
   give 100%; a room flashing on the wrong half of the beat gives about zero. */
function pearson(a,b){
  const n=a.length, ma=a.reduce((x,y)=>x+y,0)/n, mb=b.reduce((x,y)=>x+y,0)/n;
  let sa=0,sb=0,sab=0;
  for(let i=0;i<n;i++){const da=a[i]-ma, db=b[i]-mb; sa+=da*da; sb+=db*db; sab+=da*db}
  return (sa&&sb)?sab/Math.sqrt(sa*sb):(sa===sb?1:0);
}
function totalLight(fr){ let s=0; for(const o of fr.fixtures) s+=(o.level||0); return s }


/* ---- fixtures, up close ------------------------------------------------------
   Not a room. One tile per fixture, big enough to read, for checking that the
   output is what you meant rather than for seeing what it would look like.
   A lamp shows its colour at its brightness; a head also shows where it points.
*/
function drawFixtures(cv, fr, layout){
  const W = cv.clientWidth, H = cv.clientHeight || 240, dpr = window.devicePixelRatio || 1;
  if(cv.width !== W*dpr || cv.height !== H*dpr){ cv.width = W*dpr; cv.height = H*dpr }
  const g = cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle = "#1a1e28"; g.fillRect(0,0,W,H);
  if(!fr || !layout) return;

  const fx = (layout.fixtures||[]).filter(f => f.kind !== "fog");
  const by = {}; for(const o of fr.fixtures) by[o.id] = o;
  const fogs = (layout.fixtures||[]).filter(f => f.kind === "fog")
                 .map(f => by[f.id]).filter(Boolean);
  const haze = fogs.length ? Math.max(...fogs.map(o => o.level||0)) : 0;

  const n = fx.length || 1;
  const pad = 12, gap = n > 60 ? 3 : (n > 24 ? 6 : 10);
  const availW = Math.max(40, W - pad*2), availH = Math.max(40, H - pad*2 - 26);
  const minTile = n > 120 ? 22 : (n > 60 ? 30 : 44);
  const cols = Math.max(1, Math.min(n, Math.floor((availW + gap) / (minTile + gap))));
  const rows = Math.max(1, Math.ceil(n / cols));
  const tw = Math.max(6, (availW - gap*(cols-1)) / cols);
  const th = Math.max(6, Math.min(tw * 1.35, (availH - gap*(rows-1)) / rows));
  const top = pad;

  const showText = tw >= 64 && th >= 56;
  const showPad = tw >= 46 && th >= 42;
  fx.forEach((f, i) => {
    const o = by[f.id] || {};
    const L = o.level || 0;
    const r = o.r!==undefined?o.r:255, gg = o.g!==undefined?o.g:255, b = o.b!==undefined?o.b:255;
    const x = pad + (i % cols)*(tw+gap), y = top + Math.floor(i / cols)*(th+gap);

    g.fillStyle = "#252b39"; g.strokeStyle = "#3c4457"; g.lineWidth = 1;
    g.beginPath(); g.roundRect(x, y, tw, th, 5); g.fill(); g.stroke();

    // the lens: colour at brightness, with a glow that scales with level
    const head = o.pan !== undefined;
    const cx = x + tw/2, cy = y + th*(head?0.30:0.40);
    const rad = Math.max(1, Math.min(tw, th)*(head?0.19:0.24));
    if(L > 0.01){
      const glow = g.createRadialGradient(cx,cy,0,cx,cy,rad*2.6);
      glow.addColorStop(0, `rgba(${r},${gg},${b},${(0.55*L).toFixed(3)})`);
      glow.addColorStop(1, `rgba(${r},${gg},${b},0)`);
      g.fillStyle = glow; g.beginPath(); g.arc(cx,cy,rad*2.6,0,6.2832); g.fill();
    }
    g.fillStyle = L > 0.01 ? `rgb(${(r*L)|0},${(gg*L)|0},${(b*L)|0})` : "#333b4c";
    g.beginPath(); g.arc(cx,cy,rad,0,6.2832); g.fill();
    g.strokeStyle = "#4a5468"; g.stroke();

    // A head gets a position pad, which is how a lighting desk shows one: pan
    // across, tilt down, and a dot where the beam is aimed. A stub sticking out
    // of the lens told you the direction and nothing about the range it sits in.
    if(o.pan !== undefined){
      const pw = tw*0.62, ph = Math.min(th*0.26, pw*0.55);
      const px0 = cx - pw/2, py0 = y + th*0.60;
      g.fillStyle = "#0a0c11"; g.strokeStyle = "#242a38"; g.lineWidth = 1;
      g.beginPath(); g.roundRect(px0, py0, pw, ph, 3); g.fill(); g.stroke();
      g.strokeStyle = "#1b2029";
      g.beginPath(); g.moveTo(px0+pw/2, py0); g.lineTo(px0+pw/2, py0+ph);
      g.moveTo(px0, py0+ph/2); g.lineTo(px0+pw, py0+ph/2); g.stroke();
      const ax = px0 + o.pan*pw, ay = py0 + (o.tilt!==undefined?o.tilt:0.5)*ph;
      // a line from the lens to the aim point, so the pad reads as the beam
      g.strokeStyle = L>0.01 ? `rgba(${r},${gg},${b},0.35)` : "#232838";
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(cx, cy+rad*0.7); g.lineTo(ax, ay); g.stroke();
      if(L > 0.01){
        const dg = g.createRadialGradient(ax,ay,0,ax,ay,9);
        dg.addColorStop(0, `rgba(${r},${gg},${b},0.95)`);
        dg.addColorStop(1, `rgba(${r},${gg},${b},0)`);

   Order matters -- ShaderPass/RenderPass/UnrealBloomPass do
   `class X extends THREE.Pass`, and THREE.Pass is defined by EffectComposer.js,
   so that has to be in memory before they parse. */
const CDN_FILES=[
  ['build/three.min.js'],
  ['examples/js/shaders/CopyShader.js',
   'examples/js/shaders/LuminosityHighPassShader.js',
   'examples/js/postprocessing/EffectComposer.js'],
  ['examples/js/postprocessing/ShaderPass.js',
   'examples/js/postprocessing/RenderPass.js',
   'examples/js/postprocessing/UnrealBloomPass.js']];

/* One beam = one cone shell, drawn additively from both sides. Alpha falls off
   along the beam (uD/vT) and away from its axis: the shell's own normal, dotted
   with the eye, is ~1 where the view ray runs down the middle of the cone and
   ~0 at the silhouette, which is a cheap stand-in for the path length through
   the volume. Two exponents -- a soft body and a tight core. */
const BEAM_VS=[
'varying float vT;','varying vec3 vN;','varying vec3 vE;',
'void main(){',
'  vT = position.y;',
'  vec4 mv = modelViewMatrix * vec4( position, 1.0 );',
'  vN = normalMatrix * normal;',
'  vE = -mv.xyz;',
'  gl_Position = projectionMatrix * mv;',
'}'].join('\n');
const BEAM_FS=[
'uniform vec3 uColor;','uniform float uI;','uniform float uD;','uniform float uCore;',
'varying float vT;','varying vec3 vN;','varying vec3 vE;',
'void main(){',
'  float t = clamp( vT, 0.0, 1.0 );',
'  float along = mix( 1.0, pow( 1.0 - t, 1.9 ), 0.80 );',
'  float d = clamp( abs( dot( normalize( vN ), normalize( vE ) ) ), 0.0, 1.0 );',
'  float a = uI * uD * ( 0.11 + 0.55 * pow( d, 2.0 ) + 1.30 * pow( d, uCore ) ) * along;',
'  a *= smoothstep( 0.0, 0.04, t ) * ( 1.0 - smoothstep( 0.93, 1.0, t ) );',
'  gl_FragColor = vec4( uColor * a, 1.0 );',
'  #include <tonemapping_fragment>',
'  #include <encodings_fragment>',
'}'].join('\n');

/* The scene renders linear and untone-mapped into the composer's half-float
   buffer, so bloom sees real HDR. This last pass is where the picture becomes
   an image: ACES, then sRGB. In the fast path the composer is bypassed and the
   renderer's own ACES + sRGB do the same job, which is why the beam shader
   carries three's tonemapping/encodings includes -- they are no-ops when
   rendering into a linear target and live when rendering to the canvas. */
const ACES_SHADER={
  uniforms:{tDiffuse:{value:null},exposure:{value:1.0},air:{value:0.0}},
  vertexShader:[
  'varying vec2 vUv;',
  'void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 ); }'
  ].join('\n'),
  fragmentShader:[
  'uniform sampler2D tDiffuse;','uniform float exposure;','uniform float air;',
  'varying vec2 vUv;',
  'vec3 aces( vec3 x ){',
  '  return clamp( ( x * ( 2.51 * x + 0.03 ) ) / ( x * ( 2.43 * x + 0.59 ) + 0.14 ), 0.0, 1.0 );',
  '}',
  'vec3 srgb( vec3 c ){',
  '  vec3 hi = 1.055 * pow( max( c, vec3( 0.0 ) ), vec3( 0.41666 ) ) - 0.055;',
  '  return mix( hi, c * 12.92, vec3( lessThanEqual( c, vec3( 0.0031308 ) ) ) );',
  '}',
  'void main(){',
  '  vec3 c = texture2D( tDiffuse, vUv ).rgb;',
  '  c += air * vec3( 0.004, 0.005, 0.009 );',
  '  gl_FragColor = vec4( srgb( aces( c * exposure ) ), 1.0 );',
  '}'].join('\n')};

const GAIN={par:1.05,up:0.92,head:1.45,strobe:1.30};   // beam brightness per kind
/* AUTO-EXPOSURE. The old chain raised exposure with brightness (1.05 + 0.35*haze
   + 0.30*strobe), multiplied a 2.30 strobe gain, and fed a bloom at strength
   1.135 -- so a drop went pure white and nothing was judgeable. A camera in a
   club stops down. `load` is the frame's own emitted light, so this is still a
   pure function of t with no state. */
function frameLoad(f){
  let sum=0,n=0;
  for(let i=0;i<f.fixtures.length;i++){const o=f.fixtures[i];
    if(o.id==='fog_1') continue;
    if('level' in o){sum+=o.level;n++}
    else if(o.pixels){let m=0;for(let j=0;j<o.pixels.length;j++){
      const q=o.pixels[j];m=Math.max(m,(q[0]+q[1]+q[2])/765)} sum+=m;n++}}
  return n?sum/n:0}
const CORE={par:5.0,up:6.0,head:9.0,strobe:4.0};       // core exponent: tighter beam, tighter core
const POOLK={par:0.24,head:0.40,strobe:0.20};   // was a carpet, not light on a floor
const MIRROR=0.30;                                     // the floor's share
let GL=null,GLTRIED=false,GLSTRIKE=0;

function sRGBtoLin(x){return x<=0.04045?x/12.92:Math.pow((x+0.055)/1.055,2.4)}

function radialTex(T3,p){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const x=c.getContext('2d');
  const gr=x.createRadialGradient(64,64,0,64,64,64);
  for(let i=0;i<=12;i++){const u=i/12;
    gr.addColorStop(u,'rgba(255,255,255,'+Math.pow(1-u,p).toFixed(4)+')')}
  x.fillStyle=gr;x.fillRect(0,0,128,128);
  const t=new T3.CanvasTexture(c);
  t.minFilter=T3.LinearFilter;t.magFilter=T3.LinearFilter;
  t.wrapS=t.wrapT=T3.ClampToEdgeWrapping;
  return t}
/* the back-wall wash: brightest at the skirting, fading up, with a soft edge
   sideways. Painted once into a 64px alpha map rather than another shader. */
function washTex(T3){
  const N=64,c=document.createElement('canvas'); c.width=c.height=N;
  const x=c.getContext('2d'),d=x.createImageData(N,N);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){
    const u=(i+0.5)/N, v=(j+0.5)/N;                     // row 0 is the top of the plane
    const hv=Math.exp(-Math.pow((u-0.5)*2.5,2)*2.0);
    const vv=0.10*v+0.90*Math.pow(v,2.4);
    const a=Math.max(0,Math.min(1,hv*vv));
    const k=(j*N+i)*4;
    d.data[k]=255;d.data[k+1]=255;d.data[k+2]=255;d.data[k+3]=Math.round(a*255)}
  x.putImageData(d,0,0);
  const t=new T3.CanvasTexture(c);
  t.minFilter=T3.LinearFilter;t.magFilter=T3.LinearFilter;
  t.wrapS=t.wrapT=T3.ClampToEdgeWrapping;
  return t}

/* cone opening along +Y: apex at y=0, mouth of radius 1 at y=1, so a beam is
   position = the lamp, quaternion = +Y onto the aim direction, scale =
   (radius, length, radius). One geometry for all of them. */
function coneGeom(T3,rs,hs){
  const gm=new T3.CylinderGeometry(1,0.085,1,rs,hs,true);
  gm.translate(0,0.5,0);
  return gm}

/* 24 segments as one geometry: a face toward the room and a face toward the
   ceiling, so the strips read from eye level and from above. Colour lives in a
   vertex attribute, which is unclamped, so a segment can be brighter than white
   and bloom. The mirrored copy shares the attribute and gets it for free. */
function stripGeom(T3,id){
  const f=LAYOUT.fixtures.find(x=>x.id===id), y=f.at[1], z=f.at[2], n=NPXof(id);
  const pos=new Float32Array(n*12*3), col=new Float32Array(n*12*3);
  const yb=y-0.012, yt=y+0.030, z0=z-0.022, z1=z+0.022;
  let k=0;
  const put=(a,b,c)=>{pos[k++]=a;pos[k++]=b;pos[k++]=c};
  for(let i=0;i<n;i++){
    const x0=0.25+(ROOM.w-0.5)*i/n, x1=0.25+(ROOM.w-0.5)*(i+1)/n;
    put(x0,yb,z0);put(x1,yb,z0);put(x1,yt,z0);
    put(x0,yb,z0);put(x1,yt,z0);put(x0,yt,z0);
    put(x0,yt,z0);put(x1,yt,z0);put(x1,yt,z1);
    put(x0,yt,z0);put(x1,yt,z1);put(x0,yt,z1)}
  const gm=new T3.BufferGeometry();
  gm.setAttribute('position',new T3.BufferAttribute(pos,3));
  const ca=new T3.BufferAttribute(col,3);
  gm.setAttribute('color',ca);
  return {geom:gm,attr:ca,col:col,n:n}}

function initGL(){
  GLTRIED=true;
  const T3=window.THREE;
  const w0=Math.max(1,CWv||1000), h0=Math.max(1,CHv||600);

  const R=new T3.WebGLRenderer({canvas:cv,antialias:true,alpha:false,stencil:false,
    powerPreference:'high-performance',preserveDrawingBuffer:true});
  R.setClearColor(0x000000,1);
  R.outputEncoding=T3.sRGBEncoding;
  R.toneMapping=T3.NoToneMapping;       // the composer's last pass tone maps instead
  R.toneMappingExposure=1.0;
  R.setPixelRatio(DPR);
  R.setSize(w0,h0,false);

  const SC=new T3.Scene();
  const CM=new T3.PerspectiveCamera(VIEWS[0].fov,w0/h0,0.05,90);

  /* four transparent layers, in this order: the floor's reflection, the floor
     glass over it, then everything that emits. Three sorts the transparent list
     by a Group's renderOrder before anything else, which is the whole trick --
     the semi-opaque floor is what dims the reflection, so it has to be drawn
     between the two. Nothing in these layers writes depth. */
  const gOp=new T3.Group(); gOp.renderOrder=0;
  const gMi=new T3.Group(); gMi.renderOrder=1; gMi.scale.set(1,-1,1);
  const gFl=new T3.Group(); gFl.renderOrder=2;
  const gAd=new T3.Group(); gAd.renderOrder=3;
  SC.add(gOp); SC.add(gMi); SC.add(gFl); SC.add(gAd);

  /* ---- the room. Walls face inwards and are single-sided, so the three
     cameras that stand outside the box see straight through them. ---- */
  const PL=new T3.PlaneGeometry(1,1);
  const MAT_WALL=new T3.MeshBasicMaterial({color:0x000103,side:T3.FrontSide});
  const MAT_CEIL=new T3.MeshBasicMaterial({color:0x000104,side:T3.FrontSide});
  function panel(mat,w,h,px,py,pz,rx,ry){
    const m=new T3.Mesh(PL,mat);
    m.scale.set(w,h,1); m.position.set(px,py,pz); m.rotation.set(rx,ry,0);
    gOp.add(m); return m}
  panel(MAT_WALL,ROOM.w,ROOM.h,ROOM.w/2,ROOM.h/2,ROOM.d,0,Math.PI);        // back wall
  panel(MAT_WALL,14,ROOM.h,0,ROOM.h/2,2.0,0,Math.PI/2);                    // left
  panel(MAT_WALL,14,ROOM.h,ROOM.w,ROOM.h/2,2.0,0,-Math.PI/2);              // right
  panel(MAT_CEIL,ROOM.w+2,14,ROOM.w/2,ROOM.h,2.0,Math.PI/2,0);             // ceiling

  const MAT_FLOOR=new T3.MeshBasicMaterial({color:0x010208,transparent:true,opacity:0.34,
    depthWrite:false,side:T3.DoubleSide});
  const floor=new T3.Mesh(PL,MAT_FLOOR);
  floor.scale.set(20,18,1); floor.position.set(4,0,1); floor.rotation.x=-Math.PI/2;
  floor.renderOrder=2; gFl.add(floor);

  /* ---- truss: a tube per hang height, on two drop rods. Barely there. ---- */
  const MAT_TRUSS=new T3.MeshBasicMaterial({color:0x020305});   // was reading as grey scaffolding
  const TUBE=new T3.CylinderGeometry(0.042,0.042,1,8,1,false);
  const ROD=new T3.CylinderGeometry(0.012,0.012,1,5,1,false);
  function trussAt(y,z){
    const m=new T3.Mesh(TUBE,MAT_TRUSS);
    m.scale.set(1,ROOM.w-0.5,1); m.rotation.z=Math.PI/2;
    m.position.set(ROOM.w/2,y,z); gOp.add(m);
    [0.42,ROOM.w-0.42].forEach(function(x){
      const hh=Math.max(0.02,ROOM.h-y), r=new T3.Mesh(ROD,MAT_TRUSS);
      r.scale.set(1,hh,1); r.position.set(x,y+hh/2,z); gOp.add(r)})}
  Object.keys(TRUSS).forEach(function(z){trussAt(TRUSS[z],+z)});
  trussAt(2.90,5.20);

  /* ---- the crowd: two instanced meshes, near-black, bobbing on the bar
     clock. This is what makes the picture a room instead of a diagram. ---- */
  const CN=36;
  const CB=new T3.CylinderGeometry(0.165,0.115,1,11,1,false); CB.translate(0,0.5,0);
  const CH_=new T3.SphereGeometry(0.115,8,6);
  const MAT_CROWD=new T3.MeshBasicMaterial({color:0x000000});   // linear, and it must be 0
  const cbody=new T3.InstancedMesh(CB,MAT_CROWD,CN);
  const chead=new T3.InstancedMesh(CH_,MAT_CROWD,CN);
  cbody.frustumCulled=false; chead.frustumCulled=false;
  gOp.add(cbody); gOp.add(chead);
  const PEOPLE=[];
  (function(){let s=7;const rnd=function(){s=(s*16807)%2147483647;return s/2147483647};
    for(let i=0;i<CN;i++){
      const u=rnd();
      PEOPLE.push({x:0.30+rnd()*7.4,
        // bias depth AWAY from the camera: u^0.55 puts more of the crowd further
        // back, so they get smaller and the front row stops being a fence
        z:0.55+Math.pow(u,0.55)*4.15,
        h:1.52+rnd()*0.34, w:0.80+rnd()*0.46, ph:rnd()})}})();

  /* ---- beams. One geometry, one program; per fixture only a transform and
     three uniforms change. The mirrored twin copies the same local transform
     into a group scaled by -1 in y, which is an exact reflection. ---- */
  const coneHi=coneGeom(T3,28,6), coneLo=coneGeom(T3,12,2);
  const beams={};
  function mkBeam(id,core){
    const mk=function(host,c0){
      const u={uColor:{value:new T3.Color(1,1,1)},uI:{value:0},uD:{value:0.5},
               uCore:{value:c0}};
      const mat=new T3.ShaderMaterial({uniforms:u,vertexShader:BEAM_VS,fragmentShader:BEAM_FS,
        transparent:true,depthWrite:false,depthTest:true,side:T3.DoubleSide,
        blending:T3.AdditiveBlending});
      const m=new T3.Mesh(coneHi,mat);
      m.frustumCulled=false; m.visible=false; m.renderOrder=3; host.add(m);
      return {m:m,u:u}};
    const a=mk(gAd,core), b=mk(gMi,core);
    beams[id]={m:a.m,u:a.u,mm:b.m,mu:b.u}}

  const DISC=new T3.CircleGeometry(1,30);
  const RAD=radialTex(T3,2.2), WASH=washTex(T3);
  const pools={},lens={},washes={};
  function mkPool(id){
    const mat=new T3.MeshBasicMaterial({map:RAD,color:new T3.Color(0,0,0),transparent:true,
      depthWrite:false,side:T3.DoubleSide,blending:T3.AdditiveBlending});
    const m=new T3.Mesh(DISC,mat);
    m.rotation.x=-Math.PI/2; m.position.set(0,0.012,0);
    m.frustumCulled=false; m.visible=false; m.renderOrder=3; gAd.add(m);
    pools[id]=m}
  function mkLens(id,s){
    const mat=new T3.SpriteMaterial({map:RAD,color:new T3.Color(0,0,0),transparent:true,
      depthWrite:false,blending:T3.AdditiveBlending});
    const sp=new T3.Sprite(mat);
    sp.scale.set(s,s,1); sp.position.set(POS[id][0],POS[id][1],POS[id][2]);
    sp.renderOrder=3; gAd.add(sp); lens[id]=sp}
  function mkWash(id){
    const mat=new T3.MeshBasicMaterial({map:WASH,color:new T3.Color(0,0,0),transparent:true,
      depthWrite:false,side:T3.DoubleSide,blending:T3.AdditiveBlending});
    const m=new T3.Mesh(PL,mat);
    m.scale.set(2.6,ROOM.h,1); m.position.set(POS[id][0],ROOM.h/2,ROOM.d-0.015);
    m.rotation.y=Math.PI; m.frustumCulled=false; m.renderOrder=3; gAd.add(m);
    washes[id]=m}

  /* ---- fixture bodies: dark cans, plus an additive lens flare that carries
     the fixture's own colour. ---- */
  const MAT_BODY=new T3.MeshBasicMaterial({color:0x090c12});
  const G_CAN=new T3.CylinderGeometry(0.085,0.105,0.20,10,1,false);
  const G_HEAD=new T3.BoxGeometry(0.15,0.21,0.15);
  const G_STROBE=new T3.BoxGeometry(0.34,0.11,0.13);
  const G_UP=new T3.BoxGeometry(0.15,0.15,0.15);
  const _bq=new T3.Quaternion(), _bv=new T3.Vector3(), _by=new T3.Vector3(0,1,0);
  function can(id,gm,aim){
    const m=new T3.Mesh(gm,MAT_BODY);
    m.position.set(POS[id][0],POS[id][1],POS[id][2]);
    if(aim){const p=POS[id];
      _bv.set(aim[0]-p[0],aim[1]-p[1],aim[2]-p[2]).normalize();
      _bq.setFromUnitVectors(_by,_bv); m.quaternion.copy(_bq)}
    gOp.add(m); return m}

  R_PARS.forEach(function(id){mkBeam(id,CORE.par);mkPool(id);mkLens(id,0.30);
    can(id,G_CAN,PAR_AIM[id])});
  R_UPS.forEach(function(id){mkBeam(id,CORE.up);mkLens(id,0.22);mkWash(id);
    can(id,G_UP,null)});
  R_HEADS.forEach(function(id){mkBeam(id,CORE.head);mkPool(id);mkLens(id,0.24);
    can(id,G_HEAD,null)});
  R_STROBES.forEach(function(id){mkBeam(id,CORE.strobe);mkPool(id);mkLens(id,0.42);
    can(id,G_STROBE,null)});

  /* ---- strips ---- */
  const MAT_STRIP=new T3.MeshBasicMaterial({vertexColors:true,transparent:true,
    depthWrite:false,side:T3.DoubleSide,blending:T3.AdditiveBlending});
  const MAT_STRIP_M=new T3.MeshBasicMaterial({vertexColors:true,transparent:true,
    depthWrite:false,side:T3.DoubleSide,blending:T3.AdditiveBlending,
    color:new T3.Color(MIRROR,MIRROR,MIRROR)});
  const strips={};
  R_STRIPS.forEach(function(id){
    const s=stripGeom(T3,id);
    const m=new T3.Mesh(s.geom,MAT_STRIP); m.frustumCulled=false; m.renderOrder=3; gAd.add(m);
    const mm=new T3.Mesh(s.geom,MAT_STRIP_M); mm.frustumCulled=false; mm.renderOrder=1; gMi.add(mm);
    strips[id]=s});

  /* ---- composer: linear half-float buffer -> bloom -> ACES + sRGB.
     The buffer is a little larger than the canvas on 1x displays, which the
     final pass resolves back down; cheap supersampling, no extra script. ---- */
  let composer=null,bloom=null,aces=null,SS=(DPR>1.5?1.0:1.3);
  try{
    const pw=Math.max(1,Math.round(w0*DPR*SS)), ph=Math.max(1,Math.round(h0*DPR*SS));
    const rt=new T3.WebGLRenderTarget(pw,ph,{minFilter:T3.LinearFilter,magFilter:T3.LinearFilter,
      format:T3.RGBAFormat,type:T3.HalfFloatType,depthBuffer:true,stencilBuffer:false});
    composer=new T3.EffectComposer(R,rt);
    composer.addPass(new T3.RenderPass(SC,CM));
    bloom=new T3.UnrealBloomPass(new T3.Vector2(pw,ph),0.58,0.70,0.92);
    try{[bloom.renderTargetBright].concat(bloom.renderTargetsHorizontal,
      bloom.renderTargetsVertical).forEach(function(x){x.texture.type=T3.HalfFloatType})}catch(e){}
    composer.addPass(bloom);
    aces=new T3.ShaderPass(ACES_SHADER);
    composer.addPass(aces);
  }catch(e){console.error('bloom unavailable',e);composer=null;bloom=null;aces=null}

  GL={T3:T3,r:R,scene:SC,cam:CM,gOp:gOp,gMi:gMi,gFl:gFl,gAd:gAd,
      coneHi:coneHi,coneLo:coneLo,beams:beams,pools:pools,lens:lens,washes:washes,
      strips:strips,cbody:cbody,chead:chead,people:PEOPLE,crowdN:CN,
      composer:composer,bloom:bloom,aces:aces,ss:SS,qual:-1,map:{},
      q:new T3.Quaternion(),d:new T3.Vector3(),up:new T3.Vector3(0,1,0),
      c:new T3.Color(),m4:new T3.Matrix4(),p3:new T3.Vector3(),s3:new T3.Vector3(1,1,1),
      idq:new T3.Quaternion(),end:{x:0,y:0,z:0,r:0}};
  applyQual();
  try{cv.addEventListener('webglcontextlost',function(ev){ev.preventDefault();
    to2D('webgl context lost')},false)}catch(e){}
  if(!composer) note('bloom off — postprocessing unavailable');
}

function applyQual(){
  if(!GL) return;
  const T3=GL.T3;
  GL.qual=QUAL;
  const gm=QUAL?GL.coneHi:GL.coneLo;
  for(const id in GL.beams){const B=GL.beams[id];B.m.geometry=gm;B.mm.geometry=gm}
  if(GL.bloom) GL.bloom.enabled=!!QUAL;
  const n=QUAL?GL.crowdN:Math.max(8,Math.round(GL.crowdN*0.45));
  GL.cbody.count=n; GL.chead.count=n;
  try{GL.r.toneMapping=(QUAL&&GL.composer)?T3.NoToneMapping:T3.ACESFilmicToneMapping}catch(e){}}

function fitGL(){
  if(!GL) return;
  GL.r.setPixelRatio(DPR);
  GL.r.setSize(Math.max(1,CWv),Math.max(1,CHv),false);
  GL.cam.aspect=Math.max(0.2,CWv/Math.max(1,CHv));
  GL.cam.updateProjectionMatrix();
  if(GL.composer){
    const pw=Math.max(1,Math.round(CWv*DPR*GL.ss)), ph=Math.max(1,Math.round(CHv*DPR*GL.ss));
    GL.composer.setSize(pw,ph)}}

function camApply(t){
  const V=VIEWS[VIEW]||VIEWS[0];
  let ex=V.eye[0],ey=V.eye[1],ez=V.eye[2];
  if(DRIFT){ex+=0.26*Math.sin(t*0.094);ey+=0.10*Math.sin(t*0.067+1.1);
            ez+=0.16*Math.sin(t*0.053+2.2)}
  GL.cam.position.set(ex,ey,ez);
  GL.cam.lookAt(V.at[0],V.at[1],V.at[2]);
  if(GL.cam.fov!==V.fov){GL.cam.fov=V.fov;GL.cam.updateProjectionMatrix()}}

/* stop a beam at the first wall it meets, so nothing shoots out of the room */
function beamLen(sx,sy,sz,dx,dy,dz,len){
  let L=len;
  const lim=function(p,d,lo,hi){
    if(d>1e-6){const q=(hi-p)/d;if(q<L)L=q}
    else if(d<-1e-6){const q=(lo-p)/d;if(q<L)L=q}};
  lim(sx,dx,-0.05,ROOM.w+0.05);
  lim(sy,dy,-0.05,ROOM.h+0.05);
  lim(sz,dz,-0.05,ROOM.d+0.05);
  return Math.max(0.06,L)}

function setBeam(id,src,aim,cr,cg,cb,I,half,dens){
  const B=GL.beams[id]; if(!B) return null;
  let dx=aim[0]-src[0],dy=aim[1]-src[1],dz=aim[2]-src[2];
  let len=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(I<0.004||len<0.06){B.m.visible=false;B.mm.visible=false;return null}
  dx/=len;dy/=len;dz/=len;
  len=beamLen(src[0],src[1],src[2],dx,dy,dz,len);
  const rad=Math.max(0.02,len*Math.tan(half));
  GL.q.setFromUnitVectors(GL.up,GL.d.set(dx,dy,dz));
  GL.c.setRGB(cr/255,cg/255,cb/255).convertSRGBToLinear();
  B.m.visible=true;
  B.m.position.set(src[0],src[1],src[2]);
  B.m.quaternion.copy(GL.q);
  B.m.scale.set(rad,len,rad);
  B.u.uColor.value.copy(GL.c); B.u.uI.value=I; B.u.uD.value=dens;
  B.mm.visible=true;
  B.mm.position.copy(B.m.position); B.mm.quaternion.copy(GL.q); B.mm.scale.copy(B.m.scale);
  B.mu.uColor.value.copy(GL.c); B.mu.uI.value=I*MIRROR; B.mu.uD.value=dens*0.9;
  const e=GL.end;
  e.x=src[0]+dx*len; e.y=src[1]+dy*len; e.z=src[2]+dz*len; e.r=rad;
  return e}

function setPool(id,e,cr,cg,cb,I){
  const m=GL.pools[id]; if(!m) return;
  if(!e||I<0.004){m.visible=false;return}
  const grounded=1-Math.min(1,Math.max(0,(e.y-0.05)/0.65));
  const q=I*grounded;
  if(q<0.004){m.visible=false;return}
  m.visible=true;
  m.position.set(e.x,0.012,e.z);
  const rr=Math.max(0.22,e.r*1.9);
  m.scale.set(rr,rr,1);
  GL.c.setRGB(cr/255,cg/255,cb/255).convertSRGBToLinear();
  m.material.color.setRGB(GL.c.r*q,GL.c.g*q,GL.c.b*q)}

function setLens(id,cr,cg,cb,I){
  const sp=GL.lens[id]; if(!sp) return;
  if(I<0.004){sp.visible=false;return}
  sp.visible=true;
  GL.c.setRGB(cr/255,cg/255,cb/255).convertSRGBToLinear();
  sp.material.color.setRGB(GL.c.r*I,GL.c.g*I,GL.c.b*I)}

function setWash(id,cr,cg,cb,I){
  const m=GL.washes[id]; if(!m) return;
  if(I<0.004){m.visible=false;return}
  m.visible=true;
  GL.c.setRGB(cr/255,cg/255,cb/255).convertSRGBToLinear();
  m.material.color.setRGB(GL.c.r*I,GL.c.g*I,GL.c.b*I)}

function setStrip(id,px){
  const S=GL.strips[id]; if(!S||!px) return;
  const col=S.col, n=Math.min(S.n,px.length), K=1.35;
  for(let i=0;i<n;i++){
    const c=px[i]||[0,0,0];
    const r=sRGBtoLin(c[0]/255)*K, g2=sRGBtoLin(c[1]/255)*K, b=sRGBtoLin(c[2]/255)*K;
    const base=i*36;
    for(let k=0;k<12;k++){const o=base+k*3;col[o]=r;col[o+1]=g2;col[o+2]=b}}
  S.attr.needsUpdate=true}

function crowdGL(t,e){
  const P=GL.people, n=GL.cbody.count, amp=0.055*(0.35+0.95*e);
  for(let i=0;i<n;i++){
    const p=P[i];
    const bob=amp*(0.5+0.5*Math.sin(2*Math.PI*(t/(2*BAR))+p.ph*6.283));
    const hb=p.h-0.22;
    GL.p3.set(p.x,bob,p.z); GL.s3.set(p.w,hb,p.w);
    GL.m4.compose(GL.p3,GL.idq,GL.s3); GL.cbody.setMatrixAt(i,GL.m4);
    GL.p3.set(p.x,bob+p.h-0.115,p.z); GL.s3.set(p.w,p.w,p.w);
    GL.m4.compose(GL.p3,GL.idq,GL.s3); GL.chead.setMatrixAt(i,GL.m4)}
  GL.cbody.instanceMatrix.needsUpdate=true;
  GL.chead.instanceMatrix.needsUpdate=true}

function drawRoomGL(f){
  const t=f.t, hz=hazeAt(t), e=en(t);
  window.__haze=hz;
  if(QUAL!==GL.qual) applyQual();
  camApply(t);
  const G=GL.map, F=f.fixtures;
  for(let i=0;i<F.length;i++) G[F[i].id]=F[i];
  const dens=0.34+0.66*hz;
  let sf=0;

  for(let i=0;i<R_PARS.length;i++){const id=R_PARS[i],o=get(id);
    const I=Math.pow(cl(o.level),0.80)*GAIN.par;
    const end=setBeam(id,POS[id],PAR_AIM[id],o.r,o.g,o.b,I,HALF.par,dens);
    setPool(id,end,o.r,o.g,o.b,I*POOLK.par);
    setLens(id,o.r,o.g,o.b,I*0.45)}

  for(let i=0;i<R_UPS.length;i++){const id=R_UPS[i],o=get(id);
    const I=Math.pow(cl(o.level),0.80)*GAIN.up;
    setBeam(id,POS[id],UP_AIM[id],o.r,o.g,o.b,I,HALF.uplight,dens);
    setWash(id,o.r,o.g,o.b,I*1.30);
    setLens(id,o.r,o.g,o.b,I*0.40)}

  for(let i=0;i<R_HEADS.length;i++){const id=R_HEADS[i],o=get(id);
    let lv=cl(o.level);
    if(o.strobe>0) lv*=chop(t,o.strobe,0.45,0.06);
    const I=Math.pow(lv,0.80)*GAIN.head;
    const end=setBeam(id,POS[id],headAim(id,o.pan,o.tilt),o.r,o.g,o.b,I,HALF.head,dens);
    setPool(id,end,o.r,o.g,o.b,I*POOLK.head);
    setLens(id,o.r,o.g,o.b,I*0.55)}

  for(let i=0;i<R_STROBES.length;i++){const id=R_STROBES[i],o=get(id);
    const on=o.strobe>0?o.level*chop(t,o.strobe,0.42,0.03):o.level;
    if(on>sf) sf=on;
    const I=Math.pow(cl(on),0.80)*GAIN.strobe;
    const end=setBeam(id,POS[id],STROBE_AIM[id],255,252,246,I,HALF.strobe,dens);
    setPool(id,end,255,252,246,I*POOLK.strobe);
    setLens(id,255,252,246,I*0.60)}

  for(let i=0;i<R_STRIPS.length;i++){const id=R_STRIPS[i];setStrip(id,get(id).pixels)}

  crowdGL(t,e);
  window.__sf=sf;
  fogChip(!!(get('fog_1')&&get('fog_1').level>0));

  const load=frameLoad(f);
  const ex=(1.28+0.18*hz)/(1.0+1.05*load);
  GL.r.toneMappingExposure=ex;
  if(QUAL&&GL.composer){
    if(GL.bloom) GL.bloom.strength=0.46+0.26*hz;
    if(GL.aces){GL.aces.uniforms.exposure.value=ex;GL.aces.uniforms.air.value=hz}
    GL.composer.render();
  }else{
    GL.r.setRenderTarget(null);
    GL.r.render(GL.scene,GL.cam)}}

function fit(){
  const st=document.getElementById('stage');
  CWv=st.clientWidth||1000; CHv=st.clientHeight||Math.round(CWv*0.585);
  if(RMODE==='gl') fitGL(); else if(RMODE==='2d') fit2D()}
new ResizeObserver(function(){fit();if(typeof render==='function')render()})
  .observe(document.getElementById('stage'));
function fullscreen(){const st=document.getElementById('stage');
  if(document.fullscreenElement) document.exitFullscreen();
  else if(st.requestFullscreen) st.requestFullscreen();
  else if(st.webkitRequestFullscreen) st.webkitRequestFullscreen()}

function setView(i){VIEW=i;[0,1,2,3].forEach(j=>{const b=$('#v'+j);if(b)b.classList.toggle('on',i===j)});
  CAM={...VIEWS[i]};
  if(typeof render==='function')render()}
let ROOMJS=true;
function drawRoom(f){
  if(RMODE==='gl'){
    try{drawRoomGL(f);GLSTRIKE=0}
    catch(err){
      console.error(err);
      /* degrade a step at a time: drop postprocessing first, and only give up
         on WebGL entirely if the plain path is broken too */
      GLSTRIKE++;
      if(GLSTRIKE===3&&GL&&GL.composer){GL.composer=null;GL.qual=-1;
        note('bloom off — postprocessing failed')}
      else if(GLSTRIKE>5) to2D('webgl render failed — 2D fallback')}
    return}
  if(RMODE==='2d'){
    const LR=(typeof window!=='undefined')&&window.LimelightRoom;
    if(ROOMJS&&LR&&LR.drawRoom){
      try{ LR.drawRoom(cv,f,LAYOUT); window.__haze=hazeAt(f.t); return }
      catch(err){ ROOMJS=false; console.error(err); note('room.js failed — built-in 2D') }
    }
    drawRoom2D(f);return}
  window.__haze=hazeAt(f.t)}          // still loading: the HUD keeps working

/* ---------- choosing a renderer ---------- */
function to2D(why){
  if(RMODE==='2d') return;
  RMODE='2d';
  try{if(GL&&GL.r)GL.r.dispose()}catch(e){}
  GL=null;
  /* a canvas cannot hand back a 2D context once WebGL has had it, so if we got
     as far as making a context we draw into a fresh canvas over the top and
     point `cv` -- the surface snap() saves -- at that instead */
  try{
    if(GLTRIED&&cv&&cv.parentNode){
      const n=document.createElement('canvas');
      n.id='room2d';
      n.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;display:block;z-index:1';
      cv.style.display='none';
      cv.parentNode.insertBefore(n,cv);
      cv=n}
  }catch(e){}
  init2D();
  note(why);
  fit();
  try{if(typeof render==='function')render()}catch(e){console.error(e)}}

let BOOTED=false;
function boot(why){
  if(BOOTED) return; BOOTED=true;
  let bad=null;
  const T3=window.THREE;
  if(!T3||!T3.WebGLRenderer)
    bad=(why==='slow')?'three.js did not load in time — 2D fallback'
                      :'three.js did not load — 2D fallback';
  else{
    const miss=['EffectComposer','RenderPass','ShaderPass','UnrealBloomPass','CopyShader',
                'LuminosityHighPassShader'].filter(function(k){return !T3[k]});
    if(miss.length) bad='missing '+miss[0]+' — 2D fallback'}
  if(!bad){
    try{
      const probe=document.createElement('canvas').getContext('webgl2');
      if(!probe) bad='no webgl2 — 2D fallback';
      else{const x=probe.getExtension('WEBGL_lose_context'); if(x)x.loseContext()}
    }catch(e){bad='no webgl2 — 2D fallback'}}
  if(bad){to2D(bad);return}
  try{initGL();RMODE='gl'}
  catch(e){console.error(e);to2D('webgl init failed — 2D fallback');return}
  fit();
  try{if(typeof render==='function')render()}
  catch(e){console.error(e);to2D('webgl render failed — 2D fallback')}}

(function loadCDN(){
  let gi=0;
  const nextGroup=function(){
    if(gi>=CDN_FILES.length){boot('');return}
    const list=CDN_FILES[gi++];
    let left=list.length;
    const step=function(){if(--left===0) nextGroup()};
    list.forEach(function(p){
      const s=document.createElement('script');
      s.src=CDN+p; s.async=false; s.onload=step; s.onerror=step;
      document.head.appendChild(s)})};
  setTimeout(function(){if(!BOOTED)boot('slow')},9000);   // a hung CDN falls back too
  nextGroup()})();



/* A venue switch changes which fixtures exist; these lists were built once. */
function rendererReset(){
  POS={}; LAYOUT.fixtures.forEach(f=>{POS[f.id]=[f.at[0],f.at[1],f.at[2]]});
  R_PARS=OF('par'); R_UPS=OF('uplight'); R_HEADS=OF('head').concat(OF('wash'));
  R_STROBES=OF('strobe').concat(OF('blinder')); R_STRIPS=OF('strip');
  PAR_AIM={}; R_PARS.forEach(function(id){const p=POS[id];
    PAR_AIM[id]=[p[0]+(ROOM.w/2-p[0])*0.32,0,Math.max(0.9,p[2]-3.6)]});
  ROOM.w=LAYOUT.size_m.w; ROOM.h=LAYOUT.size_m.h; ROOM.d=LAYOUT.size_m.d;

/* ================= renderer: SKY =================
   Drones are points of light against black, which is a much easier thing to draw
   convincingly than volumetric beams -- an additive glow per drone, sorted back
   to front, is most of the way there. */
const skyCv=$('#sky'), sx=skyCv.getContext('2d');
let SW=0,SH=0;
const SKYVIEWS=[{eye:[0,4,-150],at:[0,42,0],fov:38},
                {eye:[-118,16,-86],at:[0,44,0],fov:40},
                {eye:[0,132,-30],at:[0,30,0],fov:52},
                {eye:[0,6,-72],at:[0,50,0],fov:56}];
function skyFit(){SW=window.innerWidth;SH=window.innerHeight;
  const d=Math.min(2,window.devicePixelRatio||1);
  skyCv.width=SW*d;skyCv.height=SH*d;sx.setTransform(d,0,0,d,0,0)}
function sproj(p,cam){
  const f=[cam.at[0]-cam.eye[0],cam.at[1]-cam.eye[1],cam.at[2]-cam.eye[2]];
  const fl=Math.hypot(f[0],f[1],f[2]), fz=[f[0]/fl,f[1]/fl,f[2]/fl];
  let rx=[fz[2],0,-fz[0]]; const rl=Math.hypot(rx[0],rx[1],rx[2])||1;
  rx=[rx[0]/rl,0,rx[2]/rl];
  const uy=[rx[1]*fz[2]-rx[2]*fz[1],rx[2]*fz[0]-rx[0]*fz[2],rx[0]*fz[1]-rx[1]*fz[0]];
  const d=[p[0]-cam.eye[0],p[1]-cam.eye[1],p[2]-cam.eye[2]];
  const z=d[0]*fz[0]+d[1]*fz[1]+d[2]*fz[2]; if(z<=0.5) return null;
  const x=d[0]*rx[0]+d[1]*rx[1]+d[2]*rx[2], y=d[0]*uy[0]+d[1]*uy[1]+d[2]*uy[2];
  const k=(SH*0.5)/Math.tan(cam.fov*Math.PI/360);
  return {x:SW/2+k*x/z, y:SH/2-k*y/z, z:z, s:k/z}}
function drawSky(f){
  const t=f.t;
  let cam={...SKYVIEWS[VIEW%SKYVIEWS.length]};
  if(DRIFT){cam.eye=[cam.eye[0]+7*Math.sin(t*0.045),cam.eye[1]+2.5*Math.sin(t*0.031+1.1),cam.eye[2]]}
  const g=sx.createLinearGradient(0,0,0,SH);
  g.addColorStop(0,'#020306');g.addColorStop(0.62,'#04060c');g.addColorStop(1,'#070a12');
  sx.fillStyle=g;sx.fillRect(0,0,SW,SH);
  // a horizon and a hint of ground, so altitude reads
  const h=sproj([0,0,0],cam);
  if(h){sx.fillStyle='rgba(255,255,255,.022)';sx.fillRect(0,h.y,SW,SH-h.y);
    sx.fillStyle='rgba(255,255,255,.06)';sx.fillRect(0,h.y,SW,1)}
  const pts=[];
  for(const d of f.drones){const q=sproj([d.x,d.y,d.z],cam); if(q) pts.push([q,d])}
  pts.sort((a,b)=>b[0].z-a[0].z);
  sx.globalCompositeOperation='lighter';
  for(const [q,d] of pts){
    const lv=Math.pow(d.level,1/1.6); if(lv<0.004) continue;
    /* A drone ninety metres away is a POINT. The radius must be a small pixel
       size that falls off with distance, not the raw projection scale -- that
       gave 38 px cores and 340 px glows, and a hundred and twenty of them
       additively is a sun. And the per-drone alpha has to be low enough that a
       dense formation stays a swarm rather than a white mass. */
    const R=Math.max(1.1,Math.min(5.0, 190/q.z));
    const GLOW=R*4.0;
    const gr=sx.createRadialGradient(q.x,q.y,0,q.x,q.y,GLOW);
    gr.addColorStop(0,'rgba('+d.r+','+d.g+','+d.b+','+(0.60*lv).toFixed(3)+')');
    gr.addColorStop(0.30,'rgba('+d.r+','+d.g+','+d.b+','+(0.16*lv).toFixed(3)+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    sx.fillStyle=gr;sx.beginPath();sx.arc(q.x,q.y,GLOW,0,7);sx.fill();
    sx.fillStyle='rgba('+d.r+','+d.g+','+d.b+','+(0.85*lv).toFixed(3)+')';
    sx.beginPath();sx.arc(q.x,q.y,R,0,7);sx.fill();
    if(lv>0.55){sx.fillStyle='rgba(255,255,255,'+(0.55*(lv-0.55)/0.45).toFixed(3)+')';
      sx.beginPath();sx.arc(q.x,q.y,R*0.5,0,7);sx.fill()}}
  sx.globalCompositeOperation='source-over';
  /* a soft ceiling: dim the whole frame back when a lot of drones are bright at
     once, which is the additive equivalent of stopping a camera down */
  const load=f.drones.reduce((a,d)=>a+d.level,0)/f.drones.length;
  if(load>0.42){sx.globalCompositeOperation='multiply';
    const k=Math.max(0.45,1-(load-0.42)*1.3);
    sx.fillStyle='rgba('+Math.round(255*k)+','+Math.round(255*k)+','+Math.round(255*k)+',1)';
    sx.fillRect(0,0,SW,SH);sx.globalCompositeOperation='source-over'}}
