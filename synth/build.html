<title>Limelight · build</title>
<style>
:root{--bg:#0f1117;--pan:#161a23;--raise:#1d222e;--rule:#252b39;--rule2:#333b4c;
      --ink:#e6e9f1;--mut:#8f98ad;--faint:#666c7e;--tung:#f0a93c;--good:#54c98a;--bad:#e8705a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 ui-sans-serif,system-ui,sans-serif;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--pan);
       border-bottom:1px solid var(--rule);flex:0 0 auto}
h1{font:600 13px ui-monospace,monospace;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--tung)}
select,button{background:var(--raise);color:var(--ink);border:1px solid var(--rule2);border-radius:4px;
        padding:4px 10px;font:12px ui-monospace,monospace;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.go{background:var(--good);color:#08210f;border-color:var(--good);font-weight:700}
button.no{background:transparent;color:var(--bad);border-color:var(--rule2)}
main{flex:1 1 0;display:flex;min-height:0}
#ladder{flex:0 0 268px;background:var(--pan);border-right:1px solid var(--rule);overflow:auto;padding:8px}
.rung{padding:8px 10px;border-radius:5px;border:1px solid transparent;margin-bottom:3px;cursor:pointer}
.rung:hover{background:var(--raise)}
.rung.now{background:var(--raise);border-color:var(--tung)}
.rung.done{opacity:.92}
.rung .t{font:600 12px ui-monospace,monospace;display:flex;justify-content:space-between;gap:6px}
.rung .d{color:var(--mut);font-size:11px;margin-top:2px;line-height:1.35}
.tick{color:var(--good)} .lock{color:var(--faint)} .cur{color:var(--tung)}
#work{flex:1 1 0;display:flex;flex-direction:column;min-width:0;padding:8px;gap:7px;overflow:hidden}
.pane{background:var(--pan);border:1px solid var(--rule);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;
    border-bottom:1px solid var(--rule);font:11px ui-monospace,monospace;color:var(--mut);
    letter-spacing:.05em;text-transform:uppercase;flex:0 0 auto}
canvas{display:block;width:100%}
#q{font-size:14px;color:var(--ink)} #q b{color:var(--tung)}
#howto{display:flex;gap:0;border-bottom:1px solid var(--rule);flex:0 0 auto}
#howto div{flex:1 1 0;padding:7px 11px;border-right:1px solid var(--rule);min-width:0}
#howto div:last-child{border-right:0}
#howto .k{color:var(--faint);font:10px ui-monospace,monospace;letter-spacing:.06em;
          text-transform:uppercase;margin-bottom:3px}
#howto .v{font-size:12px;line-height:1.4;color:var(--mut)}
#howto .ok .v{color:var(--good)} #howto .no .v{color:var(--bad)}
#parts{display:flex;gap:2px;padding:6px 8px;flex:0 0 auto;border-top:1px solid var(--rule)}
#parts .p{flex:1 1 0;min-width:0;border-radius:3px;padding:4px 5px;cursor:pointer;
          background:var(--raise);border:1px solid var(--rule2);overflow:hidden}
#parts .p.ok{border-color:#2c6b4a;background:#16241d}
#parts .p.no{border-color:#7a3b2f;background:#2a1815}
#parts .n{font:10px ui-monospace,monospace;color:var(--mut);white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
#parts .z{font:11px ui-monospace,monospace;font-weight:700}
#parts .p.ok .z{color:var(--good)} #parts .p.no .z{color:var(--bad)}
#verdict{font:12px ui-monospace,monospace}
.big{font-size:19px;font-weight:700}
footer{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--pan);
       border-top:1px solid var(--rule)}
audio{height:30px;flex:1 1 auto}
.note{color:var(--faint);font-size:11px}
input[type=text]{background:var(--raise);color:var(--ink);border:1px solid var(--rule2);
       border-radius:4px;padding:4px 8px;font:12px ui-sans-serif;flex:1 1 auto}
</style>

<header>
  <h1>build</h1>
  <select id="song"></select>
  <select id="map"></select>
  <label class="note">energy</label>
  <select id="drive"><option>low</option><option selected>medium</option><option>high</option></select>
  <label class="note">colour</label>
  <select id="pal"><option selected>garrix</option><option>garrix-red</option><option>sunset</option><option>ice</option><option>neon</option><option>amber</option></select>
  <span style="flex:1"></span>
  <span id="stat" class="note"></span>
</header>

<main>
  <div id="ladder"></div>
  <div id="work">
    <div class="pane" style="flex:0 0 auto">
      <div class="ph"><span id="q">—</span><span id="verdict">—</span></div>
      <div id="howto"></div>
      <canvas id="wave" style="height:96px"></canvas>
      <canvas id="light" style="height:104px"></canvas>
      <div id="parts"></div>
    </div>
    <div class="pane" style="flex:1 1 0">
      <div class="ph"><span>the rig · <span id="rigmeta"></span></span>
        <span><button id="zoomout">−</button> <button id="zoomin">+</button></span></div>
      <canvas id="rig" style="flex:1 1 0;min-height:0"></canvas>
    </div>
  </div>
</main>

<footer>
  <audio id="aud" controls preload="auto"></audio>
  <input type="text" id="why" placeholder="what you saw (saved with the decision)">
  <button class="no" id="reject">Not yet</button>
  <button class="go" id="accept">Accept · next rung</button>
</footer>

<script>
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);

/* Seven rungs. Each one adds a single element, and carries the QUESTION it is
   meant to answer plus a CHECK that can fail. A rung is not accepted because it
   looks nice; it is accepted because the check passes and a human agrees. */
/* RUNGS comes from checks.js so the page and the runner cannot disagree */

let SONG="", MAPS={}, MAP=null, MAPKEY="", LAY=null, LAYBEAT=null, RM=null, RECIPE="", ROOMJS="";
let STEP=1, KNOB=null, LEARN={song:"",steps:[]}, WAVE=null, LIGHT=null, VIEW={t0:0,span:12}, PAL=(new URLSearchParams(location.search).get("pal")||"garrix"),
    DRIVE=(new URLSearchParams(location.search).get("energy")||localStorage.getItem("limelight.drive")||"medium");
const HZ=50;
const dur=m=>(m.song&&m.song.length)||240;

/* ---- the ladder ---------------------------------------------------------- */
function drawLadder(){
  $("ladder").innerHTML=RUNGS.map(r=>{
    /* matched by name, not number: inserting a rung shifts every number above it,
       and matching on the number credited Renjith with accepting a rung he had
       never seen. */
    const rec=LEARN.steps.find(s=>s.name===r.name);
    const st = rec&&rec.accepted ? "done" : r.n===STEP ? "now" : "";
    const mark = rec&&rec.accepted ? '<span class="tick">accepted</span>'
               : r.n===STEP ? '<span class="cur">now</span>'
               : r.n<STEP ? '<span class="lock">skipped</span>' : '<span class="lock">—</span>';
    return `<div class="rung ${st}" data-n="${r.n}">
      <div class="t"><span>${r.n}. ${r.name}</span>${mark}</div>
      <div class="d">${r.adds}</div></div>`}).join("");
  [...document.querySelectorAll(".rung")].forEach(el=>
    el.onclick=()=>{ STEP=+el.dataset.n; rebuild() });
}

/* ---- the checks, one per rung. Each returns a number and whether it passed.
   They are computed from the frames this recipe actually produced, never from
   the settings that produced them, so a check can genuinely fail. ---------- */
/* the checks come from readers/src/checks.js, the same file the command-line
   runner uses -- see the note at the top of it for why there is only one copy */
let CHECKS=null;
function runCheck(n,w0,w1){
  if(!LIGHT||!MAP||!F) return {v:0,ok:false,txt:"nothing rendered yet"};
  CHECKS = makeChecks({MAP, LAY:CURLAY||LAY, F, LIGHT, WAVE, HZ, RUNGS});
  return CHECKS.runCheck(n,w0,w1);
}
function flashTimes(a,b){ return CHECKS ? CHECKS.flashTimes(a,b) : [] }

/* ---- render -------------------------------------------------------------- */
let F=null;
function rebuild(){
  if(!RM||!MAP) return;
  const lay = STEP>=11 ? LAY : LAYBEAT;
  F = RM.mkReader(MAP, lay, "medium", PAL, STEP);
  CURLAY = lay;
  buildLight();
  drawLadder(); drawAll();
  $("rigmeta").textContent=`${lay.fixtures.length} fixtures · rung ${STEP} · ${DRIVE} · ${r_of(STEP).adds}`;
  refreshVerdict();
}
let CURLAY=null;
const r_of=n=>RUNGS[n-1];
/* the verdict is recomputed on its own, so a check whose evidence arrives late
   (the waveform) is not left reading FAIL for a reason that is not the show's */
/* What to look at, and what right and wrong look like. Written on the page rather
   than in a document nobody opens, because the complaint that started this was
   not knowing what was being asked. */
function drawHowto(){
  const r=r_of(STEP);
  $("howto").innerHTML =
    `<div><div class="k">look at</div><div class="v">${r.look}</div></div>` +
    `<div class="ok"><div class="k">right looks like</div><div class="v">${r.good}</div></div>` +
    `<div class="no"><div class="k">wrong looks like</div><div class="v">${r.bad}</div></div>` +
    `<div><div class="k">if it is wrong</div><div class="v">${r.fix}</div></div>`;
}

/* The same check, run once per part of the song. A rung can be right overall and
   wrong in the drop, and the average hides exactly the thing worth seeing. */
function drawParts(){
  const el=$("parts");
  const chs=(MAP.chapters||[]);
  if(!chs.length || !F){ el.innerHTML=""; return }
  const D=dur(MAP);
  el.innerHTML=`<div class="n" style="flex:0 0 auto;padding:4px 6px">checking each part…</div>`;
  setTimeout(()=>{
    const rows=chs.map((c,i)=>{
      const t0=c.at, t1=(i+1<chs.length)?chs[i+1].at:D;
      if(t1-t0 < 2) return null;
      let res; try{ res=runCheck(STEP,t0,t1) }catch(e){
  document.body.innerHTML='<div style="padding:26px;font:14px ui-monospace,monospace;color:#e8705a">'
    + 'This page could not start.<br><br>' + String(e.message||e)
    + '<br><br><span style="color:#8f98ad">If that mentions a route or a 404, the running '
    + 'server is older than the code. Stop it and start it again.</span></div>'; res={ok:false,v:0,txt:"—"} }
      return {name:c.name, t0, t1, res};
    }).filter(Boolean);
    el.innerHTML=rows.map(r=>
      `<div class="p ${r.res.na?"":r.res.ok?"ok":"no"}" data-t="${r.t0}" title="${r.name} · ${r.res.txt}">
         <div class="n">${r.name}</div>
         <div class="z">${r.res.na?"—":r.res.ok?"ok":"look"}</div></div>`).join("");
    [...el.querySelectorAll(".p")].forEach(d=>d.onclick=()=>{
      const t=+d.dataset.t; $("aud").currentTime=t; VIEW.t0=Math.max(0,t-1); drawAll() });
  },0);
}

function refreshVerdict(){
  const r=r_of(STEP), c=runCheck(STEP);
  $("q").innerHTML=`<b>${r.n}.</b> ${r.q}`;
  $("verdict").innerHTML=`${c.txt} &nbsp; <span class="big" style="color:${
    c.na?"var(--faint)":c.ok?"var(--good)":"var(--bad)"}">${
    c.na?"NOTHING TO CHECK":c.ok?"PASS":"FAIL"}</span>`;
  window.__verdict={step:STEP, ok:c.ok, value:+c.v.toFixed(2), said:c.txt};
  drawHowto(); drawParts();
}
function buildLight(){
  const D=dur(MAP), n=Math.floor(D*HZ), out=new Float32Array(n);
  for(let i=0;i<n;i++){ let s=0;
    for(const o of F(i/HZ).fixtures) if("level" in o && !/^fog/.test(o.id)) s+=o.level;
    out[i]=s }
  let mx=0; for(const v of out) if(v>mx) mx=v;
  LIGHT={v:out,max:mx||1};
}
function drawAll(){ drawWave(); drawLight(); drawRig() }
function axis(cv){ const W=cv.clientWidth,H=cv.clientHeight,d=window.devicePixelRatio||1;
  if(cv.width!==W*d||cv.height!==H*d){cv.width=W*d;cv.height=H*d}
  const g=cv.getContext("2d"); g.setTransform(d,0,0,d,0,0); return [g,W,H] }
const X=(t,W)=>(t-VIEW.t0)/VIEW.span*W;
function grid(g,W,H){
  g.strokeStyle="rgba(230,233,241,.18)"; g.lineWidth=1;
  for(const t of (MAP.beats||[])){ if(t<VIEW.t0||t>VIEW.t0+VIEW.span) continue;
    g.beginPath(); g.moveTo(X(t,W),0); g.lineTo(X(t,W),H); g.stroke() }
  g.strokeStyle="rgba(143,154,255,.8)"; g.lineWidth=1.5;
  for(const t of (MAP.downbeats||[])){ if(t<VIEW.t0||t>VIEW.t0+VIEW.span) continue;
    g.beginPath(); g.moveTo(X(t,W),0); g.lineTo(X(t,W),H); g.stroke() }
}
function drawWave(){
  const [g,W,H]=axis($("wave")); g.fillStyle="#0a0c11"; g.fillRect(0,0,W,H);
  if(WAVE){ const dt=WAVE.dt;
    for(const [band,col,sc] of [["peak","rgba(150,160,190,.55)",1],["low","rgba(240,169,60,.85)",.6]]){
      g.fillStyle=col; const A=WAVE[band]||[];
      for(let x=0;x<W;x++){ const t=VIEW.t0+x/W*VIEW.span, i=Math.round(t/dt);
        if(i<0||i>=A.length) continue; const h=A[i]*H*sc;
        g.fillRect(x,(H-h)/2,1,h) } } }
  grid(g,W,H); playhead(g,W,H);
}
function drawLight(){
  const [g,W,H]=axis($("light")); g.fillStyle="#0a0c11"; g.fillRect(0,0,W,H);
  grid(g,W,H);
  if(LIGHT){ g.beginPath(); g.moveTo(0,H);
    for(let x=0;x<W;x++){ const t=VIEW.t0+x/W*VIEW.span, i=Math.round(t*HZ);
      const v=(i>=0&&i<LIGHT.v.length)?LIGHT.v[i]:0;
      g.lineTo(x,H-2-(v/LIGHT.max)*(H-8)) }
    g.lineTo(W,H); g.closePath(); g.fillStyle="rgba(240,169,60,.20)"; g.fill();
    g.strokeStyle="#f0a93c"; g.lineWidth=1.4; g.stroke() }
  playhead(g,W,H);
}
function playhead(g,W,H){ const t=$("aud").currentTime;
  g.strokeStyle="#fff"; g.lineWidth=1.2; g.beginPath();
  g.moveTo(X(t,W),0); g.lineTo(X(t,W),H); g.stroke() }
function drawRig(){ if(RM&&CURLAY) RM.drawFixtures($("rig"), F($("aud").currentTime), CURLAY) }

/* ---- the record ---------------------------------------------------------- */
async function decide(ok){
  const r=RUNGS[STEP-1], c=runCheck(STEP);
  const rec={ n:r.n, name:r.name, accepted:ok, when:new Date().toISOString(),
    map:MAPKEY, colour:PAL, adds:r.adds, question:r.q.replace(/<[^>]+>/g,""),
    check:{ what:r.check, value:+c.v.toFixed(2), passed:c.ok, said:c.txt },
    knob: KNOB,
    said_by_renjith: $("why").value.trim() || null };
  LEARN.steps=LEARN.steps.filter(s=>s.name!==r.name).concat([rec]).sort((a,b)=>a.n-b.n);
  const res=await fetch(`/api/learn?song=${SONG}`,{method:"POST",body:JSON.stringify(LEARN)});
  const j=await res.json();
  $("stat").textContent=j.error?j.error:`saved → ${j.path}`;
  $("why").value="";
  if(ok && STEP<11) STEP++;
  rebuild();
}
$("accept").onclick=()=>decide(true);
$("reject").onclick=()=>decide(false);
$("zoomin").onclick=()=>{ VIEW.span=Math.max(3,VIEW.span/1.6); drawAll() };
$("zoomout").onclick=()=>{ VIEW.span=Math.min(dur(MAP),VIEW.span*1.6); drawAll() };
$("pal").onchange=e=>{ PAL=e.target.value; rebuild() };
$("map").onchange=e=>{ MAPKEY=e.target.value; MAP=MAPS[MAPKEY]; rebuild() };
$("song").onchange=e=>location.href=`/build?song=${e.target.value}`;

(async()=>{
  RECIPE=await (await fetch("/static/recipe_steps.js")).text();
  new Function(await (await fetch("/static/checks.js")).text() + "\n;window.makeChecks=makeChecks; window.RUNGS=RUNGS;")();
  ROOMJS=await (await fetch("/static/room.js")).text();
  RM=new Function("RECIPE",ROOMJS+"\n;return {mkReader,prep,drawRoom,drawFixtures};")(RECIPE);
  SONG=Q.get("song")||"levels";
  const sg=await (await fetch("/api/song?song="+SONG)).json();
  LAY=(sg.layouts||{}).small; LAYBEAT=(sg.layouts||{}).beat||LAY;
  const G=await (await fetch("/api/maps?song="+SONG)).json();
  MAPS=G.maps; SONG=G.song;
  $("song").innerHTML=Object.entries(G.songs).map(([k,v])=>
    `<option value="${k}"${k===SONG?" selected":""}>${v}</option>`).join("");
  MAPKEY = Q.get("map") && MAPS[Q.get("map")] ? Q.get("map")
         : MAPS.answer ? "answer" : Object.keys(MAPS)[0];
  $("map").innerHTML=Object.keys(MAPS).map(k=>
    `<option${k===MAPKEY?" selected":""}>${k}</option>`).join("");
  MAP=MAPS[MAPKEY];
  LEARN=await (await fetch(`/api/learn?song=${SONG}`)).json();
  if(!LEARN.steps) LEARN={song:SONG,steps:[]};
  const done=LEARN.steps.filter(s=>s.accepted&&RUNGS.some(r=>r.name===s.name))
                        .map(s=>RUNGS.find(r=>r.name===s.name).n);
  STEP=Math.min(11,(done.length?Math.max(...done):0)+1);
  const qs=parseInt(Q.get("step")||"",10);        // a rung is linkable
  if(qs>=1&&qs<=11) STEP=qs;
  $("aud").src=`/api/audio?song=${SONG}`;
  // ?t= opens on a moment, so a link can point at the drop rather than the intro
  const qt=parseFloat(Q.get("t")||"");
  if(isFinite(qt)) $("aud").addEventListener("loadedmetadata",
    ()=>{ $("aud").currentTime=qt; VIEW.t0=Math.max(0,qt-2); rebuild() },{once:true});
  fetch(`/api/wave?song=${SONG}`).then(r=>r.json()).then(w=>{
    if(!w.error){ WAVE=w; drawAll(); refreshVerdict() } });
  VIEW={t0:0,span:12};
  rebuild();
  (function loop(){ const t=$("aud").currentTime;
    if(!$("aud").paused){ VIEW.t0=Math.max(0,t-VIEW.span*0.35) }
    drawAll(); requestAnimationFrame(loop) })();
})();
</script>
