<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat the human</title><style>
:root{--bg:#0e1016;--surface:#171a23;--raise:#1e222d;--ink:#e6e9f1;--muted:#959bac;
 --faint:#666c7e;--rule:#252935;--rule2:#373c4d;--tung:#f0a93c;--good:#69be86;--bad:#e88055}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:30px 22px 60px;
 font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:18px;flex-wrap:wrap}
h1{font:700 30px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em;margin:0}
h1 span{color:var(--tung)}
#clock{font:700 26px/1 ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--tung)}
.song{color:var(--muted);font-size:14px;margin:6px 0 0}
.song b{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:5px;padding:20px;
 margin:22px 0 0}
.mono,select,button,td,th{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.pickrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select{background:var(--raise);color:var(--ink);border:1px solid var(--rule2);border-radius:4px;
 padding:11px 13px;font-size:15px;min-width:210px}
.vs{color:var(--faint);font-size:13px}
a.watch{display:block;text-align:center;background:var(--tung);color:#20160a;font-weight:700;
 font-size:17px;padding:15px;border-radius:4px;text-decoration:none;margin:16px 0 0}
.judge{display:flex;gap:10px;margin:18px 0 0;flex-wrap:wrap}
.judge button{flex:1;min-width:150px;background:var(--raise);color:var(--ink);
 border:1px solid var(--rule2);border-radius:4px;padding:13px;font-size:14px;cursor:pointer}
.judge button:hover{border-color:var(--tung)}
.judge button.tie{flex:0 0 auto;min-width:120px;color:var(--faint)}
h2{font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.13em;text-transform:uppercase;
 color:var(--faint);margin:30px 0 9px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 14px 8px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
th{color:var(--faint);font-size:10px;letter-spacing:.09em;text-transform:uppercase}
td.n{font-variant-numeric:tabular-nums}
tr.me td:first-child{color:var(--tung)}
.pill{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.06em;
 text-transform:uppercase;padding:2px 7px;border-radius:2px;background:var(--raise);color:var(--muted)}
.pill.hum{background:#3a2a12;color:var(--tung)}
.pill.mod{background:#1f2338;color:#8f9aff}
#verdicts div{font-family:ui-monospace,monospace;font-size:12px;color:var(--muted);padding:5px 0;
 border-bottom:1px solid var(--rule)}
.note{color:var(--faint);font-size:12.5px;margin:12px 0 0}
</style></head><body><div class="wrap">
<div class="top">
  <h1>Beat the <span>human</span></h1>
  <div id="clock"></div>
</div>
<p class="song">Judging <b id="songname">—</b> · <span id="mapcount">—</span></p>

<div class="card">
  <div class="pickrow">
    <select id="a"></select><span class="vs">against</span><select id="b"></select>
    <input type="file" id="drop" accept=".json,application/json" multiple hidden>
    <button id="dropbtn" style="background:var(--raise);color:var(--ink);
      border:1px dashed var(--rule2);border-radius:4px;padding:11px 14px;font-size:14px;
      cursor:pointer;font-family:ui-monospace,monospace">＋ import a map file</button>
  </div>
  <p class="note" id="imported"></p>
  <iframe id="show" src="" title="the show"
    style="width:100%;height:470px;border:1px solid var(--rule);border-radius:4px;
           margin:16px 0 0;background:#07080c"></iframe>
  <a class="watch" id="watch" href="#" target="_blank">▶ Open it full size</a>
  <div class="judge">
    <button id="vA">← left is closer</button>
    <button id="vT" class="tie">same</button>
    <button id="vB">right is closer →</button>
  </div>
  <p class="note" id="said"></p>
</div>

<h2>Maps handed in</h2>
<table id="maps"></table>

<h2>Your calls</h2>
<div id="verdicts"></div>

<h2>The ladder — our own songs, where the answer is known</h2>
<table id="board"></table>
</div>
<script>
const $=id=>document.getElementById(id);
let SONG="",C={};
const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));
 return [s/3600|0,(s%3600)/60|0,s%60].map(v=>String(v|0).padStart(2,"0")).join(":")};
async function load(){
 const st=await (await fetch("/api/game")).json();
 SONG=st.song; C=st.candidates||{};
 $("songname").textContent=st.song_title||SONG;
 const n=Object.keys(C).length;
 $("mapcount").textContent=n+" map"+(n===1?"":"s")+" handed in";
 if(st.deadline){const end=new Date(st.deadline).getTime();
  const t=()=>$("clock").textContent=fmt(end-Date.now());
  t(); clearInterval(window._t); window._t=setInterval(t,1000)}
 const a=$("a").value,b=$("b").value;
 const opts=Object.entries(C).map(([k,v])=>`<option value="${k}">${v.label||k}</option>`).join("");
 $("a").innerHTML=opts; $("b").innerHTML=opts;
 const keys=Object.keys(C);
 $("a").value=a&&C[a]?a:(keys.includes("renjith")?"renjith":keys[0]||"");
 $("b").value=b&&C[b]?b:(keys.find(k=>k!==$("a").value)||keys[0]||"");
 upd();
 $("maps").innerHTML="<thead><tr><th>who</th><th>how</th><th>beats</th><th>sections</th>"
  +"<th>moments</th><th>updated</th></tr></thead><tbody>"
  +(st.maps.filter(m=>m.song===SONG).map(m=>`<tr class="${m.who==='renjith'?'me':''}">
     <td>${m.who}</td><td><span class="pill ${m.how==='hand-written'?'hum':'mod'}">${m.how}</span></td>
     <td class="n">${m.beats}</td><td class="n">${m.sections}</td><td class="n">${m.moments}</td>
     <td class="n" style="color:var(--faint)">${m.when||""}</td></tr>`).join("")
    ||'<tr><td colspan="6" style="color:var(--faint)">none yet</td></tr>')+"</tbody>";
 $("verdicts").innerHTML=(st.verdicts||[]).length
  ? st.verdicts.slice().reverse().map(v=>`<div>${v.when.slice(11,16)}  ${v.a} vs ${v.b} → ${v.said}</div>`).join("")
  : '<div style="border:0;color:var(--faint)">none yet</div>';
 $("board").innerHTML="<thead><tr><th>who</th><th>levels passed</th><th>mean beats F</th>"
  +"<th>last run</th></tr></thead><tbody>"
  +(st.board.length?st.board.map(r=>`<tr><td>${r.who}</td><td class="n">${r.passed} / ${r.of}</td>
     <td class="n">${r.mean_f}</td><td class="n" style="color:var(--faint)">${r.when}</td></tr>`).join("")
    :'<tr><td colspan="4" style="color:var(--faint)">nobody has run it yet</td></tr>')+"</tbody>";
}
function upd(){
  const u=`/rooms?song=${SONG}&left=${$("a").value}&d=${$("b").value}`;
  $("watch").href=u;
  const bare=u+"&bare=1";
  // show it here rather than only linking to it -- "watch them side by side" was
  // a link to a page nobody clicked, so the board looked empty
  if($("show").dataset.u!==bare){ $("show").dataset.u=bare; $("show").src=bare }
}
$("a").onchange=upd; $("b").onchange=upd;
for(const [id,said] of [["vA","left"],["vT","tie"],["vB","right"]])
 $(id).onclick=async()=>{
  const r=await fetch(`/api/verdict?song=${SONG}&a=${$("a").value}&b=${$("b").value}&said=${said}`,
    {method:"POST"});
  const j=await r.json();
  $("said").textContent=j.error?j.error:"recorded — "+$("a").value+" vs "+$("b").value+": "+said;
  load();
 };
$("dropbtn").onclick=()=>$("drop").click();
$("drop").onchange=async e=>{
  const out=[];
  for(const f of e.target.files){
    // the name decides whose it is: levels.amal.map.json or amal.json -> amal
    const stem=f.name.replace(/\.map\.json$|\.json$/,"");
    const parts=stem.split(".");
    const who=(parts.length>1?parts[parts.length-1]:stem).toLowerCase();
    try{
      const text=await f.text();
      JSON.parse(text);
      const r=await fetch(`/api/upload_map?song=${SONG}&who=${encodeURIComponent(who)}`,
        {method:"POST",body:text});
      const j=await r.json();
      out.push(j.error?`${f.name}: ${j.error}`:`${f.name} → ${j.path}`);
    }catch(err){ out.push(`${f.name}: ${err.message}`) }
  }
  $("imported").textContent=out.join("   ·   ");
  e.target.value="";
  load();
};
load(); setInterval(load,15000);
</script></body></html>
