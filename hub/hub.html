<!-- The hub page: the shared folder, in a browser. List, upload, download, new
     folder. Every request it makes is one the CLI makes too; nothing here is
     special to the page. Styles live in /page/ui.css, shared with the other pages. -->
<title>Hub</title>
<link rel="stylesheet" href="/page/ui.css">

<header class="top">
  <a class="brand" href="/hub/">Limelight</a>
  <span class="remote" id="remote"></span>
</header>

<main class="page">
<p class="crumb" id="crumb">Hub</p>
<div class="hero">
  <h1 class="title" id="title">Hub</h1>
  <div class="actions">
    <label class="btn primary" for="file">Upload files</label>
    <input type="file" id="file" multiple>
    <button id="mkdir">New folder</button>
    <button id="reload" class="quiet">Refresh</button>
  </div>
</div>
<p class="msg" id="msg"></p>

<div class="panel">
<table class="list">
  <thead><tr><th>Name</th><th>Updated</th><th class="r">Size</th><th>Version</th><th>Metadata</th><th>Profiles</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>
<p class="note">Everything here is shared with everyone on this network. Pull a file with
<code>limelight pull &lt;name&gt;</code>. Open a score for its versions, metadata and profiles.
Nothing is deleted from this page; fix a mistake by uploading over it.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const enc = s => s.split("/").map(encodeURIComponent).join("/");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const err = m => { $("msg").textContent = m; if (m) console.error(m); };

const human = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB";
const when = ms => { const d = new Date(ms); return d.toISOString().slice(0, 16).replace("T", " "); };

$("remote").textContent = "LIMELIGHT_REMOTE=" + location.origin + "/hub/score";

function crumbs() {
  const parts = base.replace(/^\/hub\/?/, "").split("/").filter(Boolean);
  let html = `<a href="/hub/">Hub</a>`, href = "/hub/";
  parts.forEach((p, i) => {
    href += enc(p) + "/";
    html += i < parts.length - 1 ? ` / <a href="${href}">${esc(p)}</a>` : ` / ${esc(p)}`;
  });
  $("crumb").innerHTML = html;
  $("title").textContent = parts.length ? parts[parts.length - 1] : "Hub";
  document.title = parts.length ? parts[parts.length - 1] + " — Hub" : "Hub";
}

async function load() {
  err("");
  let r;
  try { r = await fetch(base + "?json"); } catch (e) { return err("The server did not answer: " + e.message); }
  if (!r.ok) return err(`${r.status} ${r.statusText} listing ${base}`);
  const data = await r.json();
  const rows = [];
  const cell = (l, v, cls) => `<td data-l="${l}"${cls ? ` class="${cls}"` : ""}>${v}</td>`;
  if (base !== "/hub/") rows.push(`<tr><td class="n"><a class="dir" href="..">..</a></td><td></td><td></td><td></td><td></td><td></td></tr>`);
  for (const p of data.paths) {
    const dir = p.path_type === "Dir";
    const score = !dir && /\.score$/.test(p.name);
    const a = dir   ? `<a class="dir" href="${base}${enc(p.name)}/">${esc(p.name)}</a>`
            : score ? `<a href="${base}${enc(p.name)}?page">${esc(p.name)}</a>`
                    : `<a href="${base}${enc(p.name)}" download>${esc(p.name)}</a>`;
    const dl = score && p.version ? ` <a class="btn quiet small" href="${base}${enc(p.name)}" download>Download</a>` : "";
    const prof = score ? (p.profiles ? `${p.profiles} profile${p.profiles === 1 ? "" : "s"}` : `<span class="dim">none</span>`) : "";
    const meta = score ? (p.has_metadata ? "yes" : `<span class="dim">none</span>`) : "";
    const ver = score ? (p.version ? `<span class="badge">v${p.version}</span>` : `<span class="dim">no versions</span>`) : "";
    rows.push(`<tr>${cell("", a + dl, "n" + (score ? " name-score" : ""))}${cell("updated", when(p.mtime))}` +
      `${cell("size", dir ? "" : human(p.size), "r")}${cell("version", ver)}${cell("metadata", meta)}${cell("profiles", prof)}</tr>`);
  }
  $("rows").innerHTML = rows.join("") || `<tr><td colspan="6" class="empty">Nothing here yet. Upload a file, or push one with <code>limelight push</code>.</td></tr>`;
}

$("file").addEventListener("change", async e => {
  err("");
  for (const f of e.target.files) {
    const tr = document.createElement("tr"); tr.className = "up";
    tr.innerHTML = `<td class="n">${esc(f.name)}</td><td>Uploading…</td><td class="r">${human(f.size)}</td><td></td><td></td><td></td>`;
    $("rows").prepend(tr);
    try {
      const r = await fetch(base + enc(f.name), { method: "PUT", body: f });
      if (!r.ok) { tr.children[1].textContent = `${r.status} ${r.statusText}`; tr.children[1].className = "f"; continue; }
      tr.children[1].textContent = "Uploaded"; tr.children[1].className = "s";
    } catch (ex) { tr.children[1].textContent = ex.message; tr.children[1].className = "f"; }
  }
  e.target.value = "";
  load();
});

$("mkdir").addEventListener("click", async () => {
  const name = prompt("Folder name");
  if (!name) return;
  if (name.includes("/")) return err("A folder name cannot contain /");
  const r = await fetch(base + enc(name), { method: "MKCOL" });
  if (r.status === 405) return err(`${name} already exists`);
  if (!r.ok) return err(`${r.status} ${r.statusText} creating ${name}`);
  load();
});

$("reload").addEventListener("click", load);
crumbs(); load();
</script>
