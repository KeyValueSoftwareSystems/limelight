<!-- The hub page: the shared folder, in a browser. List, upload, download, new
     folder. Every request it makes is one the CLI makes too; nothing here is
     special to the page. -->
<title>Hub</title>
<style>
:root{--bg:#0a0d13;--pan:#0f141d;--line:#1b2230;--line2:#263047;--ink:#e6e9f0;
  --dim:#9aa3b8;--faint:#5c6478;--amb:#e8a33d;--ok:#5bb98c;--blu:#6fa8dc;--bad:#e06c6c}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:13px/1.55 ui-sans-serif,system-ui,sans-serif;margin:0}
.wrap{max-width:920px;margin:0 auto;padding:18px 18px 70px}
h1{font:600 12px ui-monospace,monospace;letter-spacing:.18em;color:var(--amb);margin:0 0 16px}
h1 a{color:var(--amb);text-decoration:none} h1 a:hover{text-decoration:underline}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
button,label.btn{background:#182031;color:var(--ink);border:1px solid var(--line2);
  border-radius:6px;padding:7px 13px;font:inherit;cursor:pointer}
button:hover,label.btn:hover{border-color:#41506e}
input[type=file]{display:none}
.mono{font:12px ui-monospace,monospace;font-variant-numeric:tabular-nums}
#msg{font:11.5px ui-monospace,monospace;color:var(--bad);white-space:pre-wrap;flex:1;min-width:200px}
table{border-collapse:collapse;width:100%;font:12px ui-monospace,monospace;background:var(--pan);
  border:1px solid var(--line);border-radius:6px}
th{font:600 10px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--blu);
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2)}
td{padding:7px 12px;border-bottom:1px solid #141a26;color:var(--dim);white-space:nowrap}
td.n{color:var(--ink)} td.r{text-align:right;color:var(--amb);font-variant-numeric:tabular-nums}
td a{color:var(--ink);text-decoration:none} td a:hover{text-decoration:underline}
td a.dir{color:var(--blu)} td a.dir::after{content:"/"}
tr.up td{color:var(--faint)} tr.up td.s{color:var(--ok)} tr.up td.f{color:var(--bad)}
.note{color:var(--faint);font-size:12px;margin:10px 0 0}
.empty{padding:26px 12px;color:var(--faint);text-align:center}
.badge{display:inline-block;font:600 10px ui-monospace,monospace;letter-spacing:.08em;color:var(--amb);
  border:1px solid var(--line2);border-radius:4px;padding:1px 5px;margin-left:8px;vertical-align:1px}
button.small{padding:3px 9px;font:11px ui-monospace,monospace;margin-left:8px}
tr.ver td{background:#0b1018;color:var(--dim);padding-left:28px}
tr.ver td.n{color:var(--ink)} tr.ver a{color:var(--blu)} tr.ver .meta-on{color:var(--ok);margin-left:8px;font-size:11px}
tr.edit td{background:#0b1018;padding:10px 12px 12px 28px}
textarea.json{width:100%;min-height:150px;background:#05070b;color:var(--ink);border:1px solid var(--line2);
  border-radius:6px;padding:9px;font:12px/1.5 ui-monospace,monospace;resize:vertical}
.editbar{display:flex;gap:8px;align-items:center;margin-top:8px}
.editbar .err{color:var(--bad);font:11.5px ui-monospace,monospace;white-space:pre-wrap;flex:1}
.editbar .warn{color:var(--amb);font:11.5px ui-monospace,monospace;flex:1}
</style>

<div class="wrap">
<h1 id="crumb">HUB</h1>

<div class="bar">
  <label class="btn" for="file">upload files</label>
  <input type="file" id="file" multiple>
  <button id="mkdir">new folder</button>
  <button id="reload">refresh</button>
  <span id="msg"></span>
</div>

<table>
  <thead><tr><th>name</th><th>modified</th><th style="text-align:right">size</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<p class="note">Anything you upload here everyone on this network can pull with
<span class="mono">limelight pull &lt;name&gt;</span>. Nothing can be deleted from
the page; a mistake is fixed by uploading over it.</p>
</div>

<script>
const $ = id => document.getElementById(id);
const base = location.pathname.endsWith("/") ? location.pathname : location.pathname + "/";
const enc = s => s.split("/").map(encodeURIComponent).join("/");
const err = m => { $("msg").textContent = m; if (m) console.error(m); };

const human = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(2) + " MB";
const when = ms => { const d = new Date(ms); return d.toISOString().slice(0, 16).replace("T", " "); };

function crumbs() {
  const parts = base.replace(/^\/hub\/?/, "").split("/").filter(Boolean);
  let html = `<a href="/hub/">HUB</a>`, href = "/hub/";
  for (const p of parts) { href += enc(p) + "/"; html += ` / <a href="${href}">${p.toUpperCase()}</a>`; }
  $("crumb").innerHTML = html;
}

async function load() {
  err("");
  let r;
  try { r = await fetch(base + "?json"); } catch (e) { return err("cannot reach the server: " + e.message); }
  if (!r.ok) return err(`${r.status} ${r.statusText} listing ${base}`);
  const data = await r.json();
  const rows = [];
  if (base !== "/hub/") rows.push(`<tr><td class="n"><a class="dir" href="..">..</a></td><td></td><td></td></tr>`);
  for (const p of data.paths) {
    const dir = p.path_type === "Dir";
    const score = !dir && /\.score$/.test(p.name) && p.version;
    const a = dir ? `<a class="dir" href="${base}${enc(p.name)}/">${p.name}</a>`
                  : `<a href="${base}${enc(p.name)}" download>${p.name}</a>`;
    const extra = score ? `<span class="badge">v${p.version}</span>` +
      `<button class="small versions" data-name="${enc(p.name)}">versions</button>` : "";
    rows.push(`<tr data-name="${enc(p.name)}"><td class="n">${a}${extra}</td><td>${when(p.mtime)}</td><td class="r">${dir ? "" : human(p.size)}</td></tr>`);
  }
  $("rows").innerHTML = rows.join("") || `<tr><td colspan="3" class="empty">empty — upload something</td></tr>`;
  for (const name of openRows) if (rowFor(name)) showVersions(name);
}

$("file").addEventListener("change", async e => {
  err("");
  for (const f of e.target.files) {
    const tr = document.createElement("tr"); tr.className = "up";
    tr.innerHTML = `<td class="n">${f.name}</td><td>uploading…</td><td class="r">${human(f.size)}</td>`;
    $("rows").prepend(tr);
    try {
      const r = await fetch(base + enc(f.name), { method: "PUT", body: f });
      if (!r.ok) { tr.children[1].textContent = `${r.status} ${r.statusText}`; tr.children[1].className = "f"; continue; }
      tr.children[1].textContent = "done"; tr.children[1].className = "s";
    } catch (ex) { tr.children[1].textContent = ex.message; tr.children[1].className = "f"; }
  }
  e.target.value = "";
  load();
});

$("mkdir").addEventListener("click", async () => {
  const name = prompt("Folder name");
  if (!name) return;
  if (name.includes("/")) return err("a folder name cannot contain /");
  const r = await fetch(base + enc(name), { method: "MKCOL" });
  if (r.status === 405) return err(`${name} already exists`);
  if (!r.ok) return err(`${r.status} ${r.statusText} creating ${name}`);
  load();
});

/* ---- versions of one .score, expanded under its row ----------------------- */
const openRows = new Set();          /* names whose version list is expanded */

function rowFor(name) { return document.querySelector(`tr[data-name="${name}"]`); }
function clearUnder(name) { document.querySelectorAll(`tr[data-under="${name}"]`).forEach(tr => tr.remove()); }

async function showVersions(name) {
  clearUnder(name);
  const r = await fetch(base + name + "?versions");
  if (!r.ok) return err(`${r.status} ${r.statusText} listing versions of ${decodeURIComponent(name)}`);
  const hist = await r.json();
  let after = rowFor(name);
  for (const v of [...hist.versions].reverse()) {
    const tr = document.createElement("tr");
    tr.className = "ver"; tr.dataset.under = name; tr.dataset.version = v.version;
    tr.innerHTML = `<td class="n">v${v.version}${v.version === hist.latest ? ' <span class="badge">latest</span>' : ""}` +
      `${v.has_metadata ? '<span class="meta-on">has metadata</span>' : ""}</td>` +
      `<td>${when(v.mtime)}</td>` +
      `<td class="r"><a href="${base}${name}?v=${v.version}" download>download</a>` +
      `<button class="small edit" data-name="${name}" data-version="${v.version}" data-mergeable="${v.mergeable}">${v.has_metadata ? "edit" : "add"} metadata</button></td>`;
    after.after(tr); after = tr;
  }
}

async function openEditor(name, version, mergeable) {
  document.querySelectorAll("tr.edit").forEach(tr => tr.remove());
  const verRow = document.querySelector(`tr.ver[data-under="${name}"][data-version="${version}"]`);
  const r = await fetch(`${base}${name}?meta&v=${version}`);
  const current = r.ok ? await r.json() : {};
  const tr = document.createElement("tr");
  tr.className = "edit"; tr.dataset.under = name;
  tr.innerHTML = `<td colspan="3">` +
    `<textarea class="json" spellcheck="false">${JSON.stringify(current, null, 1).replace(/</g, "&lt;")}</textarea>` +
    `<div class="editbar"><button class="save">save</button><button class="cancel">cancel</button>` +
    `${mergeable === "false" ? '<span class="warn">this file is not a JSON object, so metadata is stored but will not be folded into downloads</span>' : '<span class="err"></span>'}</div></td>`;
  verRow.after(tr);
  const ta = tr.querySelector("textarea"), msg = tr.querySelector(".err") || tr.querySelector(".warn");
  tr.querySelector(".cancel").onclick = () => tr.remove();
  tr.querySelector(".save").onclick = async () => {
    let obj;
    try { obj = JSON.parse(ta.value); } catch (e) { msg.textContent = "not JSON: " + e.message; return; }
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) { msg.textContent = "metadata must be a JSON object, like {\"author\": \"…\"}"; return; }
    const res = await fetch(`${base}${name}?meta&v=${version}`, { method: "PUT", body: JSON.stringify(obj) });
    if (!res.ok) { msg.textContent = `${res.status} ${res.statusText}: ${await res.text()}`; return; }
    tr.remove();
    await load();
  };
  ta.focus();
}

$("rows").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.classList.contains("versions")) {
    const name = b.dataset.name;
    if (openRows.has(name)) { openRows.delete(name); clearUnder(name); }
    else { openRows.add(name); showVersions(name); }
  }
  if (b.classList.contains("edit")) openEditor(b.dataset.name, b.dataset.version, b.dataset.mergeable);
});

$("reload").addEventListener("click", load);
crumbs(); load();
</script>
